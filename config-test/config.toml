[api_keys]
    tmdb_v3_key = "test-key"
    jellyfin_token = "mock-access-token"
    jellyfin_url = "http://jellyfin-mock:8096"

[language_rules]
    fallback_language = "en"

[metadata]
    age_rating_cascade = [ ]

    [metadata.age_rating_map]

[behavior]
    overwrite_nfo = true
    fetch_images = false
    tell_jellyfin = true
    scan_workers = 1
    job_workers = 2
    verify_files = true
    scan_threads = 4
    scan_interval_hours = 0
    scan_episode_cap = 0
    tv_image_cache_mb = 2048
    notifications_webhook = ""
    notify_on_scan_done = true
    notify_on_no_match = false
    notify_on_write_failed = true
    notify_on_drift = false
    notify_on_crash = true

[[libraries]]
    jellyfin_id = "movies-lib-id"
    name = "Movies"
    collection_type = "movies"
    jellyfin_path = ""
    local_path = "/media/movies"
    skip = false

[[libraries]]
    jellyfin_id = "tv-lib-id"
    name = "TV Shows"
    collection_type = "tvshows"
    jellyfin_path = ""
    local_path = "/media/tv"
    skip = false

[chromecast]
