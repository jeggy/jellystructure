services:
  jellystructure:
    build: .
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "9505:9505"
    volumes:
      - ./config:/config
      - ${MEDIA_PATH:-./media}:/media:rw
    environment:
      CONFIG_FILE: /config/config.toml
      SESSIONS_FILE: /config/sessions.json
      FRONTEND_DIR: /app/frontend
      SERVER_PORT: 9505
      # Phase 318 (FR-318-1) — the Dockerfile sets this too, and that is the durable half; this line is
      # what lets a RUNNING deployment pick it up by recreating the container from the image it already
      # has, with no rebuild. Without it every MKVToolNix call (mkvmerge -J, mkvpropedit, mkvextract)
      # mishandles a non-ASCII path -- 30 % of this library's matroska files. Same value in both places.
      LANG: C.UTF-8
    restart: unless-stopped
    networks:
      - jellystructure

networks:
  jellystructure:
    driver: bridge
    # Phase 4: to share this network with Jellyfin, add the jellystructure network
    # to your Jellyfin docker-compose and set external: true here.
