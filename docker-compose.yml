services:
  jellystructure:
    build: .
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "9505:9505"
    volumes:
      - ./config:/config
      - ${MEDIA_PATH:-./media}:/media:rw
    environment:
      CONFIG_FILE: /config/config.toml
      SESSIONS_FILE: /config/sessions.json
      FRONTEND_DIR: /app/frontend
      SERVER_PORT: 9505
    restart: unless-stopped
    networks:
      - jellystructure

networks:
  jellystructure:
    driver: bridge
    # Phase 4: to share this network with Jellyfin, add the jellystructure network
    # to your Jellyfin docker-compose and set external: true here.
