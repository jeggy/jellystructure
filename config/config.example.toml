[api_keys]
tmdb_v3_key = ""
jellyfin_token = ""
jellyfin_url = ""

[language_rules]
fallback_language = "en"

[behavior]
overwrite_nfo = false
fetch_images = true

# One [[libraries]] entry per Jellyfin library.
# jellyfin_id is the Id returned by GET /Library/VirtualFolders.
# Set skip = true for libraries you don't want Jellystructure to manage.
# Entries are created/updated from the Library Mapping section in Settings.

