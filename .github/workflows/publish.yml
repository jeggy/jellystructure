name: Publish

# FR-167-6/7, extended 2026-08-27, retagged 2026-09-13 — pushes to GHCR on two occasions:
#  - every push to main: unversioned continuous build, tagged with the commit SHA only. `latest` no
#    longer follows main day to day — it only moves on a deliberate release, so a plain `docker compose
#    pull` against `:latest` can't pick up an unreviewed main commit.
#  - a GitHub Release being published (Releases -> Draft a new release -> Publish release): tagged
#    `latest` + the release's own MAJOR.MINOR version.
# workflow_dispatch re-publishes an existing released version on demand (latest + version, same as a
# real release).
#
# Phase 231 — NOTHING below publishes before CI passes. The `ci` job runs the whole reusable CI
# workflow (fences, 342 backend + 126 client unit tests, the R8 release APK verified by ART on an
# emulator, the e2e stack) against the exact commit being published; the GHCR push and the Play Store
# deploy both `needs: ci`. A release therefore publishes only if ITS OWN CI run is green — there is no
# longer any "check the push run first" rule to remember. The Play deploy is a job of this pipeline
# (it used to be its own `release:`-triggered workflow, racing CI and the images).
#
# Versioning is a plain two-part number (MAJOR.MINOR), NOT SemVer — no patch segment, no pre-release/
# build metadata. Starts at 1.0. The release's tag is the single source of truth (no VERSION file to keep
# in sync); tag shape is validated below and anything outside v<digits>.<digits> fails the job rather
# than silently no-op'ing or publishing something unexpected.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to (re-)publish, e.g. 1.0 — must match an existing vX.Y tag's commit"
        required: true

permissions:
  contents: read
  packages: write

# Phase 231 — a newer push to main supersedes the pipeline of the one before it (each run is a full CI:
# ~40 min of e2e). A release or a manual re-publish is NEVER cancelled: its group is its own tag.
concurrency:
  group: publish-${{ github.event_name }}-${{ github.event.release.tag_name || inputs.version || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve and validate version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Continuous main-push build: no release version, tagged with the commit SHA only.
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ inputs.version }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          RAW="${TAG#v}"
          if ! [[ "$RAW" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$RAW' (from tag '$TAG') is not a plain MAJOR.MINOR number (e.g. 1.0) — refusing to publish."
            exit 1
          fi
          echo "version=$RAW" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.version.outputs.tag }}

  publish:
    needs: [version, ci]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: jellystructure
            dockerfile: Dockerfile
          - image: ravilo-web
            dockerfile: ravilo-web/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}"
          VERSION="${{ needs.version.outputs.version }}"
          if [ -n "$VERSION" ]; then
            # Release (or workflow_dispatch re-publish) — latest + the version, no bare-SHA tag.
            TAGS="$IMAGE:latest"$'\n'"$IMAGE:$VERSION"
          else
            # Plain push to main — SHA only, so `latest` never moves on an unreviewed commit.
            TAGS="$IMAGE:${{ github.sha }}"
          fi
          {
            echo "tags<<TAGEOF"
            echo "$TAGS"
            echo "TAGEOF"
          } >> "$GITHUB_OUTPUT"
          # Phase 224 (FR-224-6) — what the image reports as its version at runtime: the release's own
          # number, or the short sha for a continuous main build. A build-arg placed after the compile
          # layers in both Dockerfiles, so it never invalidates the cached build.
          echo "build_version=${VERSION:-${GITHUB_SHA::8}}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            BUILD_VERSION=${{ steps.tags.outputs.build_version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # R215 — the Play Store internal track, on a published release only, and only after CI (231).
  play-store:
    needs: [version, ci, publish]
    if: github.event_name == 'release'
    uses: ./.github/workflows/deploy-play-store.yml
    with:
      version: ${{ needs.version.outputs.version }}
      track: internal
      skip_ci: true   # this pipeline's own `ci` job already gated it
    secrets: inherit
