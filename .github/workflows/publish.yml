name: Publish

# FR-167-6/7, extended 2026-08-27, retagged 2026-09-13 — pushes to GHCR on two occasions:
#  - every push to main: unversioned continuous build, tagged with the commit SHA only. `latest` no
#    longer follows main day to day — it only moves on a deliberate release, so a plain `docker compose
#    pull` against `:latest` can't pick up an unreviewed main commit.
#  - a GitHub Release being published (Releases -> Draft a new release -> Publish release): tagged
#    `latest` + the release's own MAJOR.MINOR version.
# workflow_dispatch re-publishes an existing released version on demand (latest + version, same as a
# real release).
#
# Phase 231 — NOTHING below publishes before CI passes. The `ci` job runs the whole reusable CI
# workflow (fences, 342 backend + 126 client unit tests, the R8 release APK verified by ART on an
# emulator, the e2e stack) against the exact commit being published; the GHCR push and the Play Store
# deploy both `needs: ci`. A release therefore publishes only if ITS OWN CI run is green — there is no
# longer any "check the push run first" rule to remember. The Play deploy is a job of this pipeline
# (it used to be its own `release:`-triggered workflow, racing CI and the images).
#
# Versioning is a plain two-part number (MAJOR.MINOR), NOT SemVer — no patch segment, no pre-release/
# build metadata. Starts at 1.0. The release's tag is the single source of truth (no VERSION file to keep
# in sync); tag shape is validated below and anything outside v<digits>.<digits> fails the job rather
# than silently no-op'ing or publishing something unexpected.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to (re-)publish, e.g. 1.0 — must match an existing vX.Y tag's commit"
        required: true

permissions:
  # R264 — contents: write (not just read) so the tizen-tv job below can attach the signed .wgt to the
  # release via `gh release upload`.
  contents: write
  packages: write

# Phase 231 — each run is a full CI (~2 h with the e2e and both image builds). DEB-2460/DEB-2435 — a run that has started
# always finishes: a newer push no longer cancels it. GitHub keeps at most one pending run per group and a newer push replaces
# the pending one, so the queue is one running run plus the newest SHA waiting. (Cancelling every run on each push meant no
# run reached `publish` while several seats pushed docs every ~15 min.) A release or a manual re-publish has its own group.
concurrency:
  group: publish-${{ github.event_name }}-${{ github.event.release.tag_name || inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve and validate version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Continuous main-push build: no release version, tagged with the commit SHA only.
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ inputs.version }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          RAW="${TAG#v}"
          if ! [[ "$RAW" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$RAW' (from tag '$TAG') is not a plain MAJOR.MINOR number (e.g. 1.0) — refusing to publish."
            exit 1
          fi
          echo "version=$RAW" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.version.outputs.tag }}

  # The two images that are deployed as a pair. The A/V sync sidecar is NOT in this matrix (DEB-3118, FR-317-44): a matrix
  # leg that fails cancels its siblings and skips every `needs: publish` job below, and the sidecar is optional.
  publish:
    needs: [version, ci]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # DEB-1490 (FR-3, FR-5) — jellystructure and ravilo-web are one manifest list for amd64 + arm64: the Kotlin/Native
          # arm64 executable is cross-compiled by the (amd64) builder stage, and only the runtime stage runs under QEMU.
          # `smoke_*` is the arm64 start-up check that runs after the push (FR-5); an image without it is not smoked.
          - image: jellystructure
            dockerfile: Dockerfile
            platforms: linux/amd64,linux/arm64
            smoke_port: 9505
            smoke_path: /api/health
          - image: ravilo-web
            dockerfile: ravilo-web/Dockerfile
            platforms: linux/amd64,linux/arm64
            smoke_port: 8080
            smoke_path: /
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag || github.sha }}

      # DEB-1490 FR-3 — the arm64 runtime stage's RUN steps (apt-get, the dovi_tool download) execute under QEMU, and so
      # does the FR-5 smoke below. The Kotlin/Native compile does not: it runs on the amd64 builder.
      - name: Set up QEMU
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}"
          VERSION="${{ needs.version.outputs.version }}"
          if [ -n "$VERSION" ]; then
            # Release (or workflow_dispatch re-publish) — latest + the version, no bare-SHA tag.
            TAGS="$IMAGE:latest"$'\n'"$IMAGE:$VERSION"
          else
            # Plain push to main — SHA only, so `latest` never moves on an unreviewed commit.
            TAGS="$IMAGE:${{ github.sha }}"
          fi
          {
            echo "tags<<TAGEOF"
            echo "$TAGS"
            echo "TAGEOF"
          } >> "$GITHUB_OUTPUT"
          # Phase 224 (FR-224-6) — what the image reports as its version at runtime: the release's own
          # number, or the short sha for a continuous main build. A build-arg placed after the compile
          # layers in both Dockerfiles, so it never invalidates the cached build.
          echo "build_version=${VERSION:-${GITHUB_SHA::8}}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            BUILD_VERSION=${{ steps.tags.outputs.build_version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # DEB-1490 acceptance 1 — the pushed manifest list names exactly the platforms this image is built for.
      - name: Verify the manifest platforms
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}"
          docker buildx imagetools inspect "$IMAGE@${{ steps.build.outputs.digest }}" | tee /tmp/manifest.txt
          for p in ${PLATFORMS//,/ }; do
            grep -q "Platform:[[:space:]]*$p\$" /tmp/manifest.txt || { echo "::error::$IMAGE has no $p manifest"; exit 1; }
          done
          for p in linux/amd64 linux/arm64; do
            case ",$PLATFORMS," in *",$p,"*) ;; *)
              if grep -q "Platform:[[:space:]]*$p\$" /tmp/manifest.txt; then echo "::error::$IMAGE unexpectedly lists $p"; exit 1; fi ;;
            esac
          done
        env:
          PLATFORMS: ${{ matrix.platforms }}

      # DEB-1490 FR-5 — the arm64 image the push just made starts, under QEMU, from the digest it pushed (a release has no
      # SHA tag, so the digest is the one name every trigger has). It catches what a cross build can hide: a missing shared
      # library, the wrong ld-linux, a binary for the wrong architecture. It is not a behaviour test.
      # DEB-1602 — advisory (continue-on-error; Tróndur's decision, see FR-5's 2026-10-17 amendment) and bounded: a
      # connection QEMU accepts and never answers hung the v1.54 release run for 42 min and held back every deploy job. The step has a timeout, curl has its own, and the loop gives up at a wall-clock deadline that sits
      # inside the step's, so the failure path below (which prints the container's log) runs before the runner would kill it.
      - name: Smoke the arm64 image
        if: matrix.smoke_port != ''
        timeout-minutes: 10
        continue-on-error: true   # advisory since 2026-10-17: a QEMU hang must never skip the four deploy jobs (DEB-1602)
        env:
          REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          PORT: ${{ matrix.smoke_port }}
          SMOKE_PATH: ${{ matrix.smoke_path }}
        run: |
          timeout 240 docker pull --platform linux/arm64 "$REF"
          ARCH=$(timeout 30 docker image inspect --format '{{.Architecture}}' "$REF")
          [ "$ARCH" = "arm64" ] || { echo "::warning::$REF pulled as $ARCH, not arm64"; exit 1; }
          CONFIG=$(mktemp -d)
          chmod 777 "$CONFIG"   # the image runs as uid 1000; /config starts empty
          docker run -d --name smoke --platform linux/arm64 -p "$PORT:$PORT" -v "$CONFIG:/config" "$REF"
          SECONDS=0
          for i in $(seq 1 60); do
            CODE=$(curl -s --connect-timeout 3 --max-time 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT$SMOKE_PATH" || true)
            if [ "$CODE" = "200" ]; then echo "GET $SMOKE_PATH -> 200 after ~$((i * 5))s"; exit 0; fi
            [ "$(timeout 10 docker inspect -f '{{.State.Running}}' smoke)" = "true" ] || break
            [ "$SECONDS" -lt 300 ] || break
            sleep 5
          done
          echo "::warning::arm64 $REF did not answer GET $SMOKE_PATH with 200 (last: ${CODE:-none})"
          # DEB-1602 — what a release-only hang needs to be told apart: the container state, whether the host port is
          # listening, what the published port says versus what the app says from inside, and the app's own log.
          docker ps -a --filter name=smoke || true
          ss -ltn "sport = :$PORT" || true
          echo "--- via the published port"; curl -sv --connect-timeout 3 --max-time 5 "http://127.0.0.1:$PORT$SMOKE_PATH" || true
          echo "--- from inside the container"; timeout 20 docker exec smoke wget -qO- -T 5 "http://127.0.0.1:$PORT$SMOKE_PATH" || true
          echo "--- docker logs smoke"; docker logs smoke || true
          exit 1

  # Phase 317 (FR-317-1, FR-317-44; DEB-3118) — the A/V sync sidecar, in its own job so that a build of it that fails stops
  # only itself: nothing `needs` this job, so the two images above and the four client deploys below still run. The run
  # still ends `failure` (no continue-on-error): the CI watch reads a run's conclusion. The display name is the matrix's,
  # kept exactly. Context is the repo root, like the others: its Dockerfile copies `avsync/*.py`. No Gradle/Konan cache
  # mounts, so scripts/check-docker-cache-ids.sh's list is unchanged. Its weights come from our own pinned image
  # (FR-317-43), so no step contacts the weights' university host.
  publish-avsync:
    name: publish (jellystructure-avsync, avsync/Dockerfile, linux/amd64)
    needs: [version, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/jellystructure-avsync"
          VERSION="${{ needs.version.outputs.version }}"
          if [ -n "$VERSION" ]; then
            TAGS="$IMAGE:latest"$'\n'"$IMAGE:$VERSION"
          else
            TAGS="$IMAGE:${{ github.sha }}"
          fi
          {
            echo "tags<<TAGEOF"
            echo "$TAGS"
            echo "TAGEOF"
          } >> "$GITHUB_OUTPUT"
          echo "build_version=${VERSION:-${GITHUB_SHA::8}}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: avsync/Dockerfile
          platforms: linux/amd64   # CUDA PyTorch base: NVIDIA hosts only (DEB-1490 scope)
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            BUILD_VERSION=${{ steps.tags.outputs.build_version }}
          cache-from: type=gha,scope=jellystructure-avsync
          cache-to: type=gha,mode=max,scope=jellystructure-avsync

      - name: Verify the manifest platforms
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/jellystructure-avsync"
          docker buildx imagetools inspect "$IMAGE@${{ steps.build.outputs.digest }}" | tee /tmp/manifest.txt
          grep -q "Platform:[[:space:]]*linux/amd64\$" /tmp/manifest.txt || { echo "::error::$IMAGE has no linux/amd64 manifest"; exit 1; }
          if grep -q "Platform:[[:space:]]*linux/arm64\$" /tmp/manifest.txt; then echo "::error::$IMAGE unexpectedly lists linux/arm64"; exit 1; fi

  # R215 — the Play Store closed testing track (`alpha` is the Publishing API's name for it), on a
  # published release only, and only after CI (231).
  play-store:
    needs: [version, ci, publish]
    if: github.event_name == 'release'
    uses: ./.github/workflows/deploy-play-store.yml
    with:
      version: ${{ needs.version.outputs.version }}
      track: alpha
      skip_ci: true   # this pipeline's own `ci` job already gated it
    secrets: inherit

  # R264 — the Tizen TV .wgt, signed with the Ravilo Samsung certificate and attached to the release, on
  # a published release only, and only after CI (231). Does not touch the Samsung TV Seller Office —
  # see deploy-tizen-tv.yml's header for why that step stays manual.
  tizen-tv:
    needs: [version, ci, publish]
    if: github.event_name == 'release'
    uses: ./.github/workflows/deploy-tizen-tv.yml
    with:
      version: ${{ needs.version.outputs.version }}
      skip_ci: true   # this pipeline's own `ci` job already gated it
    secrets: inherit

  # R331 — Ravilo for Mac: `ravilo-mac-<N>.dmg`, signed with our own certificate, attached to the release with its
  # install paragraph, on a published release only, and only after CI (231). R331 D1 said "once R328–R330 are ✓ Built";
  # the owner moved it on 2026-09-30 (v1.47 and v1.48 had the .dmg attached by hand).
  mac:
    needs: [version, ci, publish]
    if: github.event_name == 'release'
    uses: ./.github/workflows/deploy-macos.yml
    with:
      version: ${{ needs.version.outputs.version }}
      skip_ci: true   # this pipeline's own `ci` job already gated it
    secrets: inherit

  # R334 — the Linux Flatpak bundle attached to the release, and the pull request to Flathub (with FLATHUB_TOKEN set;
  # without it the step says so and skips), on a published release only, and only after CI (231). Wired 2026-09-30 on
  # the owner's ask for a Flathub publish on every release (R334 D1 was "once R333 is ✓ Built"; the owner moved it).
  linux:
    needs: [version, ci, publish]
    if: github.event_name == 'release'
    uses: ./.github/workflows/deploy-linux.yml
    with:
      version: ${{ needs.version.outputs.version }}
      skip_ci: true   # this pipeline's own `ci` job already gated it
    secrets: inherit

  # The latest release as latest.json + badge.json on the `release-info` branch (owner, 2026-10-01): last, once every
  # platform has attached its file or failed, so jellystructure.jebster.net's download buttons list what is really there.
  release-info:
    needs: [play-store, tizen-tv, mac, linux]
    if: ${{ always() && github.event_name == 'release' }}
    uses: ./.github/workflows/release-info.yml
