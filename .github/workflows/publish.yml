name: Publish Docker images

# FR-167-6/7 — publish-only, gated behind a real GitHub Release, not a bare tag push. ci.yml already
# builds and tests the Docker image on every push/PR; this workflow only runs when someone deliberately
# publishes a release (GitHub UI: Releases -> Draft a new release -> Publish release), so `latest` only
# ever moves on that action, never on every commit or even every tag push.
#
# Versioning is a plain two-part number (MAJOR.MINOR), NOT SemVer — no patch segment, no pre-release/
# build metadata. Starts at 1.0. The release's tag is the single source of truth (no VERSION file to keep
# in sync); tag shape is validated below and anything outside v<digits>.<digits> fails the job rather
# than silently no-op'ing or publishing something unexpected.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to (re-)publish, e.g. 1.0 — must match an existing vX.Y tag's commit"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve and validate version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ inputs.version }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          RAW="${TAG#v}"
          if ! [[ "$RAW" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$RAW' (from tag '$TAG') is not a plain MAJOR.MINOR number (e.g. 1.0) — refusing to publish."
            exit 1
          fi
          echo "version=$RAW" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: jellystructure
            dockerfile: Dockerfile
          - image: ravilo-web
            dockerfile: ravilo-web/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
