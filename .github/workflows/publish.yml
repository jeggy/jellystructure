name: Publish Docker images

# FR-167-6/7, extended 2026-08-27 — pushes to GHCR on two occasions:
#  - every push to main: unversioned continuous build, tagged `latest` + the commit SHA. This is what
#    keeps `latest` following main day to day.
#  - a GitHub Release being published (Releases -> Draft a new release -> Publish release): versioned
#    build, additionally tagged with the release's own MAJOR.MINOR version.
# workflow_dispatch re-publishes an existing released version on demand.
#
# Versioning is a plain two-part number (MAJOR.MINOR), NOT SemVer — no patch segment, no pre-release/
# build metadata. Starts at 1.0. The release's tag is the single source of truth (no VERSION file to keep
# in sync); tag shape is validated below and anything outside v<digits>.<digits> fails the job rather
# than silently no-op'ing or publishing something unexpected.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to (re-)publish, e.g. 1.0 — must match an existing vX.Y tag's commit"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve and validate version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Continuous main-push build: no release version, tags are latest + commit SHA only.
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ inputs.version }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          RAW="${TAG#v}"
          if ! [[ "$RAW" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$RAW' (from tag '$TAG') is not a plain MAJOR.MINOR number (e.g. 1.0) — refusing to publish."
            exit 1
          fi
          echo "version=$RAW" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: jellystructure
            dockerfile: Dockerfile
          - image: ravilo-web
            dockerfile: ravilo-web/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}"
          VERSION="${{ needs.version.outputs.version }}"
          TAGS="$IMAGE:latest"$'\n'"$IMAGE:${{ github.sha }}"
          if [ -n "$VERSION" ]; then
            TAGS="$IMAGE:$VERSION"$'\n'"$TAGS"
          fi
          {
            echo "tags<<TAGEOF"
            echo "$TAGS"
            echo "TAGEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
