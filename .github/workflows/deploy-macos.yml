name: Deploy — Ravilo for Mac (.dmg)

# R331 — builds Ravilo for the Mac (R328–R330), signs the whole bundle with the ONE code-signing certificate of our
# own, verifies it, and makes `ravilo-mac-<N>.dmg`.
#
# ── No Apple account, ever (owner, 2026-09-29) ──────────────────────────────────────────────────────────────────
# There is no Developer ID and no notarisation. The app is signed with a self-signed certificate made once on the
# MacBook and kept in two repository secrets. macOS records a Gatekeeper approval, a Keychain item's access and the
# Local Network permission by the app's designated requirement — its bundle id plus the certificate that signed it —
# so a Mac approves Ravilo once (System Settings → Privacy & Security → Open Anyway) and every later release opens,
# keeps its sign-in and keeps its permissions without asking. An ad-hoc signature would ask again on every update,
# which is why a missing secret FAILS this job instead of falling back to one.
#
# ── The secrets (made once; the .p12 and its password also live in the household's password manager) ──────────
#   MACOS_SIGNING_P12_BASE64    base64 -i ravilo-signing.p12   (the whole output, one line)
#   MACOS_SIGNING_P12_PASSWORD  the password given to `openssl pkcs12 -export`
# The certificate is made once, on a Mac, with the steps in ravilo-desktop/README.md (a 20-year self-signed
# code-signing certificate named "Ravilo"). Losing it costs every Mac one more Open Anyway.
#
# ── The update (R386) ────────────────────────────────────────────────────────────────────────────────────────────
# The app updates itself with Sparkle 2, from the release it was installed from. Every .dmg therefore has a sibling,
# `appcast.xml` — one item, the release itself — signed with an EdDSA key whose public half is committed
# (ravilo-desktop/sparkle/SUPublicEDKey.txt, baked into the bundle) and whose private half is one more secret:
#   SPARKLE_ED_PRIVATE_KEY      the file `generate_keys -x` writes (ravilo-desktop/README.md, "The update key")
# Sparkle's own helpers are signed with the Ravilo identity like everything else: a missing secret fails here, by name,
# and nothing is uploaded.
#
# ── When it runs (R331 D1) ───────────────────────────────────────────────────────────────────────────────────────
# By hand (workflow_dispatch on an existing vX.Y tag, or on `main` via the `ref` input before any tag carries the
# Mac app) it keeps the .dmg as this run's artifact and touches no release. It attaches to a GitHub release only when
# called from publish.yml on a published release — its `mac` job, wired 2026-09-30 on the owner's ask (D1 had waited
# for R328–R330 to be ✓ Built).

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      skip_ci:
        description: "true only when the caller has already run ci.yml for this commit"
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 1.44 — must match an existing vX.Y tag"
        required: true
      skip_ci:
        description: "Skip the CI gate (only for a tag whose commit already passed CI)"
        type: boolean
        required: false
        default: false
      ref:
        description: "Build this branch or commit instead of the vX.Y tag (e.g. main) — for a .dmg before any release carries one; `version` then only labels it"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      package_version: ${{ steps.resolve.outputs.package_version }}
    steps:
      - name: Resolve and validate version
        id: resolve
        env:
          RAW_VERSION: ${{ inputs.version }}
          REF_INPUT: ${{ inputs.ref }}
        run: |
          RAW="${RAW_VERSION#v}"
          if ! [[ "$RAW" =~ ^([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Version '$RAW' is not a plain MAJOR.MINOR number (e.g. 1.44) — refusing to build."
            exit 1
          fi
          if [ "${BASH_REMATCH[1]}" -lt 1 ]; then
            echo "::error::jpackage needs a MAJOR of at least 1 (R331 dev review 4); '$RAW' has ${BASH_REMATCH[1]}."
            exit 1
          fi
          echo "tag=v$RAW" >> "$GITHUB_OUTPUT"
          if [ -n "$REF_INPUT" ] && ! [[ "$REF_INPUT" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::'$REF_INPUT' is not a branch, tag or commit name."
            exit 1
          fi
          echo "ref=${REF_INPUT:-v$RAW}" >> "$GITHUB_OUTPUT"
          echo "version=$RAW" >> "$GITHUB_OUTPUT"
          echo "package_version=$RAW.0" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    if: ${{ !inputs.skip_ci }}
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.version.outputs.ref }}

  build:
    needs: [version, ci]
    if: ${{ always() && needs.version.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: macos-15   # Apple Silicon (R331 D3), free on a public repository
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      # First, before anything slow: a missing secret fails in seconds and says which one (FR-R331-3).
      - name: The signing secrets are there
        env:
          P12_B64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          P12_PW: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          missing=()
          [ -n "$P12_B64" ] || missing+=("MACOS_SIGNING_P12_BASE64")
          [ -n "$P12_PW" ] || missing+=("MACOS_SIGNING_P12_PASSWORD")
          [ -n "$SPARKLE_KEY" ] || missing+=("SPARKLE_ED_PRIVATE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secret(s): ${missing[*]}. The Mac app is signed with the Ravilo certificate, never ad hoc (R331 FR-R331-3) — an ad-hoc build would make every Mac approve every update again — and every release carries an appcast signed with the update key (R386 FR-R386-2). See ravilo-desktop/README.md for how to create them."
            exit 1
          fi
          # R386 — the public half is committed; a bundle without it could never verify an update.
          if ! grep -Eq '^[A-Za-z0-9+/]{43}=$' ravilo-desktop/sparkle/SUPublicEDKey.txt 2>/dev/null; then
            echo "::error::ravilo-desktop/sparkle/SUPublicEDKey.txt is missing or is not a Sparkle public key (44 base64 characters). Make the key pair once — ravilo-desktop/README.md, \"The update key\"."
            exit 1
          fi
          echo "KEYCHAIN=$RUNNER_TEMP/ravilo-signing.keychain-db" >> "$GITHUB_ENV"

      - name: A temporary keychain with the Ravilo certificate
        id: keychain
        env:
          P12_B64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          P12_PW: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          P12="$RUNNER_TEMP/ravilo-signing.p12"
          if ! printf '%s' "$P12_B64" | base64 --decode > "$P12" 2>/dev/null || [ ! -s "$P12" ]; then
            echo "::error::MACOS_SIGNING_P12_BASE64 does not decode as base64. Re-create it with: base64 -i ravilo-signing.p12 | pbcopy — and paste the whole line."
            exit 1
          fi
          # The certificate's SHA-1 names the identity exactly, whatever else the runner's keychains hold.
          if ! openssl pkcs12 -in "$P12" -clcerts -nokeys -passin env:P12_PW -out "$RUNNER_TEMP/ravilo-signing.pem" 2>/dev/null \
             && ! openssl pkcs12 -legacy -in "$P12" -clcerts -nokeys -passin env:P12_PW -out "$RUNNER_TEMP/ravilo-signing.pem" 2>/dev/null; then
            echo "::error::The .p12 in MACOS_SIGNING_P12_BASE64 does not open with MACOS_SIGNING_P12_PASSWORD."
            exit 1
          fi
          SHA1=$(openssl x509 -in "$RUNNER_TEMP/ravilo-signing.pem" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')
          SUBJECT=$(openssl x509 -in "$RUNNER_TEMP/ravilo-signing.pem" -noout -subject)
          echo "Signing certificate: $SUBJECT (SHA-1 $SHA1)"

          KC_PW=$(openssl rand -hex 24)
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          if ! security import "$P12" -k "$KEYCHAIN" -P "$P12_PW" -f pkcs12 -T /usr/bin/codesign; then
            # R331 dev review 1 — only if macOS refuses a modern PKCS#12: re-wrap it in the legacy form, once.
            echo "security import refused the .p12; re-wrapping it with openssl's legacy algorithms and trying again."
            openssl pkcs12 -in "$P12" -passin env:P12_PW -nodes -out "$RUNNER_TEMP/ravilo-signing.all.pem"
            openssl pkcs12 -export -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 \
              -in "$RUNNER_TEMP/ravilo-signing.all.pem" -name Ravilo -passout env:P12_PW -out "$P12"
            rm -f "$RUNNER_TEMP/ravilo-signing.all.pem"
            security import "$P12" -k "$KEYCHAIN" -P "$P12_PW" -f pkcs12 -T /usr/bin/codesign
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$P12"
          echo "identity=$SHA1" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the Swift library and the app
        run: |
          # R386 — only a by-hand run (never a release) is built to honour the debug feed override and a local feed.
          ./gradlew :ravilo-desktop:buildMacNative :ravilo-desktop:createDistributable \
            -Pravilo.macPackageVersion=${{ needs.version.outputs.package_version }} \
            -Pravilo.updateFeedOverride=${{ github.event_name == 'workflow_dispatch' }} \
            -Pjellystructure.version=$VERSION --no-daemon
          APP=ravilo-desktop/build/compose/binaries/main/app/Ravilo.app
          test -d "$APP" || { echo "::error::createDistributable produced no Ravilo.app"; exit 1; }
          LIB=$(find "$APP" -name libravilo-mac.dylib | head -1)
          test -n "$LIB" || { echo "::error::libravilo-mac.dylib is not in the bundle (R328 FR-R328-4)"; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "Swift library: $LIB"
          # R386 (FR-R386-1) — Sparkle is in the bundle, the update key is in its Info.plist, and there is no feed URL.
          SPARKLE_DIR=$(echo "$PWD"/ravilo-desktop/build/sparkle/Sparkle-*/)   # trailing slash: the directory, not the .tar.xz beside it
          SPARKLE_DIR=${SPARKLE_DIR%/}
          test -d "$APP/Contents/Frameworks/Sparkle.framework" || { echo "::error::Sparkle.framework is not in Contents/Frameworks (R386 FR-R386-1)"; exit 1; }
          test -x "$SPARKLE_DIR/bin/sign_update" || { echo "::error::Sparkle's sign_update was not fetched into $SPARKLE_DIR"; exit 1; }
          PLIST="$APP/Contents/Info.plist"
          PUBKEY=$(tr -d '[:space:]' < ravilo-desktop/sparkle/SUPublicEDKey.txt)
          [ "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$PLIST")" = "$PUBKEY" ] \
            || { echo "::error::Info.plist's SUPublicEDKey is not ravilo-desktop/sparkle/SUPublicEDKey.txt"; exit 1; }
          [ "$(/usr/libexec/PlistBuddy -c 'Print :SUEnableAutomaticChecks' "$PLIST")" = "false" ] \
            || { echo "::error::Info.plist must carry SUEnableAutomaticChecks = NO (R386 FR-R386-1)"; exit 1; }
          if /usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$PLIST" >/dev/null 2>&1; then
            echo "::error::Info.plist carries an SUFeedURL; the feed is set per check (R386 FR-R386-1)"; exit 1
          fi
          echo "SPARKLE_DIR=$SPARKLE_DIR" >> "$GITHUB_ENV"
          echo "SPARKLE_PUBLIC_KEY=$PUBKEY" >> "$GITHUB_ENV"

      # R331 dev review 2 — every binary signed with our identity: the nested code first (the Swift library and the
      # runtime's own libraries, which --deep does not reach when they sit outside Frameworks), then the bundle.
      # No hardened runtime, no entitlements, no timestamp: those serve notarisation, which this app never has.
      - name: Sign the whole bundle with the Ravilo certificate
        env:
          IDENTITY: ${{ steps.keychain.outputs.identity }}
        run: |
          set -euo pipefail
          find "$APP/Contents" -type f \( -name '*.dylib' -o -name '*.jnilib' -o -name '*.so' \) -print0 \
            | xargs -0 -n 20 codesign --force --timestamp=none --keychain "$KEYCHAIN" --sign "$IDENTITY"
          # R386 (FR-R386-1) — Sparkle's nested code, inside-out, before the framework and before the bundle:
          # the two XPC services, the installer helper and the updater app, then Sparkle.framework itself. Hardened
          # runtime stays off (R331), so Library Validation never stops Sparkle loading.
          FW="$APP/Contents/Frameworks/Sparkle.framework"
          FWV=$(cd "$FW/Versions/Current" && pwd -P)
          for nested in "$FWV/XPCServices/Installer.xpc" "$FWV/XPCServices/Downloader.xpc" "$FWV/Autoupdate" "$FWV/Updater.app"; do
            [ -e "$nested" ] && codesign --force --timestamp=none --keychain "$KEYCHAIN" --sign "$IDENTITY" "$nested"
          done
          codesign --force --timestamp=none --keychain "$KEYCHAIN" --sign "$IDENTITY" "$FW"
          # jpackage's runtime is a bundle of its own (Contents/runtime/Contents/Info.plist): sealed before the app.
          if [ -d "$APP/Contents/runtime" ]; then
            codesign --force --timestamp=none --keychain "$KEYCHAIN" --sign "$IDENTITY" "$APP/Contents/runtime"
          fi
          codesign --force --deep --timestamp=none --keychain "$KEYCHAIN" --sign "$IDENTITY" "$APP"

      - name: Verify the signature and run the self-test
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP" 2>&1 | grep -E '^(Identifier|Authority|TeamIdentifier)=' || true
          # FR-R331-4 — the bundle's own launcher, not `open`: its exit code is the app's.
          "$APP/Contents/MacOS/Ravilo" --self-test | tee "$RUNNER_TEMP/self-test.txt"

      - name: Make ravilo-mac-${{ needs.version.outputs.version }}.dmg
        env:
          IDENTITY: ${{ steps.keychain.outputs.identity }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE" "$RUNNER_TEMP/out"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          DMG="$RUNNER_TEMP/out/ravilo-mac-$VERSION.dmg"
          hdiutil create -volname Ravilo -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          codesign --force --timestamp=none --keychain "$KEYCHAIN" --sign "$IDENTITY" "$DMG"
          ls -l "$DMG"
          {
            echo "### Ravilo for Mac $VERSION"
            echo
            echo "**Signed with the Ravilo certificate — not notarised.** The first time on a Mac: System Settings → Privacy & Security → *Open Anyway*."
            echo
            echo "- \`ravilo-mac-$VERSION.dmg\`: $(du -h "$DMG" | cut -f1)"
            echo "- self-test: $(cat "$RUNNER_TEMP/self-test.txt")"
          } >> "$GITHUB_STEP_SUMMARY"

      # R386 (FR-R386-2) — sign the .dmg with the update key, write the one-item appcast, and prove it verifies
      # against the SUPublicEDKey the bundle carries. The private key is read from the secret on stdin: never in a
      # file, an argument or a log line.
      - name: Sign the .dmg and write appcast.xml
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          PACKAGE_VERSION: ${{ needs.version.outputs.package_version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DMG="$RUNNER_TEMP/out/ravilo-mac-$VERSION.dmg"
          SIG=$(printf '%s' "$SPARKLE_KEY" | "$SPARKLE_DIR/bin/sign_update" --ed-key-file - -p "$DMG")
          if ! printf '%s' "$SIG" | grep -Eq '^[A-Za-z0-9+/]{86}==$'; then
            echo "::error::sign_update did not return an EdDSA signature for the .dmg."
            exit 1
          fi
          LENGTH=$(stat -f%z "$DMG")
          BASE="https://github.com/$REPO/releases"
          cat > "$RUNNER_TEMP/out/appcast.xml" <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Ravilo for Mac</title>
              <item>
                <title>Ravilo $VERSION</title>
                <sparkle:version>$PACKAGE_VERSION</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <sparkle:releaseNotesLink>$BASE/tag/v$VERSION</sparkle:releaseNotesLink>
                <enclosure url="$BASE/download/v$VERSION/ravilo-mac-$VERSION.dmg" length="$LENGTH" type="application/octet-stream" sparkle:edSignature="$SIG"/>
              </item>
            </channel>
          </rss>
          XML
          xmllint --noout "$RUNNER_TEMP/out/appcast.xml"
          swift ravilo-desktop/sparkle/verify-appcast.swift "$RUNNER_TEMP/out/appcast.xml" "$DMG" "$SPARKLE_PUBLIC_KEY"
          {
            echo "- \`appcast.xml\`: signature verifies against the bundle's SUPublicEDKey (sparkle:version $PACKAGE_VERSION)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the temporary keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" 2>/dev/null || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ravilo-mac-dmg
          path: |
            ${{ runner.temp }}/out/*.dmg
            ${{ runner.temp }}/out/appcast.xml
          retention-days: 30

      # R331 FR-R331-5 — only when publish.yml's `mac` job calls this for a published release; by hand, never.
      # The files only: the release notes say what the release contains, not how to install it (owner, 2026-09-30).
      - name: Attach to the GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          # R386 (FR-R386-2) — the appcast beside the .dmg, so `releases/latest/download/appcast.xml` and
          # `releases/download/v<N>/appcast.xml` both resolve. On a by-hand run it is in the artifact above instead.
          gh release upload "$TAG" "$RUNNER_TEMP/out/ravilo-mac-$VERSION.dmg" "$RUNNER_TEMP/out/appcast.xml" --clobber
