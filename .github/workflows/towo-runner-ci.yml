name: towo-runner CI

# Phase 162 (Towo) — validates towo-runner still builds+typechecks on every push. Not a release/
# publish step: the enrollment command (TowoService.mintEnrollment) installs directly from this repo
# via GitHub's authenticated `/tarball/{ref}` API + a build-on-target-machine step (see that function's
# doc comment for why: a private-repo GitHub Release asset needs its own asset-id lookup dance to
# download with a token, while the repo-tarball endpoint just needs one Authorization header). This
# workflow exists purely so a broken towo-runner commit is caught here, not by someone pasting a dead
# enrollment command on a runner host.
on:
  push:
    branches: [main]
    paths: ["towo-runner/**", ".github/workflows/towo-runner-release.yml"]
  pull_request:
    paths: ["towo-runner/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: towo-runner

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
