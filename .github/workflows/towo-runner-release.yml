name: towo-runner release

# Phase 162 (Towo) — builds towo-runner and republishes it as a downloadable tarball attached to a
# rolling "towo-runner-latest" GitHub Release. Exists because the enrollment command Towo's admin UI
# generates (`npx <tarball-url> --connect ... --root ~`) needs a real, always-current URL to install
# from: towo-runner is `"private": true` (never meant for the public npm registry) and dist/ is
# gitignored (built fresh, never committed) — see towo-runner/README.md and the spec's dev-review
# addendum for why this stays a standalone Node project outside the Gradle build.
on:
  push:
    branches: [main]
    paths: ["towo-runner/**", ".github/workflows/towo-runner-release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: towo-runner

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack tarball
        run: |
          mkdir -p /tmp/towo-runner-pack
          npm pack --pack-destination /tmp/towo-runner-pack

      - name: Rename to a stable filename
        # npm pack names the file after package.json's name+version (e.g. towo-runner-0.1.0.tgz),
        # which would change the download URL on every version bump -- the enrollment command needs
        # one fixed URL, so the asset itself is always named the same regardless of version.
        run: mv /tmp/towo-runner-pack/*.tgz /tmp/towo-runner-pack/towo-runner.tgz

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete towo-runner-latest --yes --cleanup-tag || true
          gh release create towo-runner-latest /tmp/towo-runner-pack/towo-runner.tgz \
            --title "towo-runner (latest)" \
            --notes "Auto-built from ${{ github.sha }}. Installed via the enrollment command in Towo's Add a runner screen -- not meant to be downloaded by hand." \
            --target "${{ github.sha }}"
