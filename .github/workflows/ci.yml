name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # 2026-08-18: measured locally that `app` alone spends ~9.5 of its ~10.4 total build minutes in
    # the two gradlew RUN steps (linkReleaseExecutableLinuxX64 + wasmJsBrowserDistribution) even with
    # cache_from/cache_to correctly wired -- BuildKit never layer-caches a RUN step that uses
    # `--mount=type=cache` (the gradle/konan/npm mounts here), so those steps always re-execute from
    # cold regardless of caching. That's on a many-core dev box; GitHub's 2-core ubuntu-latest runners
    # are meaningfully slower for CPU-bound Kotlin/Wasm compilation, and this job now builds two full
    # Kotlin/Wasm images (app + ravilo-web) plus the mock stack + Playwright run. 60min was cutting a
    # genuinely-slow-but-not-hung run too close; the actual hang risk (headless Chromium/WebGL) is
    # already fixed at the test level, so a generous ceiling here is just headroom, not risk.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Check CSS scoping
        run: ./scripts/check-css-scoping.sh

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg mkvtoolnix

      - name: Build test fixtures
        run: ./scripts/build-fixtures.sh
        env:
          FIXTURE_DIR: /tmp/jellystructure-fixtures

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          # Hashes both Dockerfiles (app + ravilo-web) and the webpack loaders that patch the
          # generated wasm bootstrap, since a change to either invalidates only that image's cache
          # scope (docker-compose.test.yml gives app/ and ravilo-web/ each their own subdirectory
          # under this path).
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile', 'ravilo-web/Dockerfile', 'build.gradle.kts', 'gradle/libs.versions.toml', 'ravilo-web/webpack.config.d/**') }}
          restore-keys: ${{ runner.os }}-buildx-

      - name: Run test stack
        run: |
          # 2026-08-18: `up --build` builds app + ravilo-web concurrently by default, each spinning up
          # its own Gradle/Kotlin-Native/Kotlin-Wasm toolchain -- on the previous run, that appears to
          # have OOM-killed the runner VM outright rather than failing cleanly: conclusion=failure, but
          # the active step never recorded a completion timestamp and every later `if: always()` step
          # (including "Move Docker cache", which is supposed to run no matter what) never even
          # started. That signature means the runner process itself died, not a script exiting
          # nonzero. This repo is private, so its runner is the 2-core/8GB tier -- building the two
          # images one at a time keeps peak memory to one Kotlin toolchain's worth instead of two.
          docker compose -f docker-compose.test.yml build app
          docker compose -f docker-compose.test.yml build ravilo-web
          docker compose -f docker-compose.test.yml up \
            --abort-on-container-exit \
            --exit-code-from playwright
        env:
          FIXTURE_DIR: /tmp/jellystructure-fixtures
          JELLYFIN_USER: admin
          JELLYFIN_PASS: password
          # Consumed directly by docker-compose.test.yml's cache_from/cache_to build keys (the
          # Compose Specification's real mechanism for this) -- the old BUILDX_CACHE_FROM/
          # BUILDX_CACHE_TO env vars here were never read by anything and made caching a no-op.
          BUILDX_CACHE_DIR: /tmp/.buildx-cache

      - name: Move Docker cache
        if: always()
        run: |
          for img in app ravilo-web; do
            rm -rf "/tmp/.buildx-cache/$img"
            mv "/tmp/.buildx-cache/$img-new" "/tmp/.buildx-cache/$img" 2>/dev/null || true
          done

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tests/test-results/
          retention-days: 3
