name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # 2026-08-18: on a cold cache, `app` alone spent ~9.5 of its ~10.4 total build minutes locally in
    # the two gradlew RUN steps (linkReleaseExecutableLinuxX64 + wasmJsBrowserDistribution) -- on a
    # warm cache (unchanged source since the last successful run), real CI evidence showed those same
    # steps hit CACHED and the whole build+test step dropped from 34m13s to 3m40s. But the FIRST build
    # after any source change is always cold, and GitHub's 2-core ubuntu-latest runners (private repo
    # tier) are meaningfully slower than a dev box for CPU-bound Kotlin/Wasm compilation, building two
    # full images (app + ravilo-web) plus the mock stack + Playwright run. 60min was cutting a
    # genuinely-slow-but-not-hung cold run too close; the actual hang risk (headless Chromium/WebGL) is
    # already fixed at the test level, so a generous ceiling here is just headroom, not risk.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # 2026-08-18: the last two runs both died mid-"Run test stack" with conclusion=failure but no
        # completion timestamp on the active step and no logs ever captured -- the signature of the
        # whole runner process dying, not a clean script failure (see the "Run test stack" comment
        # below for the memory half of this; this step addresses the other likely culprit). This
        # repo's runner (private repo) has only ~14GB of SSD, and ubuntu-latest ships several GB of
        # preinstalled toolchains this project never touches (Android SDK, .NET, GHC) -- combined with
        # two full multi-stage Kotlin/Wasm Docker builds (JDK + Gradle + Node in the builder stage) and
        # a mode=max cache export that captures every intermediate layer, disk exhaustion is at least
        # as plausible a cause as memory. This is the standard, low-risk mitigation for it.
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /opt/az 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Check CSS scoping
        run: ./scripts/check-css-scoping.sh

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg mkvtoolnix

      - name: Build test fixtures
        run: ./scripts/build-fixtures.sh
        env:
          FIXTURE_DIR: /tmp/jellystructure-fixtures

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          # Hashes both Dockerfiles (app + ravilo-web) and the webpack loaders that patch the
          # generated wasm bootstrap, since a change to either invalidates only that image's cache
          # scope (docker-compose.test.yml gives app/ and ravilo-web/ each their own subdirectory
          # under this path).
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile', 'ravilo-web/Dockerfile', 'build.gradle.kts', 'gradle/libs.versions.toml', 'ravilo-web/webpack.config.d/**') }}
          restore-keys: ${{ runner.os }}-buildx-

      - name: Run test stack
        run: |
          # 2026-08-18: `up --build` builds app + ravilo-web concurrently by default, each spinning up
          # its own Gradle/Kotlin-Native/Kotlin-Wasm toolchain -- two Gradle daemons at
          # org.gradle.jvmargs=-Xmx4g each already want 8GB of heap alone, before Docker/buildkit/the
          # OS need anything, on this private repo's 2-core/8GB runner tier. Building one at a time
          # keeps peak memory to one Kotlin toolchain's worth. `docker buildx prune` between them
          # reclaims the first build's intermediate builder-stage layers (JDK+Gradle+Node, several GB)
          # before the second build starts -- it only touches BuildKit's build cache, never the tagged
          # app image itself, so the later `up` step still finds it without rebuilding.
          docker compose -f docker-compose.test.yml build app
          docker buildx prune -f
          docker compose -f docker-compose.test.yml build ravilo-web
          docker buildx prune -f
          echo "Disk space before starting stack:"
          df -h /
          docker compose -f docker-compose.test.yml up \
            --abort-on-container-exit \
            --exit-code-from playwright
        env:
          FIXTURE_DIR: /tmp/jellystructure-fixtures
          JELLYFIN_USER: admin
          JELLYFIN_PASS: password
          # Consumed directly by docker-compose.test.yml's cache_from/cache_to build keys (the
          # Compose Specification's real mechanism for this) -- the old BUILDX_CACHE_FROM/
          # BUILDX_CACHE_TO env vars here were never read by anything and made caching a no-op.
          BUILDX_CACHE_DIR: /tmp/.buildx-cache

      - name: Move Docker cache
        if: always()
        run: |
          for img in app ravilo-web; do
            rm -rf "/tmp/.buildx-cache/$img"
            mv "/tmp/.buildx-cache/$img-new" "/tmp/.buildx-cache/$img" 2>/dev/null || true
          done

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tests/test-results/
          retention-days: 3
