name: CI

# Phase 231 — ONE reusable definition of "the tests pass", called by publish.yml before anything is
# pushed to GHCR or the Play Store (FR-231-4), and run directly for pull requests.
# Pushes to main do NOT trigger this file: publish.yml runs it for them (FR-231-5), so a push costs one
# CI run, and that run is the gate.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test (a release tag); defaults to the triggering commit"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # ── Fast fences (seconds). The two design-sync fences existed only as "run by hand" until 231. ──
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Spec/STATUS consistency
        run: ./scripts/check-phases.sh
      - name: CSS scoping
        run: ./scripts/check-css-scoping.sh
      - name: Design-sync-fragile CSS
        run: ./scripts/check-mobile-css.sh
      - name: Shared Docker toolchain cache ids
        run: ./scripts/check-docker-cache-ids.sh
      - name: No Jellyfin version branching
        run: ./scripts/check-jellyfin-version-use.sh
      - name: No Jellyfin token in a query string
        run: ./scripts/check-jellyfin-query-token.sh
      # R293 FR-R293-7 — the device token rides a Bearer header on every native WebSocket handshake.
      - name: No device token in a socket URL
        run: ./scripts/check-events-query-token.sh
      # R279 FR-R279-14 — thirteen viewer-facing strings had never reached the string table, and no
      # test could see any of them. This is the thing that would have.
      - name: No hardcoded viewer-facing text in Ravilo
        run: ./scripts/check-ravilo-strings.sh

  # ── Backend unit tests (Kotlin/Native). 342 tests that CI had never run before 231. ──
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml', 'build.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsqlite3-dev libatomic1 ffmpeg mkvtoolnix
      - name: Backend unit tests
        # CronTest's fixtures are local-wall-clock instants for the deployment's own zone (its header says
        # so); GitHub runners are UTC. First 231 run: 6 CronTest failures, everything else green.
        env:
          TZ: Europe/Copenhagen
        run: ./gradlew linuxX64Test --no-daemon

      # Phase 240 (FR-240-5) — the live route guard, pointed at a disposable SEEDED Jellyfin.
      #
      # It has technically been "in CI" since 231, and it has been returning early the whole time: no
      # env vars, no server, nothing asserted. That is why the 12.1 upgrade broke three route
      # behaviours with a green pipeline. Provisioning a container is the difference between a guard
      # that exists and a guard that runs.
      #
      # Seeded, not empty: eight of the eleven route shapes are item-specific and return early
      # without one, and the startup wizard has to be scripted either way (a fresh Jellyfin issues no
      # token until it is completed), so the media file is a few extra lines on top of work that was
      # unavoidable.
      - name: Live Jellyfin route + model guard
        run: |
          set -e
          eval "$(./scripts/jellyfin-test-server.sh up)"
          ./scripts/check-jellyfin-models.sh
          ./gradlew linuxX64Test --no-daemon --tests '*JellyfinLiveRouteGuard*'
      - name: Tear down the disposable Jellyfin
        if: always()
        run: ./scripts/jellyfin-test-server.sh down || true
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: build/reports/tests/
          retention-days: 7

  # ── The Ravilo client: unit tests, the REAL R8 release APK, and ART's own verifier on it. ──
  # The release-only player VerifyError (2026-09-06 to the Play Store, 2026-09-17 to the living-room TV)
  # passes every compile check, every unit test and every debug build. Only these two steps see it.
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0   # versionName comes from `git describe`
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Throwaway debug keystore
        # The release signingConfig falls back to ~/.android/debug.keystore when no real keystore is
        # configured (ravilo-android/build.gradle.kts) — a fresh runner has none. This APK is only ever
        # verified and uploaded as a CI artifact; the Play build signs with the real upload key.
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
      - name: Client unit tests + release APK
        # R294 — :ravilo-player's tests run the vendored MatroskaExtractor over the committed MKV
        # fixtures (stock Media3 must still fail on them, the patched copy must not) and fail the build
        # the moment Media3 moves off the version the copy was taken from.
        run: ./gradlew :ravilo-ui:testDebugUnitTest :ravilo-player:testDebugUnitTest :ravilo-android:assembleRelease --no-daemon
      - name: Player dex register guard (FR-231-2)
        run: ./scripts/check-player-dex.sh
      # R289 (FR-R289-4) — Play's automatic protection refuses any bundle below minSdk 24; a commit that
      # lowers the floor goes red here, on push, before a tag exists.
      - name: The bundle's floor is what Play requires (FR-R289-4)
        run: ./scripts/check-min-sdk.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: ART verifies every class of the release APK (FR-231-3)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31          # Android 12 — what the living-room BRAVIA runs
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: ./scripts/verify-release-apk-on-art.sh
      - name: Upload the release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ravilo-release-apk
          path: ravilo-android/build/outputs/apk/release/*.apk
          retention-days: 7

  # ── The full stack against mocks + Playwright (unchanged by 231, only renamed from `test`). ──
  e2e:
    runs-on: ubuntu-latest
    # 2026-08-18: on a cold cache, `app` alone spent ~9.5 of its ~10.4 total build minutes locally in
    # the two gradlew RUN steps (linkReleaseExecutableLinuxX64 + wasmJsBrowserDistribution) -- on a
    # warm cache (unchanged source since the last successful run), real CI evidence showed those same
    # steps hit CACHED and the whole build+test step dropped from 34m13s to 3m40s. But the FIRST build
    # after any source change is always cold, and GitHub's 2-core ubuntu-latest runners (private repo
    # tier) are meaningfully slower than a dev box for CPU-bound Kotlin/Wasm compilation, building two
    # full images (app + ravilo-web + ravilo-screen) plus the mock stack + Playwright run. 60min was cutting a
    # genuinely-slow-but-not-hung cold run too close; the actual hang risk (headless Chromium/WebGL) is
    # already fixed at the test level, so a generous ceiling here is just headroom, not risk.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Free disk space
        # 2026-08-18: the last two runs both died mid-"Run test stack" with conclusion=failure but no
        # completion timestamp on the active step and no logs ever captured -- the signature of the
        # whole runner process dying, not a clean script failure (see the "Run test stack" comment
        # below for the memory half of this; this step addresses the other likely culprit). This
        # repo's runner (private repo) has only ~14GB of SSD, and ubuntu-latest ships several GB of
        # preinstalled toolchains this project never touches (Android SDK, .NET, GHC) -- combined with
        # two full multi-stage Kotlin/Wasm Docker builds (JDK + Gradle + Node in the builder stage) and
        # a mode=max cache export that captures every intermediate layer, disk exhaustion is at least
        # as plausible a cause as memory. This is the standard, low-risk mitigation for it.
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /opt/az 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Check CSS scoping
        run: ./scripts/check-css-scoping.sh

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg mkvtoolnix

      - name: Build test fixtures
        run: ./scripts/build-fixtures.sh
        env:
          FIXTURE_DIR: /tmp/jellystructure-fixtures

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          # Hashes all three Dockerfiles (app + ravilo-web + ravilo-screen, phase 247) and the webpack
          # loaders that patch the generated wasm bootstrap, since a change to any one invalidates only
          # that image's cache scope (docker-compose.test.yml gives each its own subdirectory under
          # this path).
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile', 'ravilo-web/Dockerfile', 'ravilo-screen/Dockerfile', 'build.gradle.kts', 'gradle/libs.versions.toml', 'ravilo-web/webpack.config.d/**') }}
          restore-keys: ${{ runner.os }}-buildx-

      - name: Run test stack
        run: |
          # 2026-08-18: `up --build` builds every image concurrently by default, each spinning up its
          # own Gradle/Kotlin-Native/Kotlin-Wasm toolchain -- two Gradle daemons at
          # org.gradle.jvmargs=-Xmx4g each already want 8GB of heap alone, before Docker/buildkit/the
          # OS need anything, on this private repo's 2-core/8GB runner tier. Building one at a time
          # keeps peak memory to one Kotlin toolchain's worth. `docker buildx prune` between them
          # reclaims the previous build's intermediate builder-stage layers (JDK+Gradle+Node, several
          # GB) before the next build starts -- it only touches BuildKit's build cache, never the
          # tagged image itself, so the later `up` step still finds it without rebuilding. Phase 247
          # added ravilo-screen as a third, smaller (plain Kotlin/JS, no wasm) image to this sequence.
          # Phase 250 FR-250-2: the prunes BETWEEN builds keep BuildKit's cache mounts. A bare prune
          # deletes them too, which is what kept all three builds downloading the same Gradle
          # distribution and Kotlin/Native LLVM + sysroot after 250 gave them one shared id (measured
          # on run 36134323199: three downloads at 12:26, 12:43, 12:51). The last prune may take
          # everything -- nothing builds after it. Fenced by scripts/check-docker-cache-ids.sh.
          docker compose -f docker-compose.test.yml build app
          docker buildx prune -f --filter 'type!=exec.cachemount'
          docker compose -f docker-compose.test.yml build ravilo-web
          docker buildx prune -f --filter 'type!=exec.cachemount'
          docker compose -f docker-compose.test.yml build ravilo-screen
          docker buildx prune -f
          echo "Disk space before starting stack:"
          df -h /
          docker compose -f docker-compose.test.yml up \
            --abort-on-container-exit \
            --exit-code-from playwright
        env:
          FIXTURE_DIR: /tmp/jellystructure-fixtures
          JELLYFIN_USER: admin
          JELLYFIN_PASS: password
          # Consumed directly by docker-compose.test.yml's cache_from/cache_to build keys (the
          # Compose Specification's real mechanism for this) -- the old BUILDX_CACHE_FROM/
          # BUILDX_CACHE_TO env vars here were never read by anything and made caching a no-op.
          BUILDX_CACHE_DIR: /tmp/.buildx-cache

      - name: Move Docker cache
        if: always()
        run: |
          for img in app ravilo-web ravilo-screen; do
            rm -rf "/tmp/.buildx-cache/$img"
            mv "/tmp/.buildx-cache/$img-new" "/tmp/.buildx-cache/$img" 2>/dev/null || true
          done

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tests/test-results/
          retention-days: 3
