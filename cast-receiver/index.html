<!doctype html>
<!-- R245 — the Ravilo Chromecast receiver. Served by jellystructure at /cast/ (218 FR-218-1).
     Ten screens, none interactive (FR-R245-15): nothing here is pressable because nothing is pointed at
     it. No artwork on idle, no heavy effects, the three fonts the app already loads are NOT loaded here —
     system sans only — so a 2013 stick idles on it for hours (FR-R245-17). Never names a product, a
     protocol, a codec or a status code (FR-R245-16). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="ravilo-cast-receiver" content="R245">
  <title>Ravilo</title>
  <style>
    :root { --ink: #fff; --ink-soft: rgba(255,255,255,.72); --ink-dim: rgba(255,255,255,.45); --accent: #7b6ef0; --accent2: #00a4dc; }
    html, body { margin: 0; height: 100%; background: #000; color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    cast-media-player { --background-color: #000; --splash-image: none; --logo-image: none; --playback-logo-image: none; --progress-color: var(--accent); --slider-progress-color: var(--accent); --watermark-image: none; }
    .screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; text-align: center; }
    .screen.on { display: flex; }
    #idle, #loading, #noserver, #busy { background: #000; }
    .mark { width: 64px; height: 64px; border-radius: 18px; background: linear-gradient(135deg, #AA5CC3, #00A4DC); box-shadow: 0 0 48px rgba(0,164,220,.35); margin-bottom: 26px; }
    .sentence { font-size: 30px; color: var(--ink-soft); font-weight: 500; }
    .kicker { font-size: 18px; letter-spacing: 3px; color: var(--accent2); font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
    .title { font-size: 44px; font-weight: 700; letter-spacing: -.8px; }
    .sub { font-size: 22px; color: var(--ink-dim); margin-top: 14px; }
    .pulse { display: flex; gap: 14px; margin-bottom: 34px; }
    .pulse i { width: 16px; height: 16px; border-radius: 50%; background: var(--ink); animation: pulse 1.2s infinite ease-in-out; }
    .pulse i:nth-child(2) { animation-delay: .2s; } .pulse i:nth-child(3) { animation-delay: .4s; }
    @keyframes pulse { 0%, 80%, 100% { opacity: .25; transform: scale(.85); } 40% { opacity: 1; transform: scale(1); } }
    .sweep { width: 280px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.14); overflow: hidden; margin-top: 34px; }
    .sweep i { display: block; width: 40%; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); animation: sweep 1.6s infinite linear; }
    @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    /* paused / seeked overlay (FR-R245-15): low, ~3 s, then gone */
    #overlay { position: fixed; left: 0; right: 0; bottom: 0; padding: 40px 64px 48px; background: linear-gradient(transparent, rgba(0,0,0,.78)); display: none; }
    #overlay.on { display: block; }
    #overlay .row { display: flex; align-items: center; gap: 22px; }
    #overlay .glyph { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; }
    #overlay .glyph i { display: block; width: 8px; height: 30px; background: var(--ink); margin: 0 4px; }
    #overlay .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.22); margin: 18px 0 10px; }
    #overlay .bar i { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
    #overlay .time { color: var(--ink-dim); font-size: 20px; }
    /* buffering (R218 moment C): the frozen frame stays; a spinner and nothing else */
    #buffering { background: rgba(0,0,0,.38); }
    .spinner { width: 56px; height: 56px; border: 5px solid rgba(255,255,255,.2); border-top-color: var(--ink); border-radius: 50%; animation: spin .9s infinite linear; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* next-up card, as on the TV */
    #nextup { position: fixed; right: 64px; bottom: 64px; width: 560px; padding: 22px; border-radius: 16px; background: rgba(14,17,25,.95); border: 1px solid rgba(255,255,255,.1); display: none; text-align: left; }
    #nextup.on { display: block; }
    #nextup .k { font-size: 14px; letter-spacing: 2px; color: var(--accent2); font-weight: 700; }
    #nextup .t { font-size: 24px; font-weight: 700; margin: 6px 0 12px; }
    #nextup .c { font-size: 18px; color: var(--ink-soft); }
    .wait { font-size: 20px; color: var(--ink-dim); margin-top: 10px; }
  </style>
</head>
<body>
  <cast-media-player id="player"></cast-media-player>

  <section id="idle" class="screen on"><div class="mark"></div><div id="idle-sentence" class="sentence">Ready to play from your phone</div></section>
  <section id="loading" class="screen"><div class="pulse"><i></i><i></i><i></i></div><div id="loading-kicker" class="kicker"></div><div id="loading-title" class="title"></div><div class="sweep"><i></i></div><div id="loading-label" class="sub">Loading…</div></section>
  <section id="buffering" class="screen"><div class="spinner"></div></section>
  <section id="noserver" class="screen"><div class="mark"></div><div id="noserver-t" class="title"></div><div id="noserver-s" class="sub"></div></section>
  <section id="busy" class="screen"><div class="mark"></div><div id="busy-t" class="title"></div><div id="busy-s" class="sub"></div><div id="busy-wait" class="wait"></div></section>
  <div id="overlay"><div class="row"><div class="glyph"><i></i><i></i></div><div><div id="ov-kicker" class="kicker"></div><div id="ov-title" class="title" style="font-size:30px"></div></div></div><div class="bar"><i id="ov-fill"></i></div><div id="ov-time" class="time"></div></div>
  <div id="nextup"><div id="nu-k" class="k"></div><div id="nu-t" class="t"></div><div id="nu-c" class="c"></div></div>

  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script src="ravilo-cast.js"></script>
</body>
</html>
