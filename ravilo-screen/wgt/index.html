<!doctype html>
<!-- DEB-4656 — the remote-driven Tizen shell wraps R264's push-driven player. R269's server setup
     remains the boot path when no address is stored. The shell's routes and labels come from the JS
     bundle and shared string table; this markup supplies only the mounting points. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="ravilo-screen" content="R264">
  <title>Ravilo</title>
  <link rel="stylesheet" href="screen.css">
</head>
<body>
  <!-- R279 (FR-R279-8) — every sentence on this page is filled by the bundle from the
       shared string table, in the household's own language. Nothing here carries English:
       a Danish household used to see "Ready to play from your phone" for the first frame. -->
  <video id="video" playsinline></video>
  <div id="cues" aria-live="off"></div>

  <section id="idle" class="screen on"><div class="mark"></div><div id="idle-sentence" class="sentence"></div><div id="idle-code"></div><div id="idle-server"></div></section>
  <section id="setup" class="screen"><div class="mark"></div><div id="setupTitle" class="title" style="margin-bottom:18px"></div><input id="setupHost" type="text" autocomplete="off" spellcheck="false" placeholder="ravilo.example.com"><button id="setupConnect"></button><div id="setupHint"></div></section>
  <section id="signin" class="auth-screen">
    <div class="auth-brand">Ravilo</div>
    <div class="auth-center">
      <h1 id="signin-title"></h1>
      <div id="signin-code-view">
        <div class="auth-code-layout"><div id="signin-qr"></div><div class="auth-code-copy">
          <div id="signin-code-label" class="auth-label"></div>
          <div id="signin-code"></div>
          <div id="signin-message" class="auth-hint" aria-live="polite"></div>
          <div class="auth-tv"><span id="signin-tv-label"></span> <strong id="signin-tv-name"></strong></div>
        </div></div>
        <button id="signin-password-instead" class="auth-button"></button>
        <button id="signin-retry" class="auth-button"></button>
        <div id="signin-back" class="auth-hint"></div>
      </div>
      <div id="signin-form"><label id="signin-username-label" for="signin-username"></label><input id="signin-username" type="text" autocomplete="username"><label id="signin-password-label" for="signin-password"></label><input id="signin-password" type="password" autocomplete="current-password"><div class="auth-actions"><button id="signin-submit" class="auth-button"></button><button id="signin-cancel" class="auth-button"></button></div></div>
      <div id="signin-password-message" class="auth-hint" aria-live="polite"></div>
    </div>
  </section>
  <section id="profile-picker" class="auth-screen"><div class="auth-brand">Ravilo</div><div class="auth-center"><h1 id="profile-picker-title"></h1><div id="profile-picker-body" class="profile-choices"></div></div></section>
  <section id="profile-menu" class="auth-screen"><div class="auth-center"><h1 id="profile-menu-title"></h1><div id="profile-menu-body" class="profile-choices"></div></div></section>
  <section id="loading" class="screen"><div class="pulse"><i></i><i></i><i></i></div><div id="loading-kicker" class="kicker"></div><div id="loading-title" class="title"></div><div class="sweep"><i></i></div><div id="loading-label" class="sub"></div></section>
  <section id="buffering" class="screen"><div class="spinner"></div></section>
  <section id="noserver" class="screen"><div class="mark"></div><div id="noserver-t" class="title"></div><div id="noserver-s" class="sub"></div></section>
  <section id="busy" class="screen"><div class="mark"></div><div id="busy-t" class="title"></div><div id="busy-s" class="sub"></div><div id="busy-wait" class="wait"></div></section>
  <section id="failed" class="screen"><div class="mark"></div><div id="failed-t" class="title"></div><div id="failed-s" class="sub"></div></section>
  <section id="shell" aria-label="Ravilo"><div class="shell-bar"><div class="shell-brand">Ravilo</div><nav class="shell-nav"><div id="nav-home" class="shell-target" data-row="bar" tabindex="-1"></div><div id="nav-movies" class="shell-target" data-row="bar" tabindex="-1"></div><div id="nav-series" class="shell-target" data-row="bar" tabindex="-1"></div><div id="nav-search" class="shell-target" data-row="bar" tabindex="-1"></div></nav><div id="nav-profile" class="shell-target" data-row="bar" tabindex="-1"></div></div><main id="shell-body"></main></section>
  <div id="overlay"><div id="ov-ident"><img id="ov-logo" alt=""><div id="ov-showname"></div></div><div class="row"><div><div id="ov-kicker" class="kicker"></div><div id="ov-title" class="title" style="font-size:30px"></div></div><div class="row"><div id="ov-hint"></div><div id="ov-pz"></div></div></div><div class="bar"><i id="ov-fill"></i></div><div id="ov-time" class="time"></div></div>
  <div id="skip"></div>
  <div id="nextup"><div id="nu-k" class="k"></div><div id="nu-t" class="t"></div><div id="nu-c" class="c"></div></div>
  <div id="picker"><div id="pk-head"></div><div id="pk-tabs"></div><div id="pk-rows"></div></div>

  <script>
    // Kotlin/JS and its dependencies use globalThis at runtime. Chromium 63 predates it.
    if (typeof globalThis === 'undefined') window.globalThis = window;
  </script>
  <script src="ravilo-screen.js"></script>
</body>
</html>
