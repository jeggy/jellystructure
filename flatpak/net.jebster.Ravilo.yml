# R333 — Ravilo as a Flatpak. This is a TEMPLATE: `flatpak/render.sh` fills @VERSION@, @COMMIT@ and @DATE@ and puts
# `flatpak-sources.json` (R333 FR-R333-2, generated by `:captureFlatpakSources`) beside the result; the rendered copy is
# what CI builds (R334) and what lives in Flathub's `flathub/net.jebster.Ravilo` repository.
#
# Flathub builds from source, offline: no network in the sandbox, so the Gradle distribution and every artefact the
# build resolves are sources of this manifest, and the build runs `gradle --offline` against a directory of them
# (`flatpak/gradle-offline.init.gradle.kts`). Only the desktop modules are configured (`-Pravilo.desktopOnly=true`).
#
# The JDK is the runtime's openjdk21 extension (build-time only); `createDistributable` jlinks the runtime the app
# ships, so the Flatpak carries a trimmed JRE, not the whole JDK.

app-id: net.jebster.Ravilo
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
command: ravilo
separate-locales: false

# R335 (FR-R335-10) — mpv links the runtime's FFmpeg at build time; at run time the ffmpeg-full extension's libraries
# (the patented decoders: H.264, HEVC, AC-3, …) take their place through this path. Installed with the app.
add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    version: '26.08'
    directory: lib/ffmpeg
    add-ld-path: .
    no-autodownload: false
    autodelete: false

finish-args:
  # OpenJDK's AWT is X11-only (no Wayland toolkit in JDK 21); XWayland serves it on a Wayland desktop. X11 needs ipc.
  - --socket=x11
  - --share=ipc
  # The jellystructure server, and mDNS for the household's Cast devices (R330).
  - --share=network
  # Skia's OpenGL.
  - --device=dri
  # Music and films (R333 §Out of scope: nothing plays yet — kept so the player phase adds no permission).
  - --socket=pulseaudio

cleanup:
  - /gradle
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - /share/doc
  - '*.la'
  - '*.a'
cleanup-commands:
  - mkdir -p ${FLATPAK_DEST}/lib/ffmpeg

modules:
  # ── R335 (FR-R335-10): the player — mpv as a library, the recipe jellyfin-media-player's Flathub manifest uses ──
  - name: libass
    buildsystem: meson
    config-opts: [-Ddefault_library=shared, -Dfontconfig=enabled]
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.4/libass-0.17.4.tar.xz
        sha256: 78f1179b838d025e9c26e8fef33f8092f65611444ffa1bfc0cfac6a33511a05a
  - name: nv-codec-headers
    buildsystem: simple
    build-commands:
      - make PREFIX=/app install
    sources:
      - type: git
        url: https://github.com/FFmpeg/nv-codec-headers.git
        tag: n13.1.15.0
        commit: 0a6fba9a2820628b8103464f4c8753ee05838baa
  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Ddefault_library=shared
      - -Dopengl=enabled
      - -Dvulkan=disabled
      - -Dshaderc=disabled
      - -Dglslang=disabled
      - -Dlcms=disabled
      - -Ddemos=false
      - -Dtests=false
    sources:
      - type: git
        url: https://code.videolan.org/videolan/libplacebo.git
        tag: v7.351.0
        commit: 3188549fba13bbdf3a5a98de2a38c2e71f04e21e
  - name: libXpresent
    # mpv's X11 output wants it; the SDK has the rest of xorg's libraries but not this one.
    sources:
      - type: archive
        url: https://xorg.freedesktop.org/archive/individual/lib/libXpresent-1.0.1.tar.xz
        sha256: b964df9e5a066daa5e08d2dc82692c57ca27d00b8cc257e8e960c9f1cf26231b
  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dbuild-date=false
      - -Dmanpage-build=disabled
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dlibarchive=disabled
      - -Duchardet=disabled
      - -Drubberband=disabled
      - -Dvulkan=disabled
      - -Dvaapi=enabled
      - -Dcuda-hwaccel=enabled
      - -Dpipewire=enabled
      - -Dpulse=enabled
      - -Dalsa=disabled
      - -Dwayland=enabled
      - -Dx11=enabled
      - -Degl=enabled
      - -Dgl=enabled
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.41.0.tar.gz
        sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209

  - name: ravilo
    buildsystem: simple
    build-options:
      env:
        JAVA_HOME: /usr/lib/sdk/openjdk21/jvm/openjdk-21
        # Gradle's own caches, inside the build directory: nothing outside it is writable or needed.
        GRADLE_USER_HOME: /run/build/ravilo/.gradle-home
        GRADLE_OPTS: -Dorg.gradle.daemon=false
    build-commands:
      # One JVM, no daemons: the Flathub builders are small.
      - >-
        gradle/bin/gradle --offline --no-daemon --console=plain
        --init-script flatpak/gradle-offline.init.gradle.kts
        -Pravilo.desktopOnly=true
        -Pravilo.flatpakOfflineRepo=/run/build/ravilo/offline-repository
        -Pkotlin.compiler.execution.strategy=in-process
        -Pjellystructure.version=@VERSION@
        -Pravilo.macPackageVersion=@VERSION@.0
        :ravilo-desktop:createDistributable
      - mkdir -p /app/ravilo && cp -a ravilo-desktop/build/compose/binaries/main/app/Ravilo/. /app/ravilo/
      - install -Dm755 flatpak/ravilo /app/bin/ravilo
      - install -Dm644 ravilo-desktop/linux/net.jebster.Ravilo.desktop -t /app/share/applications
      # The metainfo's release row and screenshot URL are this build's (FR-R333-4): the version, date and commit the render put here.
      - >-
        sed -e 's/%VERSION%/@VERSION@/g' -e 's/%DATE%/@DATE@/g' -e 's/%COMMIT%/@COMMIT@/g'
        ravilo-desktop/linux/net.jebster.Ravilo.metainfo.xml > net.jebster.Ravilo.metainfo.xml
      - install -Dm644 net.jebster.Ravilo.metainfo.xml -t /app/share/metainfo
      - install -Dm644 ravilo-desktop/icons/ravilo.png /app/share/icons/hicolor/512x512/apps/net.jebster.Ravilo.png
    sources:
      - type: git
        url: https://github.com/jeggy/jellystructure.git
        tag: v@VERSION@
        commit: '@COMMIT@'
        x-checker-data:
          type: git
          tag-pattern: '^v([\d.]+)$'
      # The Gradle the build runs — the wrapper would download it, and there is no network.
      - type: archive
        url: https://services.gradle.org/distributions/gradle-9.2.1-bin.zip
        sha256: 72f44c9f8ebcb1af43838f45ee5c4aa9c5444898b3468ab3f4af7b6076c5bc3f
        dest: gradle
      # Every Maven artefact the build resolves, with its checksum — regenerated per release, never edited by hand.
      - flatpak-sources.json
