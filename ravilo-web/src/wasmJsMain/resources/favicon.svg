<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 24 72 72" role="img" aria-label="Ravilo">
  <!-- R341 FR-R341-3 — the bare jellyfish drawn for 16 px: a fuller bell and three heavier tentacles, the app icon's
       own gradient, no tile. The middle tentacle is a straight line, so its bounding box has no width and a
       bounding-box gradient would not paint it at all (SVG's rule); it takes the same diagonal in user space. -->
  <defs>
    <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#AA5CC3"/>
      <stop offset="1" stop-color="#00A4DC"/>
    </linearGradient>
    <linearGradient id="rgm" gradientUnits="userSpaceOnUse" x1="48" y1="58" x2="52" y2="88">
      <stop offset="0" stop-color="#AA5CC3"/>
      <stop offset="1" stop-color="#00A4DC"/>
    </linearGradient>
  </defs>
  <path d="M18 56 C18 21 82 21 82 56 C70 49 60 49 50 53 C40 49 30 49 18 56 Z" fill="url(#rg)"/>
  <g stroke="url(#rg)" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M32 56 Q27 71 33 86"/>
    <path d="M50 58 L50 88" stroke="url(#rgm)"/>
    <path d="M68 56 Q73 71 67 86"/>
  </g>
</svg>
