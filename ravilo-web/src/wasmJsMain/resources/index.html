<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d0d1a">
    <title>Ravilo</title>
    <!-- FR-R263-2 -->
    <link rel="manifest" href="manifest.webmanifest">
    <!-- FR-R263-3 — iOS has never read <link rel="manifest"> for install metadata; these are what
         actually control the Home Screen name, icon and chrome on iOS. No launch-image set (iOS 26
         synthesises one from the manifest/meta already present). -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Ravilo">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="apple-touch-icon-180.png">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%;
            background: #0d0d1a;
            overflow: hidden;
            /* Prevent text selection on TV-style navigation */
            user-select: none;
            -webkit-user-select: none;
        }
        canvas#ComposeTarget {
            display: block;
            width: 100%; height: 100%;
            /* Compose canvas on top; video element sits behind at z-index: 0 */
            position: relative;
            z-index: 1;
            /* Prevent browser from stealing pointer events */
            touch-action: none;
        }
        /* Fullscreen button (shown only when fullscreen API is available) */
        #fs-btn {
            display: none;
            position: fixed; bottom: 16px; right: 16px; z-index: 100;
            background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.2);
            color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 13px;
            cursor: pointer;
        }
        #fs-btn:hover { background: rgba(255,255,255,.15); }
        /* FR-R263-6 — read back via getComputedStyle from the wasmJs actual of the safe-area seam
           (RaviloRootActuals.kt); zero-size and unpainted, so it never affects layout or a screenshot.
           `env()` with no source (a Safari tab, most Android devices) resolves to the 0px fallback. */
        #ravilo-safe-area-probe {
            position: fixed; top: 0; left: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
            padding-top: env(safe-area-inset-top, 0px);
            padding-right: env(safe-area-inset-right, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            padding-left: env(safe-area-inset-left, 0px);
        }
    </style>
</head>
<body>
    <canvas id="ComposeTarget" tabindex="0"></canvas>
    <button id="fs-btn" title="Toggle fullscreen">⛶ Fullscreen</button>
    <div id="ravilo-safe-area-probe"></div>

    <!-- FR-235-8 — no inline script: the corrected CSP's script-src has no 'unsafe-inline' (a nonce
         would make this file uncacheable by R263's service worker). runtime-config.js is generated
         per request (DEFAULT_SERVER_URL / RAVILO_VERSION); boot.js is the WasmGC floor check
         (FR-R263-1) plus the old inline block — and, on success, boot.js appends ravilo.js itself, so
         there is no static <script src="ravilo.js"> here for an unsupported browser to fetch. -->
    <script src="runtime-config.js"></script>
    <script src="boot.js"></script>
</body>
</html>
