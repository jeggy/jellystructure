<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d0d1a">
    <title>Ravilo</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%;
            background: #0d0d1a;
            overflow: hidden;
            /* Prevent text selection on TV-style navigation */
            user-select: none;
            -webkit-user-select: none;
        }
        canvas#ComposeTarget {
            display: block;
            width: 100%; height: 100%;
            /* Compose canvas on top; video element sits behind at z-index: 0 */
            position: relative;
            z-index: 1;
            /* Prevent browser from stealing pointer events */
            touch-action: none;
        }
        /* Fullscreen button (shown only when fullscreen API is available) */
        #fs-btn {
            display: none;
            position: fixed; bottom: 16px; right: 16px; z-index: 100;
            background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.2);
            color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 13px;
            cursor: pointer;
        }
        #fs-btn:hover { background: rgba(255,255,255,.15); }
    </style>
</head>
<body>
    <canvas id="ComposeTarget" tabindex="0"></canvas>
    <button id="fs-btn" title="Toggle fullscreen">⛶ Fullscreen</button>

    <!-- FR-235-8 — no inline script: the corrected CSP's script-src has no 'unsafe-inline' (a nonce
         would make this file uncacheable by a future service worker). runtime-config.js is generated
         per request (DEFAULT_SERVER_URL / RAVILO_VERSION); boot.js is the old inline block, moved out
         verbatim. -->
    <script src="runtime-config.js"></script>
    <script src="boot.js"></script>
    <script src="ravilo.js"></script>
</body>
</html>
