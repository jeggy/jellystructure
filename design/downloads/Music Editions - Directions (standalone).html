  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

12\n   (11th wipe event). */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"5d07a1b7-d586-46db-b8f5-ce811e5cb4fc\") format('woff2');\n}\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"5d07a1b7-d586-46db-b8f5-ce811e5cb4fc\") format('woff2');\n}\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"5d07a1b7-d586-46db-b8f5-ce811e5cb4fc\") format('woff2');\n}\n@font-face {\n  font-family: 'Sora';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"1b96e4ee-f47c-488a-925e-3ed76a72d4d9\") format('woff2');\n}\n@font-face {\n  font-family: 'Sora';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"1b96e4ee-f47c-488a-925e-3ed76a72d4d9\") format('woff2');\n}\n@font-face {\n  font-family: 'Sora';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"1b96e4ee-f47c-488a-925e-3ed76a72d4d9\") format('woff2');\n}\n@font-face {\n  font-family: 'Sora';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"1b96e4ee-f47c-488a-925e-3ed76a72d4d9\") format('woff2');\n}\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"d6f93c25-f99a-427a-9fed-b24d2d24fa98\") format('woff2');\n}\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"d6f93c25-f99a-427a-9fed-b24d2d24fa98\") format('woff2');\n}\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"d6f93c25-f99a-427a-9fed-b24d2d24fa98\") format('woff2');\n}\n\n/* ---------- TOKENS ---------- */\n:root {\n  /* accent (shared across themes/directions) */\n  --acc-a: #b15cd0;            /* magenta-violet  */\n  --acc-b: #00a4dc;            /* jellyfin blue   */\n  --grad:  linear-gradient(122deg, var(--acc-a) 0%, #7b6ef0 48%, var(--acc-b) 100%);\n  --hi:        #7b6ef0;        /* unified solid accent */\n  --hi-soft:   rgba(123,110,240,.16);\n  --acc-ink:   #c6bcfb;        /* accent text on tinted bg (dark) */\n\n  /* semantic status */\n  --bad:  #ff6f61;  --bad-soft:  rgba(255,111,97,.15);\n  --ok:   #2dd49a;  --ok-soft:   rgba(45,212,154,.15);\n  --info: #3fb6f5;  --info-soft: rgba(63,182,245,.15);\n  --warn: #f5b542;  --warn-soft: rgba(245,181,66,.15);\n\n  /* surfaces — DARK (default) · \"Soft Charcoal\" comfort palette:\n     lifted floor (no near-black glare) + dimmed ink + lighter card surfaces */\n  --bg:      #16181f;\n  --bg-2:    #1a1d25;\n  --paper:   var(--bg);\n  --paper-2: var(--bg-2);\n  --fill:    #262a37;\n  --fill-2:  #20242f;\n  --fill-3:  #2f3441;\n  --ink:     #dde1ec;\n  --ink-soft:#9aa0b4;\n  --ink-dim: rgba(221, 225, 236, 0.32);\n  --line:    rgba(255,255,255,.08);\n  --line-2:  rgba(255,255,255,.14);\n\n  /* shape / depth */\n  --radius:   16px;\n  --radius-s: 10px;\n  --shadow:   0 10px 34px rgba(0,0,0,.42);\n  --shadow-s: 0 4px 16px rgba(0,0,0,.32);\n  --card-bg:  rgba(46,51,66,.74);\n  --card-bd:  1px solid var(--line);\n  --blur:     blur(16px) saturate(125%);\n  --ambient:  1;   /* aurora glows on */\n}\n\n/* ---------- LIGHT THEME ---------- */\n[data-theme=\"light\"] {\n  --bg:      #eef0f6;\n  --bg-2:    #e7eaf2;\n  --fill:    #ffffff;\n  --fill-2:  #f3f5fa;\n  --fill-3:  #eceff6;\n  --ink:     #181a22;\n  --ink-soft:#5d6378;\n  --ink-dim: rgba(15, 17, 26, 0.25);\n  --line:    rgba(20,22,32,.10);\n  --line-2:  rgba(20,22,32,.16);\n  --acc-ink: #6240cf;\n  --card-bg: rgba(255,255,255,.74);\n  --shadow:   0 12px 34px rgba(40,44,70,.14);\n  --shadow-s: 0 4px 14px rgba(40,44,70,.10);\n}\n\n* { box-sizing: border-box; }\n\n/* suppress transitions during initial appearance boot (set by app-shell.js) */\nhtml[data-booting] *, html[data-booting] *::before, html[data-booting] *::after { transition: none !important; }\n\nhtml, body {\n  margin: 0;\n  background: var(--bg);\n  color: var(--ink);\n  font-family: 'Sora', system-ui, -apple-system, sans-serif;\n  font-size: 16px;\n  line-height: 1.5;\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* ambient aurora field (aurora dir only) */\nbody.wf-body {\n  min-height: 100vh;\n  position: relative;\n}\nbody.wf-body::before {\n  content: '';\n  position: fixed; inset: 0; z-index: -1; pointer-events: none;\n  opacity: var(--ambient);\n  background:\n    radial-gradient(900px 600px at 12% -8%, rgba(177,92,208,.16), transparent 60%),\n    radial-gradient(900px 700px at 100% 0%, rgba(0,164,220,.14), transparent 55%),\n    radial-gradient(700px 600px at 50% 120%, rgba(123,110,240,.10), transparent 60%);\n  transition: opacity .4s ease;\n}\n\nh1,h2,h3,h4 {\n  font-family: 'Space Grotesk', 'Sora', sans-serif;\n  font-weight: 600; margin: 0 0 .3em; line-height: 1.12; letter-spacing: -.01em;\n}\np { margin: 0 0 .7em; }\na { color: var(--acc-ink); text-decoration: none; }\na:hover { text-decoration: underline; text-underline-offset: 2px; }\ncode, .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: .84em; }\n\n/* ---------- generic surfaces ---------- */\n.box, .card {\n  background: var(--card-bg);\n  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);\n  border: var(--card-bd);\n  border-radius: var(--radius);\n  box-shadow: var(--shadow-s);\n  padding: 16px;\n}\n.card.flat, .box.flat { box-shadow: none; background: var(--fill-2); -webkit-backdrop-filter:none; backdrop-filter:none; }\n\n.grid { display: grid; gap: 16px; }\n.row { display: flex; gap: 14px; }\n.row.wrap { flex-wrap: wrap; }\n.row.center { align-items: center; }\n.col { display: flex; flex-direction: column; gap: 16px; }\n.fill { flex: 1; }\n.spacer { flex: 1; }\n.muted { color: var(--ink-soft); }\n.tiny { font-size: .8rem; }\n.center-x { text-align: center; }\nhr.dash { border: none; border-top: 1px solid var(--line); margin: 18px 0; }\n/* Settings tabbed layout — one panel visible at a time, ?tab= addressable (Phase 55) */\n.set-section[data-tab] { display: none; }\n.set-section[data-tab].tab-show { display: block; }\n/* Tag cards + colour swatch picker (Phase 82 / FR-TG3) */\n.tag-card { display: flex; align-items: center; gap: 12px; padding: 13px 15px; cursor: pointer; }\n.tag-dot-lg { width: 14px; height: 14px; border-radius: 50%; flex: none; }\n.swatches { display: flex; gap: 8px; flex-wrap: wrap; }\n.swatch { width: 28px; height: 28px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }\n.swatch.on { border-color: var(--ink); }\n/* Audio-language flag strip — pagebar (Phase 87) + Ravilo detail (R75) */\n.audio-flags { display: inline-flex; align-items: center; gap: 7px; }\n.audio-flags .af-label { font-size: .64rem; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-dim); font-weight: 600; }\n.audio-flags .af-row { display: inline-flex; align-items: center; gap: 5px; }\n.audio-flags .fi { width: 21px; height: 16px; border-radius: 3px; box-shadow: 0 0 0 1px var(--line-2), 0 1px 3px rgba(0,0,0,.3); background-size: cover; background-position: center; }\n.audio-flags .af-more { font-size: .68rem; font-weight: 600; color: var(--ink-soft); background: var(--fill-3); padding: 1px 7px; border-radius: 20px; line-height: 1.5; }\n.pill-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }\n.scrollbox { max-height: 460px; overflow: auto; }\n/* Sidecar subtitles — read-only listing (Phase 200 FR-200-5) */\n.sc-cols, .sc-row { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; }\n.sc-cols { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); font-weight: 600; padding: 0 2px 8px; }\n.sc-row { padding: 10px 2px; border-top: 1px solid var(--line); font-size: .85rem; }\n.sc-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }\n.sc-main .sc-name { font-family: 'JetBrains Mono', monospace; font-size: .78rem; overflow-wrap: anywhere; }\n.sc-main .sc-sub { font-size: .72rem; color: var(--ink-soft); }\n.sc-tags { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }\n/* MKV track-layout health card — Activity (Phase 201 FR-201-10) */\n.mkvh-list { max-height: 252px; overflow: auto; }\n.mkvh-row { display: grid; grid-template-columns: 34px 1fr auto 14px; gap: 12px; align-items: center; padding: 9px 4px; border-top: 1px solid var(--line); text-decoration: none; color: var(--ink); }\n.mkvh-row:hover { background: var(--fill-2); }\n.mkvh-th { width: 34px; height: 50px; border-radius: 5px; background: var(--fill-3); border: 1px solid var(--line-2); display: flex; align-items: center; justify-content: center; font-size: .58rem; color: var(--ink-dim); flex: none; }\n.mkvh-main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }\n.mkvh-main b { font-size: .86rem; }\n.mkvh-main .mkvh-p { font-family: 'JetBrains Mono', monospace; font-size: .7rem; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.mkvh-go { color: var(--ink-dim); font-size: .8rem; }\n\n/* ---------- buttons ---------- */\n.btn {\n  font-family: 'Sora', sans-serif; font-weight: 600; font-size: .9rem; cursor: pointer;\n  display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;\n  padding: 9px 15px; background: var(--fill-3); color: var(--ink);\n  border: 1px solid var(--line-2); border-radius: var(--radius-s);\n  transition: transform .15s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease, filter .2s ease;\n}\n.btn:hover { border-color: var(--hi); box-shadow: 0 0 0 3px var(--hi-soft); text-decoration: none; }\n.btn:active { transform: translateY(1px); }\n.btn.primary {\n  background: var(--grad); color: #fff; border: 1px solid transparent;\n  box-shadow: 0 6px 18px rgba(123,110,240,.35);\n}\n.btn.primary:hover { filter: brightness(1.07); box-shadow: 0 8px 24px rgba(123,110,240,.5); }\n.btn.bad { background: var(--bad); color: #fff; border-color: transparent; }\n.btn.bad:hover { box-shadow: 0 0 0 3px var(--bad-soft); border-color: transparent; }\n.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-soft); }\n.btn.ghost:hover { background: var(--fill-3); color: var(--ink); box-shadow: none; }\n.btn.sm { padding: 5px 11px; font-size: .8rem; }\n\n/* ---------- inputs ---------- */\n.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }\n.field label { font-size: .76rem; font-weight: 600; letter-spacing: .02em; color: var(--ink-soft); text-transform: uppercase; }\n.field .hint { font-size: .76rem; color: var(--ink-soft); }\n.input, .select {\n  background: var(--fill-2); border: 1px solid var(--line-2); border-radius: var(--radius-s);\n  padding: 9px 12px; font-family: 'Sora', sans-serif; font-size: .9rem; color: var(--ink);\n  min-height: 38px; display: flex; align-items: center; gap: 8px;\n  transition: border-color .2s ease, box-shadow .2s ease;\n}\n.input:hover, .select:hover { border-color: var(--line-2); }\n.input.ph { color: var(--ink-soft); cursor: text; }\n.select { justify-content: space-between; cursor: pointer; }\n.select::after { content: '⌄'; margin-left: auto; color: var(--ink-soft); font-size: 1.1em; line-height: 1; }\n\n/* toggle */\n.toggle { width: 44px; height: 25px; border: 1px solid var(--line-2); border-radius: 20px; background: var(--fill-3);\n  position: relative; display: inline-block; cursor: pointer; flex: none; transition: background .2s ease, border-color .2s ease; }\n.toggle::after { content:''; position: absolute; top: 2px; left: 3px; width: 17px; height: 17px; border-radius: 50%;\n  background: var(--ink-soft); transition: left .2s ease, background .2s ease; }\n.toggle.on { background: var(--grad); border-color: transparent; }\n.toggle.on::after { left: auto; right: 3px; background: #fff; }\n\n/* segmented */\n.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--radius-s); overflow: hidden; background: var(--fill-2); }\n.seg span { padding: 6px 13px; font-size: .82rem; font-weight: 600; cursor: pointer; color: var(--ink-soft);\n  border-right: 1px solid var(--line); transition: background .2s ease, color .2s ease; }\n.seg span:last-child { border-right: 0; }\n.seg span:hover { color: var(--ink); }\n.seg span.on { background: var(--hi-soft); color: var(--acc-ink); }\n\n/* ---------- chips / badges ---------- */\n.chip {\n  display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600;\n  padding: 4px 11px; border: 1px solid var(--line-2); border-radius: 20px; background: var(--fill-2);\n  color: var(--ink); white-space: nowrap; transition: border-color .2s ease, background .2s ease;\n}\n.chip.ghost { background: transparent; border-style: dashed; color: var(--ink-soft); cursor: pointer; }\n.chip.sugg { cursor: pointer; }\n.chip.sugg:hover, .chip.ghost:hover { border-color: var(--hi); color: var(--ink); }\n/* accent-filled chips (markup uses inline background:var(--hi)) need light ink */\n.chip[style*=\"--hi)\"]:not([style*=\"soft\"]) { color: #fff; border-color: transparent; }\n/* Selected-filter-chip state — used by Library's \".active-chip\" and Activity's \".act\"\n   modifiers. Neither had a design reference (not in any mockup) — matches the same\n   selected treatment as .theme-seg button.on / .seg-pill button.on elsewhere.\n   RESTORED 2026-07-31, again 2026-08-11, again 2026-09-02, again 2026-09-12 (11th occurrence\n   total) after a design-tool sync silently reverted this — see the reference memory note on\n   diffing design/app/*.css after every sync. */\n.chip.active-chip, .chip.act { background: var(--hi-soft); color: var(--acc-ink); border-color: var(--hi); }\n\n.badge { display: inline-flex; align-items:center; gap:5px; font-size: .72rem; font-weight: 600;\n  padding: 3px 9px; border-radius: 7px; border:1px solid transparent; white-space: nowrap; }\n.badge.bad { background: var(--bad-soft); border-color: rgba(255,111,97,.4); color: var(--bad); }\n.badge.ok  { background: var(--ok-soft);  border-color: rgba(45,212,154,.4); color: var(--ok); }\n.badge.warn{ background: var(--warn-soft); border-color: rgba(245,181,66,.4); color: var(--warn); }\n.badge.info{ background: var(--info-soft); border-color: rgba(63,182,245,.4); color: var(--info); }\n[data-theme=\"light\"] .badge.bad  { color: #c23b2d; }\n[data-theme=\"light\"] .badge.ok   { color: #128a5f; }\n[data-theme=\"light\"] .badge.warn { color: #9a6a06; }\n[data-theme=\"light\"] .badge.info { color: #1f7fb8; }\n\n/* Phase 117/146 — dashboard \"Needs your attention\" breakdown grid. Same gap as .nav-group:\n   the mockup's inline <style> (index.html) never made it into the shipped CSS files, so these\n   rows rendered with zero styling — no card background/border, no hover, no severity coloring.\n   RE-ADDED 2026-07 after a design-tool sync overwrote this file and silently dropped it, RESTORED\n   AGAIN 2026-07-31, AGAIN 2026-08-11, AGAIN 2026-09-02, and AGAIN 2026-09-12 (11th sync-wipe event\n   overall) — see the\n   reference memory note on syncing before touching this block again. */\n.attn-breakdown { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin: 4px 0 2px; }\n.abk { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 9px;\n  border: 1px solid var(--line); background: var(--fill-2); text-decoration: none; color: var(--ink);\n  cursor: pointer; transition: border-color .15s ease, background .15s ease, transform .1s ease; }\n.abk:hover { border-color: var(--hi); background: var(--hi-soft); text-decoration: none; }\n.abk:active { transform: translateY(1px); }\n.abk .abk-l { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }\n.abk .abk-l b { font-family: 'Space Grotesk', sans-serif; font-size: .92rem; font-weight: 600; }\n.abk .abk-l .d { font-size: .72rem; color: var(--ink-soft); line-height: 1.3; }\n.abk .badge { flex: none; }\n.abk.zero { opacity: .5; }\n.abk.zero:hover { opacity: .8; }\n@media (max-width: 640px) { .attn-breakdown { grid-template-columns: 1fr; } }\n\n.lang { font-family: 'JetBrains Mono', monospace; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; }\n\n.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--ink-soft); }\n.dot.bad { background: var(--bad); box-shadow: 0 0 8px rgba(255,111,97,.7); }\n.dot.ok  { background: var(--ok);  box-shadow: 0 0 8px rgba(45,212,154,.6); }\n.dot.warn{ background: var(--warn); box-shadow: 0 0 8px rgba(245,181,66,.6); }\n.dot.info{ background: var(--info); box-shadow: 0 0 8px rgba(63,182,245,.6); }\n.dot.none{ background: transparent; border: 1px solid var(--line-2); box-shadow: none; }\n\n/* ---------- image placeholder / posters ---------- */\n.imgslot {\n  background: linear-gradient(150deg, var(--fill-3), var(--fill-2));\n  border: 1px solid var(--line); border-radius: var(--radius-s);\n  display: flex; align-items: center; justify-content: center; text-align: center;\n  color: var(--ink-soft); font-family: 'JetBrains Mono', monospace; font-size: .68rem;\n  position: relative; overflow: hidden;\n}\n.imgslot::before {  /* faint film-strip / sheen */\n  content: ''; position: absolute; inset: 0; opacity: .5;\n  background:\n    radial-gradient(120% 80% at 30% 0%, rgba(123,110,240,.16), transparent 60%),\n    repeating-linear-gradient(0deg, transparent 0 13px, rgba(255,255,255,.03) 13px 14px);\n}\n.imgslot .x { display: none; }       /* retire the wireframe crosshatch */\n.imgslot span { position: relative; padding: 3px 9px; border-radius: 20px;\n  background: rgba(0,0,0,.35); border: 1px solid var(--line); letter-spacing: .03em; }\n[data-theme=\"light\"] .imgslot span { background: rgba(255,255,255,.7); color: var(--ink-soft); }\n\n/* ---------- table ---------- */\n.wf-table { width: 100%; border-collapse: collapse; font-size: .9rem; }\n.wf-table th, .wf-table td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }\n.wf-table th { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); font-weight: 600;\n  border-bottom: 1px solid var(--line-2); }\n.wf-table tr:last-child td { border-bottom: 0; }\n.wf-table tbody tr, .wf-table tr { transition: background .15s ease; }\n.wf-table tr:hover td { background: var(--hi-soft); }\n.wf-table tr.attn td { background: var(--bad-soft); }\n.wf-table tr.attn:hover td { background: rgba(255,111,97,.22); }\n.wf-table .num { font-family: 'JetBrains Mono', monospace; font-size: .82rem; }\n\n/* ---------- progress ---------- */\n.bar { height: 9px; border-radius: 20px; background: var(--fill-3); overflow: hidden; border: 1px solid var(--line); }\n.bar > i { display: block; height: 100%; background: var(--grad); border-radius: 20px; transition: width .5s ease; }\n.bar.ok > i { background: var(--ok); }\n\n/* ---------- log / console ---------- */\n.log {\n  font-family: 'JetBrains Mono', monospace; font-size: .78rem; line-height: 1.7;\n  background: var(--bg-2); color: var(--ink); border: 1px solid var(--line);\n  border-radius: var(--radius-s); padding: 12px 14px; overflow: auto; max-height: 220px;\n}\n[data-theme=\"light\"] .log { background: #0e1018; color: #e7e9f2; }   /* keep terminals dark for contrast */\n[data-theme=\"light\"] .log .muted { color: #8d93a8; }\n.log .ts { color: var(--ink-soft); } .log .warnc { color: var(--warn); } .log .badc { color: var(--bad); } .log .okc { color: var(--ok); }\n\n/* Activity page — media-worker status dot + job-queue rows (design/app/activity.html,\n   never shipped). Verified against the real markup directly: the mockup's .runpick/\n   .rp-dot/.run-sel searchable-run-picker isn't implemented in the real Kotlin page at\n   all, so those are intentionally NOT ported (nothing uses them — porting would be dead\n   CSS, not a fix). RESTORED 2026-07-31, again 2026-08-11, again 2026-09-02, again 2026-09-12, after a\n   design-tool sync silently reverted this. */\n.wk-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }\n.wk-dot.busy { background: var(--warn); box-shadow: 0 0 0 4px var(--warn-soft); }\n.wk-dot.idle { background: var(--ink-dim); }\n.jobs-count {\n  display: inline-flex; align-items: center; justify-content: center; min-width: 16px; height: 16px;\n  padding: 0 5px; border-radius: 20px; background: var(--warn); color: #1a1204;\n  font-size: .62rem; font-weight: 800; margin-left: 6px;\n}\n.jobrow { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-top: 1px dashed var(--line); }\n.jobrow:first-child { border-top: none; }\n.jobrow.leaving { opacity: 0; transform: translateX(10px); transition: opacity .25s, transform .25s; }\n.jq-pos {\n  width: 22px; height: 22px; flex: none; border-radius: 6px; background: var(--fill-3); color: var(--ink-soft);\n  font-size: .72rem; font-weight: 700; display: flex; align-items: center; justify-content: center;\n}\n.jq-ic { width: 22px; flex: none; text-align: center; font-weight: 800; }\n.jq-ic.ok { color: var(--ok); } .jq-ic.bad { color: var(--bad); }\n.jq-main { flex: 1; min-width: 0; }\n.jq-title { font-size: .86rem; }\n.jq-sub { font-size: .72rem; color: var(--ink-dim); margin-top: 2px; }\n/* Phase 260 — the empty-queues panel on Activity ▸ Jobs & workers (mockup: design/app/activity.html #qe).\n   Served from here, not only the mockup's inline <style>; fenced by check-mobile-css.sh. */\n.qe { margin-top: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--fill-1); }\n.qe[hidden] { display: none; }\n.qe-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }\n.qe-h b { font-size: .9rem; }\n.qe-list { margin-top: 9px; display: grid; gap: 2px; }\n.qe-opt { display: grid; grid-template-columns: 18px 110px 88px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 7px 4px; border-top: 1px dashed var(--line); cursor: pointer; font-size: .8rem; }\n.qe-opt:first-child { border-top: none; }\n.qe-opt input { accent-color: var(--bad); margin: 0; transform: translateY(2px); }\n.qe-opt.off { cursor: default; color: var(--ink-dim); }\n.qe-q { font-family: 'JetBrains Mono', monospace; font-weight: 600; }\n.qe-n { font-variant-numeric: tabular-nums; }\n.qe-keep { font-size: .74rem; color: var(--ink-soft); }\n.qe-keep b { color: var(--ink); font-weight: 600; }\n.qe-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }\n.qe-foot .btn.disabled { opacity: .45; pointer-events: none; }\n.lane-gone { display: block; width: 100%; margin-top: 4px; }\n@media (max-width: 640px) { .qe-opt { grid-template-columns: 18px minmax(0, 1fr); } }\n\n/* Ravilo config's hero-carousel row thumbnail (design/app/ravilo-config.html) — the\n   element's own dynamic style= only sets `background`, so the box shape/overlay-label\n   positioning still needs this. */\n.hero-thumb { width: 92px; height: 52px; border-radius: 8px; flex: none; position: relative; overflow: hidden; }\n.hero-thumb .t { position: absolute; left: 8px; bottom: 6px; font-family: 'Space Grotesk',sans-serif; font-weight: 700; font-size: .72rem; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.6); }\n\n/* Settings > Metadata's age-rating region-cascade editor (#rc-list/.rc-add/.rc-menu) — reorder\n   (drag or ▲▼), remove, add-from-catalog. Never had a design pass at all (no mockup, no shipped\n   CSS) despite Phase 106 shipping the feature — related to but distinct from detail.css's\n   .rc-trace/.rc-tr (the per-title cascade-resolution trace card on the media detail page; same\n   \"rc-\" family/concept, different page and markup shape). ADDED 2026-07-31 — Settings.kt has no\n   dedicated CSS file in syncDesignAssets' copy list, so this lives here alongside the dashboard/\n   activity components above. */\n.rc-list { display: flex; flex-direction: column; gap: 8px; margin: 10px 0 12px; padding: 0; list-style: none; }\n.rc-item {\n  display: flex; align-items: center; gap: 10px; padding: 10px 12px;\n  background: var(--card-bg); border: var(--card-bd); border-radius: var(--radius-s);\n  box-shadow: var(--shadow-s); cursor: grab; transition: border-color .15s ease, opacity .15s ease;\n}\n.rc-item.top { border-color: var(--hi); background: var(--hi-soft); }\n.rc-item.dragging { opacity: .4; cursor: grabbing; }\n.rc-item.drag-over { border-color: var(--hi); box-shadow: 0 0 0 2px var(--hi); }\n.rc-grip { color: var(--ink-dim); font-size: 1.05rem; letter-spacing: -2px; flex: none; cursor: grab; }\n.rc-item:active .rc-grip { cursor: grabbing; }\n.rc-ord {\n  width: 22px; height: 22px; flex: none; border-radius: 50%; background: var(--fill-3); color: var(--ink-soft);\n  font-family: 'JetBrains Mono', monospace; font-size: .72rem; font-weight: 700;\n  display: flex; align-items: center; justify-content: center;\n}\n.rc-item.top .rc-ord { background: var(--hi); color: #fff; }\n.rc-item .rc-cc {\n  font-family: 'JetBrains Mono', monospace; font-size: .74rem; font-weight: 700; text-transform: uppercase;\n  background: var(--fill-3); color: var(--ink); padding: 2px 7px; border-radius: 5px; flex: none;\n}\n.rc-name { font-weight: 600; font-size: .88rem; flex: none; white-space: nowrap; }\n.rc-sys { font-size: .74rem; color: var(--ink-soft); flex: none; white-space: nowrap; }\n.rc-scale { display: flex; gap: 4px; flex-wrap: wrap; margin-left: 2px; }\n.rc-scale span {\n  font-family: 'JetBrains Mono', monospace; font-size: .66rem; color: var(--ink-dim);\n  background: var(--fill-2); padding: 1px 6px; border-radius: 4px;\n}\n.rc-top-tag {\n  font-size: .66rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;\n  color: var(--acc-ink); background: var(--hi-soft); padding: 2px 8px; border-radius: 20px; flex: none;\n  white-space: nowrap;\n}\n.rc-actions { display: flex; align-items: center; gap: 2px; margin-left: auto; flex: none; }\n.rc-btn {\n  width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;\n  border-radius: 6px; color: var(--ink-soft); font-size: .74rem; cursor: pointer; user-select: none;\n  transition: background .15s ease, color .15s ease;\n}\n.rc-btn:hover { background: var(--fill-3); color: var(--ink); }\n.rc-btn.dis { opacity: .3; pointer-events: none; }\n.rc-btn.rm:hover { background: var(--bad-soft); color: var(--bad); }\n\n.rc-add { position: relative; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }\n.rc-menu { display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; min-width: 260px; max-height: 320px; overflow: auto; padding: 6px; }\n.rc-add.open .rc-menu { display: block; }\n.rc-mi { display: flex; align-items: center; gap: 10px; padding: 8px 9px; border-radius: 7px; cursor: pointer; transition: background .15s ease; }\n.rc-mi:hover { background: var(--fill-3); }\n.rc-mi .rc-name { flex: 1; }\n\n/* ---------- info note / callout ---------- */\n.note {\n  font-family: 'Sora', sans-serif; font-size: .9rem; line-height: 1.45;\n  background: var(--hi-soft); color: var(--ink); padding: 12px 14px;\n  border-radius: var(--radius-s); border: 1px solid var(--line-2);\n}\n.note.blue { background: var(--info-soft); border-color: rgba(63,182,245,.35); }\n.note.red  { background: var(--bad-soft); border-color: rgba(255,111,97,.35); }\n/* Phase 182 (FR-182-9) — the Activity page's gate-saturation banner: a queuing condition is a\n   warning, not an error (.red) and not merely informational (.blue). */\n.note.warn { background: var(--warn-soft, rgba(240,180,60,.15)); border-color: rgba(240,180,60,.35); }\n.note-row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; margin: 10px 0; }\n/* RaviloConfig's upload-failure notice — same red-alert treatment as .note.red, no\n   reference anywhere (not in the mockup either); this is new, not a port.\n   RESTORED 2026-07-31, again 2026-08-11, again 2026-09-02, again 2026-09-12, after a design-tool sync\n   silently reverted this. */\n.alert-bad {\n  font-family: 'Sora', sans-serif; font-size: .85rem; line-height: 1.4;\n  background: var(--bad-soft); color: var(--bad); padding: 10px 12px;\n  border-radius: var(--radius-s); border: 1px solid rgba(255,111,97,.35);\n}\n\n/* floating toast (created by page scripts) */\n.toast {\n  position: fixed; left: 50%; top: 20px; transform: translateX(-50%);\n  z-index: 200; font-family: 'Sora', sans-serif; font-weight: 600; font-size: .9rem;\n  background: var(--grad); color: #fff; padding: 11px 18px; border-radius: 12px;\n  box-shadow: 0 12px 30px rgba(123,110,240,.45); animation: toast-in .25s ease;\n}\n@keyframes toast-in { from { opacity: 0; transform: translate(-50%, -8px); } to { opacity: 1; transform: translate(-50%, 0); } }\n\n.callout { font-family: 'Sora', sans-serif; color: var(--ink-soft); display:inline-flex; align-items:center; gap:6px; }\n.callout .arr { font-size: 1.7rem; color: var(--acc-ink); }\n\n/* legend */\n.legend { display:flex; gap:16px; flex-wrap:wrap; font-size:.82rem; align-items:center; margin: 4px 0 0; }\n.legend span { display:flex; align-items:center; gap:6px; }\n\n/* keyboard hint */\n.kbd { font-family: 'JetBrains Mono', monospace; font-size:.72rem; border:1px solid var(--line-2); border-bottom-width:2px;\n  border-radius:6px; padding:2px 7px; background:var(--fill-2); color: var(--ink-soft); }\n.drag-handle { cursor: grab; color: var(--ink-soft); font-size: 1.05rem; letter-spacing: -2px; }\n\n/* navitem (settings section list + legacy) */\n.navitem {\n  display: flex; align-items: center; gap: 9px; justify-content: space-between;\n  padding: 9px 11px; border-radius: var(--radius-s); color: var(--ink-soft);\n  text-decoration: none; font-size: .9rem; font-weight: 500; cursor: pointer; transition: background .15s ease, color .15s ease;\n}\n.navitem:hover { background: var(--fill-3); color: var(--ink); text-decoration: none; }\n.navitem.active { background: var(--hi-soft); color: var(--acc-ink); font-weight: 600; }\n.group-label { font-size: .68rem; text-transform: uppercase; letter-spacing: .14em; color: var(--ink-soft); padding: 13px 11px 5px; font-weight: 600; }\n\n/* numbered step badge (Language Settings) */\n.step-n { width: 28px; height: 28px; border-radius: 8px; background: var(--hi-soft); color: var(--acc-ink);\n  font-weight: 700; font-family: 'Space Grotesk', sans-serif; display: inline-flex; align-items: center; justify-content: center;\n  flex: none; font-size: .95rem; }\n.step-n.alt { background: var(--fill-3); color: var(--ink-soft); }\n\n/* =====================================================================\n   SHARED COMPONENTS — restored (Phase: design-sync bug fix)\n   These are multi-page components. wf.css is loaded by EVERY page in\n   design/app/; a class absent from one page may still be used by another\n   (media.html · series*.html · ravilo-config.html · settings.html · …).\n   Before removing any rule below, grep the class across ALL design/app/*.html\n   and only delete it if it appears in zero of them.\n   ===================================================================== */\n\n/* pagebar dropdown menus + split save button — media.html / series*.html */\n.menu-wrap, .split { position: relative; display: inline-flex; }\n.menu-btn { cursor: pointer; }\n.caret { font-size: .7rem; opacity: .7; }\n.menu { position: absolute; top: calc(100% + 6px); right: 0; min-width: 224px; z-index: 60; padding: 6px;\n  background: var(--fill); border: 1px solid var(--line-2); border-radius: 12px;\n  box-shadow: 0 18px 50px rgba(0,0,0,.45); display: none; }\n.menu-wrap.open > .menu, .split.open > .menu { display: block; }\n.menu-item { display: flex; align-items: flex-start; gap: 9px; padding: 8px 10px; border-radius: 8px;\n  font-size: .86rem; font-weight: 600; color: var(--ink); cursor: pointer; white-space: nowrap; text-decoration: none; }\n.menu-item:hover { background: var(--fill-3); }\n.menu-item .mi-ic { width: 16px; text-align: center; opacity: .7; flex: none; }\n.menu-item .mi-sub { display: block; font-size: .72rem; color: var(--ink-soft); font-weight: 400; margin-top: 1px; }\n.split .btn.primary:first-child { border-top-right-radius: 0; border-bottom-right-radius: 0; }\n.split .split-caret { border-top-left-radius: 0; border-bottom-left-radius: 0; margin-left: 1px; padding-left: 9px; padding-right: 10px; }\n\n/* config rows — ravilo-config.html (rows list) */\n.cfg-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--fill-2); }\n.cfg-row + .cfg-row { margin-top: 9px; }\n.cfg-row.off { opacity: .5; }\n.cfg-row .nm { font-weight: 600; }\n.cfg-row .src { font-size: .76rem; color: var(--ink-soft); }\n\n/* segmented pill — ravilo-config.html, ravilo-builders.js */\n.seg-pill { display: inline-flex; gap: 3px; padding: 3px; border-radius: 9px; background: var(--fill-3); border: 1px solid var(--line); }\n.seg-pill button { border: none; background: transparent; color: var(--ink-soft); font-family: 'Sora',sans-serif; font-size: .82rem; font-weight: 600; padding: 6px 12px; border-radius: 7px; cursor: pointer; }\n.seg-pill button.on { background: var(--hi-soft); color: var(--acc-ink); box-shadow: inset 0 0 0 1px rgba(123,110,240,.3); }\n\n/* scalable season picker (1 → 40+ seasons) — series*.html */\n.season-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }\n.sp-step { width: 34px; height: 34px; border: 1px solid var(--line-2); border-radius: 9px; background: var(--fill-3); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 1rem; }\n.sp-step:hover { background: var(--hi-soft); border-color: var(--hi); space; font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }\n.vh-when { color: var(--ink-soft); font-variant-numeric: tabular-nums; }\n.vh-note { font-size: .7rem; color: var(--ink-dim); text-align: right; }\n.vh-foot { font-size: .68rem; color: var(--ink-dim); margin-top: 3px; line-height: 1.5; }\n@media (max-width: 640px) { .vh-r { grid-template-columns: minmax(0, 1fr); } .vh-note { text-align: left; } }\n.usr-cap.unknown b { font-weight: 500; font-style: italic; }\n/* Phase 256 — Users & devices: the unstable-connection line (FR-256-3) and the releases-behind line\n   (FR-256-5), both server-decided (present in the payload or not). Fenced by check-mobile-css.sh. */\n.usr-cap.unstable, .usr-cap.unstable b { color: var(--warn); }\n.usr-cap.behind, .usr-cap.behind b { color: var(--warn); }\n.usr-av { width: 34px; height: 34px; border-radius: 50%; flex: none; display: inline-flex; align-items: center; justify-content: center;\n  font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: .8rem; color: #fff; margin-right: 10px; }\n.usr-av.has-photo { color: transparent; overflow: hidden; }\n.usr-av .av-img { width: 100%; height: 100%; border-radius: inherit; object-fit: cover; display: block; }\n\n/* ── Phase 218 — Settings → Connections → Chromecast card (cc-, page-local). Moved here from the design's\n   inline <style> so the served admin bundle actually carries them (the 187 lesson: .usr-av/.usr-cap only\n   ever existed inline and never reached a served stylesheet). Fenced by scripts/check-mobile-css.sh. */\n.cc-step { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; margin-bottom: 12px; }\n.cc-step p { margin: 0; font-size: .85rem; line-height: 1.55; color: var(--ink-soft); }\n.cc-step p b { color: var(--ink); font-weight: 600; }\n.cc-stat { display: grid; gap: 8px; }\n.cc-stat > div { display: flex; align-items: center; gap: 9px; font-size: .82rem; color: var(--ink-soft); }\n.cc-stat b { color: var(--ink); font-weight: 600; }\n.cc-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--ok); }\n.cc-dot.wait { background: var(--warn); }\n.cc-dot.off { background: var(--ink-dim); }\n.cc-num { display: flex; align-items: center; border: 1px solid var(--line-2); border-radius: var(--radius-s); overflow: hidden; width: 132px; }\n.cc-num b { width: 40px; height: 38px; display: flex; align-items: center; justify-content: center; background: var(--fill-3); font-size: 1rem; font-weight: 600; cursor: pointer; user-select: none; }\n.cc-num span { flex: 1; height: 38px; display: flex; align-items: center; justify-content: center; background: var(--fill-2); font-family: 'JetBrains Mono', monospace; font-size: .95rem; font-weight: 600; }\n<\u002Fstyle>\n<style>/* ============================================================\n   Jellystructure — app shell (production)\n   Builds on wf.css tokens. Full-viewport left-sidebar shell.\n   ============================================================ */\n\n.app-body { margin: 0; min-height: 100vh; }\n\n/* minmax(0, 1fr), not bare 1fr (== minmax(auto, 1fr)): the main column is a plain block with no\n   overflow/min-width of its own, so any unwrapped long string deep inside it (a series title, a raw\n   filename) would otherwise become that column's automatic minimum size and blow the whole grid — and\n   the viewport — wider than the sidebar + content should ever be.\n   RESTORED 2026-07-31 after a design-tool sync silently reverted this a second time, AGAIN 2026-09-02,\n   AGAIN 2026-09-12 (11th sync-wipe event) — see the reference memory note on diffing design/app/*.css\n   after every sync before touching this again. */\n.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }\n\n/* ---------- sidebar ---------- */\n.app-side {\n  position: sticky; top: 0; align-self: start; height: 100vh;\n  background: var(--fill-2);\n  border-right: 1px solid var(--line);\n  padding: 18px 14px; display: flex; flex-direction: column; gap: 2px; overflow: auto;\n}\n[data-dir=\"aurora\"] .app-side { background: linear-gradient(180deg, var(--fill-2), var(--bg)); }\n\n.app-side .logo {\n  font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 1.18rem;\n  padding: 4px 8px 18px; display: flex; align-items: center; gap: 11px; letter-spacing: -.01em;\n}\n.app-side .logo .brand-mark {\n  width: 30px; height: 30px; flex: none; border-radius: 9px;\n  filter: drop-shadow(0 4px 14px rgba(123,110,240,.45));\n}\n\n.app-side a.nav {\n  display: flex; align-items: center; gap: 11px; justify-content: space-between;\n  padding: 9px 11px; border-radius: var(--radius-s);\n  color: var(--ink-soft); text-decoration: none; font-size: .92rem; font-weight: 500;\n  position: relative; transition: background .15s ease, color .15s ease;\n}\n.app-side a.nav .l { display: flex; align-items: center; gap: 11px; }\n.app-side a.nav .ico { width: 19px; height: 19px; flex: none; display: inline-flex; align-items: center; justify-content: center; color: currentColor; opacity: .85; }\n.app-side a.nav .ico svg { width: 100%; height: 100%; }\n.app-side a.nav:hover { background: var(--fill-3); color: var(--ink); text-decoration: none; }\n.app-side a.nav.active { color: var(--ink); background: var(--hi-soft); font-weight: 600; }\n.app-side a.nav.active .ico { opacity: 1; color: var(--acc-ink); }\n.app-side a.nav.active::before {\n  content: ''; position: absolute; left: -14px; top: 50%; transform: translateY(-50%);\n  width: 3px; height: 22px; border-radius: 0 3px 3px 0; background: var(--grad);\n}\n.app-side a.nav .count {\n  font-size: .72rem; background: var(--bad); color: #fff; border-radius: 20px;\n  padding: 1px 8px; font-weight: 600; min-width: 22px; text-align: center;\n}\n\n.app-side .group-label { padding-top: 16px; }\n\n/* Phase 148 — collapsible nav groups. .group-label doubles as a <button> (group-toggle) now,\n   so it needs its browser button chrome reset on top of the plain-label typography above.\n   RE-ADDED 2026-07, RESTORED AGAIN 2026-07-31 after a second design-tool sync overwrote this\n   file and silently dropped it, AGAIN 2026-09-02, AGAIN 2026-09-12 — see the reference memory\n   note on syncing before touching this block again. */\n.app-side .nav-group { display: flex; flex-direction: column; }\n.app-side .group-label.group-toggle {\n  display: flex; align-items: center; width: 100%;\n  background: transparent; border: 0; cursor: pointer;\n  text-align: left; font-family: inherit; border-radius: var(--radius-s);\n  transition: background .15s ease, color .15s ease;\n}\n.app-side .group-label.group-toggle:hover { background: var(--fill-3); color: var(--ink); }\n.app-side .group-label .grp-chev { margin-left: auto; flex: none; opacity: .6; transition: transform .18s ease; }\n.app-side .nav-group.collapsed .grp-chev { transform: rotate(-90deg); }\n.app-side .nav-group-items { display: flex; flex-direction: column; overflow: hidden; }\n.app-side .nav-group.collapsed .nav-group-items { display: none; }\n\n.app-side .grow { flex: 1; min-height: 12px; }\n\n.app-side .status {\n  font-size: .8rem; padding: 11px 12px; border: 1px solid var(--line);\n  border-radius: var(--radius-s); background: var(--fill); display: flex; flex-direction: column; gap: 7px;\n}\n.app-side .status .row { display: flex; align-items: center; gap: 8px; color: var(--ink-soft); }\n\n/* three-way theme picker (Light / Dark / System) */\n.theme-seg {\n  margin-top: 12px; display: flex; gap: 3px; padding: 3px;\n  border: 1px solid var(--line-2); border-radius: var(--radius-s); background: var(--fill-2);\n}\n.theme-seg button {\n  flex: 1; height: 28px; border: none; border-radius: 7px; cursor: pointer;\n  background: transparent; color: var(--ink-soft);\n  font-family: 'Sora', sans-serif; font-size: .76rem; font-weight: 600;\n  transition: color .18s ease, background .18s ease;\n}\n.theme-seg button:hover { color: var(--ink); }\n.theme-seg button.on { background: var(--hi-soft); color: var(--acc-ink); box-shadow: inset 0 0 0 1px rgba(123,110,240,.3); }\n\n/* ---------- main ---------- */\n.app-main2 { padding: 32px 38px 140px; max-width: 1240px; }\n.app-main2.wide { max-width: 1480px; }\n/* full-height app page: no page scroll, inner panes scroll themselves */\n.app-main2.app-flush { padding: 0; max-width: none; height: 100vh; overflow: hidden; }\n\n/* ---------- mobile top bar + nav drawer (injected by app-shell.js) ---------- */\n.app-topbar { display: none; }\n.nav-backdrop { display: none; }\n.app-topbar .burger {\n  width: 40px; height: 40px; flex: none; display: inline-flex; align-items: center; justify-content: center;\n  border: 1px solid var(--line); border-radius: 10px; background: var(--fill-3); color: var(--ink); cursor: pointer;\n}\n.app-topbar .burger svg { width: 20px; height: 20px; }\n.app-topbar .burger:active { background: var(--hi-soft); border-color: var(--hi); }\n.app-topbar .tb-logo { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 1.05rem; display: flex; align-items: center; gap: 9px; }\n.app-topbar .tb-logo .brand-mark { width: 24px; height: 24px; flex: none; border-radius: 7px; filter: drop-shadow(0 3px 10px rgba(123,110,240,.42)); }\n\n.pagebar { display: flex; align-items: center; gap: 13px; margin-bottom: 8px; flex-wrap: wrap; }\n.pagebar h1 { font-size: 2rem; margin: 0; }\n.pagebar .spacer { flex: 1; }\n.crumb { font-size: .85rem; color: var(--ink-soft); }\n.crumb a { color: var(--ink-soft); }\n.page-sub { color: var(--ink-soft); max-width: 78ch; margin: 2px 0 26px; font-size: .98rem; line-height: 1.6; }\n.backrow { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }\n\n/* ---------- floating dock stack (bottom-right) ---------- */\n/* The scan dock lives in this flex column (the attention dock was removed 2026-09-28). */\n#dock-stack {\n  position: fixed; right: 24px; bottom: 24px; z-index: 80;\n  display: flex; flex-direction: column-reverse; align-items: flex-end; gap: 14px;\n  pointer-events: none;\n}\n#dock-stack > .dock { position: static; right: auto; bottom: auto; pointer-events: auto; }\n\n/* ---------- ambient scan dock ---------- */\n.dock {\n  position: fixed; right: 24px; bottom: 24px; width: 340px; z-index: 80;\n  background: var(--card-bg); -webkit-backdrop-filter: blur(20px) saturate(140%); backdrop-filter: blur(20px) saturate(140%);\n  color: var(--ink); border: 1px solid var(--line-2);\n  border-radius: var(--radius); box-shadow: var(--shadow);\n  overflow: hidden;\n}\n.dock::before {\n  content: ''; position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--grad); opacity: var(--ambient);\n}\n.dock .dock-head { display: flex; align-items: center; gap: 9px; padding: 13px 15px; cursor: pointer; }\n.dock .dock-head b { font-family: 'Space Grotesk', sans-serif; white-space: nowrap; font-size: .95rem; }\n.dock .dock-head .kbd { background: transparent; }\n.dock .dock-body { padding: 0 15px 15px; }\n.dock .mono { color: var(--ink-soft); }\n.dock.collapsed .dock-body { display: none; }\n.dock.dock-hidden { display: none; }\n.dock .dock-head .dock-close { background: transparent; cursor: pointer; opacity: .65; transition: opacity .15s, color .15s; }\n.dock .dock-head .dock-close:hover { opacity: 1; color: var(--bad); }\n.dock a { color: var(--acc-ink); }\n\n.dock-log { position: fixed; right: 24px; bottom: 160px; width: 360px; z-index: 79; display: none; }\n.dock-log.open { display: block; }\n\n/* ---------- dashboard stats ---------- */\n.statgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }\n.stat {\n  background: var(--card-bg); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);\n  border: var(--card-bd); border-radius: var(--radius); box-shadow: var(--shadow-s);\n  padding: 18px 20px; position: relative; overflow: hidden; transition: transform .2s ease, box-shadow .2s ease;\n}\n.stat:hover { transform: translateY(-2px); box-shadow: var(--shadow); }\n.stat .k { font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-soft); font-weight: 600; }\n.stat .v { font-family: 'Space Grotesk', sans-serif; font-size: 2.3rem; font-weight: 600; line-height: 1.1; margin-top: 4px; letter-spacing: -.02em; }\n.stat.alert { border-color: rgba(255,111,97,.45); }\n.stat.alert::after {\n  content: ''; position: absolute; right: -30px; top: -30px; width: 90px; height: 90px; border-radius: 50%;\n  background: radial-gradient(circle, var(--bad-soft), transparent 70%);\n}\n.stat.alert .v { color: var(--bad); }\n[data-theme=\"light\"] .stat.alert .v { color: #c23b2d; }\n.stat.alert:hover { box-shadow: 0 10px 30px rgba(255,111,97,.18); }\n\n/* ---------- library poster grid ---------- */\n.poster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; }\n.poster { cursor: pointer; text-decoration: none; color: var(--ink); display: flex; flex-direction: column; gap: 8px; }\n.poster .imgslot { height: 224px; transition: transform .2s ease, box-shadow .25s ease, outline-color .2s ease;\n  outline: 2px solid transparent; outline-offset: 2px; }\n.poster:hover { text-decoration: none; }\n.poster:hover .imgslot { transform: translateY(-4px); box-shadow: 0 14px 32px rgba(0,0,0,.45); outline-color: var(--hi); }\n.poster .ttl { font-size: .92rem; font-weight: 600; line-height: 1.2; }\n.poster .yr { font-size: .78rem; color: var(--ink-soft); display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }\n.poster .flags { display: flex; gap: 5px; flex-wrap: wrap; }\n/* varied poster hues so the grid reads as artwork, not repeats */\n.poster:nth-child(8n+1) .imgslot::before { filter: hue-rotate(0deg); }\n.poster:nth-child(8n+2) .imgslot::before { filter: hue-rotate(40deg); }\n.poster:nth-child(8n+3) .imgslot::before { filter: hue-rotate(85deg); }\n.poster:nth-child(8n+4) .imgslot::before { filter: hue-rotate(130deg); }\n.poster:nth-child(8n+5) .imgslot::before { filter: hue-rotate(175deg); }\n.poster:nth-child(8n+6) .imgslot::before { filter: hue-rotate(220deg); }\n.poster:nth-child(8n+7) .imgslot::before { filter: hue-rotate(270deg); }\n.poster:nth-child(8n+8) .imgslot::before { filter: hue-rotate(310deg); }\n\n/* ---------- in-page tab strip ---------- */\n.tabs2 { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; border-bottom: 1px solid var(--line); padding-bottom: 0; }\n.tabs2 a, .tabs2 span {\n  cursor: pointer; font-size: .9rem; font-weight: 600; text-decoration: none; color: var(--ink-soft);\n  padding: 9px 4px; margin-bottom: -1px; border-bottom: 2px solid transparent; transition: color .2s ease, border-color .2s ease;\n}\n.tabs2 a:hover, .tabs2 span:hover { color: var(--ink); text-decoration: none; }\n.tabs2 .on { color: var(--ink); border-bottom-color: var(--hi); }\n\n/* override card */\n.override {\n  border: 1px solid rgba(63,182,245,.4); background: var(--info-soft);\n  border-radius: var(--radius); padding: 16px 18px;\n}\n\n.kicker2 { font-family: 'Space Grotesk', sans-serif; font-size: .9rem; color: var(--acc-ink); font-weight: 600; }\n\n/* ---------- command palette (⌘K) ---------- */\n.cmdk-pill {\n  display: flex; align-items: center; gap: 8px; width: 100%; margin: 0 0 8px; cursor: pointer;\n  padding: 8px 11px; border: 1px solid var(--line-2); border-radius: var(--radius-s);\n  background: var(--fill-2); color: var(--ink-soft); font-family: 'Sora', sans-serif; font-size: .85rem;\n}\n.cmdk-pill:hover { border-color: var(--hi); color: var(--ink); }\n.cmdk-pill .kbd { margin-left: auto; }\n#cmd-palette { position: fixed; inset: 0; z-index: 130; display: none; justify-content: center; align-items: flex-start;\n  background: rgba(8,10,16,.55); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); padding-top: 12vh; }\n#cmd-palette.open { display: flex; }\n#cmd-palette .cmdp-box { width: 560px; max-width: 92vw; background: var(--fill); border: 1px solid var(--line-2);\n  border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }\n#cmdp-input { width: 100%; border: none; background: transparent; color: var(--ink); font-family: 'Sora',sans-serif;\n  font-size: 1.05rem; padding: 16px 18px; border-bottom: 1px solid var(--line); outline: none; box-sizing: border-box; }\n#cmdp-list { max-height: 52vh; overflow: auto; padding: 6px; }\n.cmdp-item { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: var(--radius-s); cursor: pointer; }\n.cmdp-item.sel, .cmdp-item:hover { background: var(--hi-soft); }\n.cmdp-ico { width: 17px; height: 17px; color: var(--ink-soft); flex: none; display: inline-flex; }\n.cmdp-ico svg { width: 100%; height: 100%; }\n.cmdp-label { flex: 1; font-size: .92rem; }\n.cmdp-sub { color: var(--ink-soft); font-size: .8rem; }\n.cmdp-kind { font-size: .66rem; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); flex: none; }\n.cmdp-empty { padding: 16px; text-align: center; color: var(--ink-soft); font-size: .9rem; }\n\n@media (max-width: 980px) {\n  /* show the mobile chrome */\n  .app-topbar {\n    display: flex; align-items: center; gap: 12px;\n    position: sticky; top: 0; z-index: 70; height: 54px; padding: 0 12px;\n    background: linear-gradient(180deg, var(--fill-2), var(--bg));\n    border-bottom: 1px solid var(--line);\n    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);\n  }\n\n  .shell { grid-template-columns: minmax(0, 1fr); }\n\n  /* sidebar becomes an off-canvas drawer */\n  .app-side {\n    position: fixed; top: 0; left: 0; bottom: 0; height: 100vh; height: 100dvh;\n    width: 274px; max-width: 84vw; z-index: 95;\n    transform: translateX(-100%); transition: transform .26s cubic-bezier(.4,0,.2,1);\n  }\n  body.nav-open .app-side { transform: none; box-shadow: 16px 0 50px rgba(0,0,0,.55); }\n\n  .nav-backdrop {\n    display: block; position: fixed; inset: 0; z-index: 90;\n    background: rgba(8,10,16,.62); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);\n    opacity: 0; pointer-events: none; transition: opacity .26s ease;\n  }\n  body.nav-open .nav-backdrop { opacity: 1; pointer-events: auto; }\n\n  /* Phase 138 (FR-DB1) — \"Recently processed\" + \"Quick actions\" are desktop-only on the Dashboard.\n     Guarded repo-side by scripts/check-mobile-css.sh — keep this exact rule. */\n  .dash-sidecol { display: none; }\n\n  .app-main2 { padding: 22px 18px 120px; }\n  .app-main2.app-flush { height: calc(100vh - 54px); height: calc(100dvh - 54px); }\n  .statgrid { grid-template-columns: repeat(2,1fr); }\n  .pagebar h1 { font-size: 1.5rem; }\n}\n<\u002Fstyle>\n<style>/* music.css — the admin's music surfaces (library Music kind · album.html · artist.html · the round-1 panel).\n   Every class is prefixed mu- (never adv-: an ad blocker's filter list hides those outright). */\n.mu-cell a,.mu-by a{color:inherit}\n.mu-mono{font-family:'JetBrains Mono',monospace}\n.mu-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}\n.mu-status{font-size:.84rem;color:var(--ink-soft)}\n.mu-status b{color:var(--ink);font-family:'Space Grotesk',sans-serif}\n.mu-status .w{color:var(--warn)}\n/* square covers (albums are 1:1, not the 2:3 poster) */\n.mu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 16px}\n.mu-cell{position:relative;display:block;color:var(--ink);text-decoration:none;cursor:pointer;min-width:0}\n.mu-cell:hover{color:var(--ink)}\n.mu-cov{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;display:flex;align-items:flex-end;padding:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}\n.mu-cell:hover .mu-cov{box-shadow:0 0 0 2px var(--hi)}\n.mu-wm{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.02rem;line-height:1.12;color:#fff;text-wrap:balance;text-shadow:0 1px 8px rgba(0,0,0,.45)}\n.mu-nocov{position:absolute;top:9px;left:9px;width:9px;height:9px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px rgba(0,0,0,
