s:5px;border:1px dashed var(--line-2)}\n.vr-m{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;box-sizing:border-box;border-radius:4px;font-family:'Space Grotesk',sans-serif;font-size:.62rem;font-weight:700;line-height:1;color:#0d0f15;background:var(--c)}\n.vr-m+.vr-more{height:18px;box-sizing:border-box}\n.vr-p{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:600;line-height:1;padding:4px 9px;border-radius:999px;border:1px solid var(--line-2);background:var(--fill-2);color:var(--ink);white-space:nowrap}\n.vr-p i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:-1px}\n.vr-p .s{color:var(--ink-soft)}\n.vr-add{margin-left:8px;font-size:.64rem;font-weight:600;color:var(--ink-soft);cursor:pointer;opacity:0;padding:2px 6px;border-radius:5px;border:1px dashed var(--line-2);white-space:nowrap;transition:opacity .15s}\ntr:hover .vr-add{opacity:1}\n.vr-add:hover{color:var(--acc-ink);border-color:var(--hi)}\n.vr-of{font-size:.72rem;color:var(--ink-soft);margin-top:3px}\n.vr-of a{color:var(--ink-soft);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:2px}\n.vr-sum{display:inline-flex;align-items:center;gap:7px}\n.vr-sum .vr-bs,.vr-sum .vr-b,.vr-sum .vr-m,.vr-sum .vr-p{margin-left:0}\n/* the row's number turns into a checkbox on hover, or while a selection is open */\n.vr-num{display:inline}\n.vr-sel{display:none;width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line-2);align-items:center;justify-content:center;font-size:.6rem;font-weight:800;color:#fff;cursor:pointer;box-sizing:border-box}\ntr:hover .vr-sel,.vr-selecting .vr-sel{display:inline-flex}\ntr:hover .vr-num,.vr-selecting .vr-num{display:none}\n.vr-sel.on{background:var(--hi);border-color:var(--hi)}\ntr.vr-on td{background:var(--hi-soft)}\n/* side panel */\n.vr-panel{width:min(520px,100%)}\n.vr-ph .ttl{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.05rem;line-height:1.3;text-wrap:pretty}\n.vr-pv{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:22px;padding:12px 14px;border-radius:12px;background:var(--fill-2);border:1px solid var(--line);margin:12px 0 14px}\n.vr-pv .vr-b{font-size:.74rem;padding:4px 8px}.vr-pv .vr-m{min-width:22px;height:22px;font-size:.72rem}.vr-pv .vr-p{font-size:.8rem;padding:5px 11px}\n.vr-rows{margin-top:6px}\n.vr-row{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:3px 12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer;border-radius:8px}\n.vr-row:hover{background:var(--fill-2)}\n.vr-row .bx{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:800;color:#0d0f15;box-sizing:border-box}\n.vr-row.on .bx{background:var(--c);border-color:var(--c)}\n.vr-row .nm{font-weight:600;font-size:.88rem}\n.vr-row .src{font-size:.7rem;font-weight:600;color:var(--ink-soft);text-align:right;white-space:nowrap}\n.vr-row .src.you{color:var(--acc-ink)}.vr-row .src.rmv{color:var(--warn)}\n.vr-row .mn{grid-column:2/4;font-size:.74rem;color:var(--ink-soft);line-height:1.4}\n.vr-row.rm .nm{text-decoration:line-through;text-decoration-color:var(--ink-soft)}\n.vr-ofp{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:.86rem}\n.vr-dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}\n/* Set version… */\n.vr-bk{display:flex;flex-direction:column;margin-top:6px}\n.vr-bkr{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}\n.vr-bkr .nm{font-weight:600;font-size:.86rem}\n.vr-bkr .seg span{padding:4px 10px;font-size:.74rem}\n/* facet */\n.vr-fpop{min-width:330px}\n.vr-fv{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 8px;border-radius:8px}\n.vr-fv:hover{background:var(--fill-2)}\n.vr-fv .nm{display:flex;align-items:center;gap:8px;min-width:0}\n.vr-fv .nm .vr-b,.vr-fv .nm .vr-m,.vr-fv .nm .vr-p{margin:0}\n.vr-fv .ct{font-size:.72rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}\n.vr-fv.zero{opacity:.5}\n.vr-ie{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}\n.vr-ie span{font-size:.68rem;font-weight:600;padding:4px 9px;cursor:pointer;color:var(--ink-soft)}\n.vr-ie span+span{border-left:1px solid var(--line-2)}\n.vr-ie span:hover{color:var(--ink)}\n.vr-ie .i.on{background:var(--hi-soft);color:var(--acc-ink)}\n.vr-ie .x.on{background:var(--bad-soft);color:var(--bad)}\n.vr-words{display:inline-flex;align-items:center;gap:8px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.95rem;color:var(--ink)}\n.vr-words .rm{cursor:pointer;color:var(--ink-soft);font-size:.8rem}\n/* artist doorway + Metadata tab + Q1 panel */\n.vr-al a{color:var(--ink)}.vr-al a:hover{color:var(--acc-ink)}\n.vr-al .vr-door{color:var(--acc-ink)}\n.vr-sw{display:inline-block;width:22px;height:22px;border-radius:6px;background:var(--c);cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}\n.vr-sw:hover{outline:2px solid var(--hi);outline-offset:2px}\n.vr-mt td{vertical-align:middle}\n.vr-mt .vr-b,.vr-mt .vr-m,.vr-mt .vr-p{margin:0}\n.vr-mi{width:100%;min-width:220px;font:inherit;font-size:.82rem;padding:6px 9px;border-radius:7px;border:1px solid transparent;background:none;color:var(--ink)}\n.vr-mi:hover{border-color:var(--line-2)}.vr-mi:focus{outline:none;border-color:var(--hi);background:var(--fill-2)}\n.vr-qx{display:inline-flex;gap:12px;align-items:center;flex-wrap:wrap;margin-left:6px}\n.vr-qx>*{display:inline-flex;gap:4px;align-items:center}\n<\u002Fstyle>\n<style>/* ravilo-music.css — the phone's music mode (design brief 2026-09-27). Every class is prefixed mu-.\n   Loaded by Ravilo Mobile.html after its inline <style>; reuses the host's .row h3, .tabs/.tab, .srch,\n   .pft-row and the player's .mp-sheet / .mp-row / .mp-fail / .mp-pulse, so nothing is drawn twice. */\n\n/* the three skins, made real on this frame (Settings → Theme set data-skin but only Aurora had tokens here) */\nhtml[data-skin=\"midnight\"]{--bg:#04101a;--bg-2:#07151f;--ink:#eafcff;--ink-soft:#9fc2cf;--ink-dim:#5a7d8a;--line:rgba(160,230,255,.10);--line-2:rgba(160,230,255,.18);--card:#0a1c28;--card-2:#0e2533;--accent:#19d6c6;--accent-2:#2a8cf0;--grad:linear-gradient(120deg,#19d6c6,#2a8cf0)}\nhtml[data-skin=\"noir\"]{--bg:#080807;--bg-2:#0d0c0a;--ink:#f7f3ea;--ink-soft:#c7bfae;--ink-dim:#807868;--line:rgba(255,240,210,.10);--line-2:rgba(255,240,210,.18);--card:#16140f;--card-2:#1f1c15;--accent:#f5b542;--accent-2:#e0792f;--grad:linear-gradient(120deg,#f5b542,#e0792f)}\n\n/* ---- the switch ---- */\n.mu-mode{margin:18px 18px 0;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:18px;background:rgba(var(--fg),.05);border:1px solid var(--line)}\n.mu-mode button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:74px;padding:12px 14px;border-radius:14px;border:0;background:none;color:var(--ink);font-family:'Sora',sans-serif;text-align:left;cursor:pointer}\n.mu-mode button b{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;display:flex;align-items:center;gap:7px}\n.mu-mode button span{font-size:11.5px;line-height:1.35;color:var(--ink-dim)}\n.mu-mode button.on{background:var(--grad);color:#fff}\n.mu-mode button.on span{color:rgba(var(--fg),.86)}\n[data-skin=\"noir\"] .mu-mode button.on{background:var(--ink);color:var(--bg)}\n[data-skin=\"noir\"] .mu-mode button.on span{color:var(--bg);opacity:.75}\n.mu-mode-cap{margin:8px 22px 0;font-size:12px;color:var(--ink-dim)}\n.mu-tseg{display:flex;height:34px;padding:3px;border-radius:17px;background:rgba(var(--fg),.07);border:1px solid var(--line);flex:none}\n.mu-tseg button{border:0;background:none;color:var(--ink-soft);font-family:'Sora',sans-serif;font-size:12.5px;font-weight:600;padding:0 11px;border-radius:14px;cursor:pointer;white-space:nowrap}\n.mu-tseg button.on{background:var(--grad);color:#fff}\n[data-skin=\"noir\"] .mu-tseg button.on{background:var(--ink);color:var(--bg)}\n.mu-brandnote{font-size:15px;line-height:1;margin-left:-2px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}\n[data-skin=\"noir\"] .mu-brandnote{background:none;color:var(--ink)}\n.mu-glyph svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}\n\n/* ---- covers ---- */\n.mu-cv{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;display:flex;align-items:flex-end;padding:9px;flex:none}\n.mu-cv .wm{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;line-height:1.12;color:#fff;text-wrap:balance;text-shadow:0 1px 8px rgba(0,0,0,.4)}\n.mu-cv.sm{width:48px;height:48px;border-radius:7px;padding:4px}\n.mu-cv.sm .wm{font-size:8px}\n[data-skin=\"noir\"] .mu-cv{border-radius:6px}\n\n/* ---- home ---- */\n.mu-track{display:flex;gap:12px;overflow-x:auto;padding:0 18px 2px;scrollbar-width:none}\n.mu-track::-webkit-scrollbar{display:none}\n.mu-acard{flex:none;width:142px;cursor:pointer}\n.mu-acard .t{font-size:13px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.mu-acard .s{font-size:12px;color:var(--ink-dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.mu-arc{flex:none;width:96px;text-align:center;cursor:pointer}\n.mu-arc .c{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;color:#fff}\n.mu-arc .t{font-size:12.5px;font-weight:600;margin-top:8px;line-height:1.25}\n.mu-list{padding:0 8px}\n.mu-song{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:7px 10px;border:0;background:none;color:var(--ink);
