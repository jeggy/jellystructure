<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jellystructure — Audiobook</title>
<link rel="stylesheet" href="wf.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="detail.css">
<link rel="stylesheet" href="music.css">
<style>
a{color:var(--hi)}a:hover{color:var(--acc-ink)}
.ab-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
@media (max-width:1000px){.ab-grid{grid-template-columns:minmax(0,1fr)}}
.ab-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.ab-fields .wide{grid-column:1/-1}
.ab-f label{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin-bottom:5px;font-weight:600}
.ab-f label .src{text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink-dim);margin-left:6px}
.ab-f input,.ab-f textarea,.ab-f select{width:100%;font:inherit;font-size:.88rem;padding:8px 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--fill-2);color:var(--ink)}
.ab-f textarea{min-height:110px;resize:vertical;line-height:1.5}
.ab-f input:focus,.ab-f textarea:focus{outline:none;border-color:var(--hi)}
.ab-f .empty{border-style:dashed}
.ab-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:38px;padding:4px 6px;border-radius:8px;border:1px solid var(--line-2);background:var(--fill-2)}
.ab-chips.empty{border-style:dashed}
.ab-chips .chip{font-size:.78rem}
.ab-chips input{flex:1;min-width:110px;border:0;background:none;padding:4px;font:inherit;font-size:.84rem;color:var(--ink)}
.ab-chips input:focus{outline:none}
.ab-rail{display:flex;flex-direction:column;gap:10px}
.ab-sug{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--fill-2)}
.ab-sug.none{border-style:dashed;background:none}
.ab-sug .h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.84rem}
.ab-sug .h .p{font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-dim)}
.ab-sug .nt{font-size:.76rem;color:var(--ink-soft);margin-top:4px;line-height:1.45}
.ab-sug .hit{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;margin-top:8px}
.ab-sug .hit .th{width:52px;aspect-ratio:1;border-radius:6px}
.ab-sug .fl{display:flex;align-items:center;gap:8px;font-size:.76rem;padding:5px 0;border-top:1px dashed var(--line)}
.ab-sug .fl .k{color:var(--ink-soft);width:78px;flex:none}
.ab-sug .fl .v{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-sug .fl.done .v{color:var(--ok)}
.ab-tr[draggable="true"]{cursor:grab}
.ab-tr.drag td{opacity:.4}
.ab-tr.over td{box-shadow:inset 0 2px 0 var(--hi)}
.ab-grab{color:var(--ink-dim);cursor:grab;font-size:.9rem;user-select:none}
.ab-ch input{font:inherit;font-size:.86rem;padding:5px 8px;border-radius:7px;border:1px solid transparent;background:none;color:var(--ink);width:100%}
.ab-ch input:hover{border-color:var(--line-2)}.ab-ch input:focus{outline:none;border-color:var(--hi);background:var(--fill-2)}
.ab-ring{--p:0;width:34px;height:34px;border-radius:50%;background:conic-gradient(var(--hi) calc(var(--p)*1%),var(--fill-3) 0);display:inline-flex;align-items:center;justify-content:center;flex:none}
.ab-ring::after{content:'';width:24px;height:24px;border-radius:50%;background:var(--fill)}
.ab-asin{display:flex;gap:8px;margin-top:8px}.ab-asin input{flex:1;min-width:0;font:inherit;font-family:'JetBrains Mono',monospace;font-size:.8rem;padding:6px 9px;border-radius:8px;border:1px solid var(--line-2);background:var(--fill-2);color:var(--ink);text-transform:uppercase}
.ab-scols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.ab-scols{grid-template-columns:minmax(0,1fr)}}
.ab-scol{border:1px solid var(--line-2);border-radius:12px;padding:10px;min-height:180px;background:var(--fill-2)}
.ab-scol.over{border-color:var(--hi);background:var(--hi-soft)}
.ab-sh{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.ab-sh input{font:inherit;font-weight:700;font-size:.9rem;padding:5px 8px;border-radius:7px;border:1px solid transparent;background:none;color:var(--ink)}
.ab-sh input:hover,.ab-sh input:focus{border-color:var(--line-2);outline:none}
.ab-spart{display:grid;grid-template-columns:18px 26px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;background:var(--fill);border:1px solid var(--line);margin-top:6px;font-size:.84rem;cursor:grab}
.ab-spart.drag{opacity:.4}
.ab-sempty{padding:26px 8px;text-align:center;color:var(--ink-dim);font-size:.8rem;border:1px dashed var(--line-2);border-radius:8px}
.ab-srcchip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);font-size:.76rem;font-weight:600}
</style>
</head>
<body class="wf-body app-body">
<main class="app-main2 wide" data-page="library" data-screen-label="Audiobook detail">
<div class="backrow"><a class="btn sm ghost" href="library.html?kind=books">‹ Library</a><span class="crumb" id="ab-crumb"></span></div>
<div id="ab-fence"></div>
<div class="pagebar" id="ab-bar"></div>
<div id="ab-head"></div>
<div id="ab-banners"></div>
<div class="tabs2" id="tabbar"></div>
<div id="ab-panel"></div>
<div id="ab-qs"></div>
<div id="ab-tq"></div>
</main>
<div class="mu-lb" id="ab-lb"><div class="im" id="ab-lb-im"></div><div class="cap" id="ab-lb-cap"></div></div>
<script src="app-shell.js"></script>
<script src="music-data.js"></script>
<script src="audiobook-data.js"></script>
<script src="music-qs.js"></script>
<script src="files-tab.js"></script>
<script src="audiobook.js"></script>
</body>
</html>
