<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jellystructure — Series Triage</title>
<link rel="stylesheet" href="wf.css">
<link rel="stylesheet" href="app.css">
<style>
  /* up/down reorder buttons inside the track manager */
  .ord-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 14px; font-size: .58rem; line-height: 1;
    border: 1px solid var(--line-2); border-radius: 4px;
    background: var(--fill-3); color: var(--ink-soft); cursor: pointer;
    user-select: none; transition: background .15s ease, color .15s ease;
  }
  .ord-btn:hover { background: var(--hi-soft); color: var(--hi); border-color: var(--hi); }

  /* section-title action groups never wrap */
  .st-actions, .st-actions .pill-row { flex-wrap: nowrap !important; }
  .st-actions .pill-row > * { flex: none; }

  /* the triage app fills the flush main */
  #root { height: 100%; }

  /* triage's own filmstrip rail toggle + drawer chrome (nested inside the page) */
  .rail-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; flex: none;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--fill-3); color: var(--ink); cursor: pointer;
    font-size: 1.05rem; line-height: 1; user-select: none;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .rail-toggle:hover { background: var(--hi-soft); color: var(--hi); border-color: var(--hi); }
  .rail-close {
    margin-left: 6px; cursor: pointer; color: var(--ink-soft);
    width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 8px; border: 1px solid var(--line); background: var(--fill-3); font-size: .8rem;
  }
  .rail-close:hover { color: var(--ink); border-color: var(--hi); }
</style>
</head>
<body class="wf-body app-body">

<main class="app-main2 app-flush" data-page="library" data-no-dock data-screen-label="Series triage">
  <div id="root"></div>
</main>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="st-shared.jsx"></script>
<script type="text/babel" src="st-dir-c.jsx"></script>

<script type="text/babel">
const { DirectionC } = window;
ReactDOM.createRoot(document.getElementById('root')).render(<DirectionC />);
</script>

<script src="app-shell.js"></script>
</body>
</html>
