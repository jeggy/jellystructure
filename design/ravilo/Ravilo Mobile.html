<!DOCTYPE html>
<html lang="en" data-skin="aurora">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ravilo — Mobile (Pixel 9)</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c13; --bg-2:#0e111b; --ink:#f3f4fb; --ink-soft:#aeb4cb; --ink-dim:#6b7290;
    --line:rgba(255,255,255,.09); --card:#161a28; --card-2:#1b2031;
    --accent:#7b6ef0; --accent-2:#3fb6f5; --grad:linear-gradient(120deg,#7b6ef0,#3fb6f5);
    --good:#2dd49a; --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; background:#05060a; font-family:'Sora',sans-serif; overflow:hidden;}
  #fit{position:fixed; inset:0; display:flex; align-items:center; justify-content:center;}

  /* Pixel 9 — 412×915 portrait */
  .phone{ width:412px; height:915px; border-radius:46px; background:#05060a;
    box-shadow:0 0 0 11px #15171d, 0 0 0 13px #2a2d36, 0 40px 110px rgba(0,0,0,.7); position:relative; }
  .screen{ position:absolute; inset:0; border-radius:46px; overflow:hidden; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; }
  .punch{ position:absolute; top:13px; left:50%; transform:translateX(-50%); width:11px; height:11px; border-radius:50%; background:#000; z-index:60; }

  .statusbar{ height:34px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 24px 0 26px; font-size:13px; font-weight:600; color:var(--ink); z-index:50; }
  .statusbar .ic{ display:flex; gap:5px; align-items:center; opacity:.95; }
  .statusbar svg{ display:block; }

  .scroll{ flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .scroll::-webkit-scrollbar{ display:none; }

  /* app bar */
  .appbar{ position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:12px; padding:8px 18px 10px;
    background:linear-gradient(180deg, var(--bg) 60%, rgba(10,12,19,0)); }
  .wm{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:21px; letter-spacing:-.02em; }
  .wm .g{ background:var(--grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .appbar .sp{ flex:1; }
  .iconbtn{ width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.07); color:var(--ink); border:none; cursor:pointer; }
  .iconbtn:active{ background:rgba(255,255,255,.15); }
  .avatar{ width:34px; height:34px; border-radius:50%; background:var(--grad); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color:#fff; font-family:'Space Grotesk',sans-serif; }

  /* tab chips */
  .tabs{ position:sticky; top:56px; z-index:39; display:flex; gap:8px; padding:4px 18px 12px; overflow-x:auto; background:var(--bg); scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{ flex:none; padding:7px 15px; border-radius:999px; font-size:14px; font-weight:600; color:var(--ink-soft); background:rgba(255,255,255,.06); cursor:pointer; white-space:nowrap; transition:.18s var(--ease); }
  .tab.on{ background:var(--ink); color:#0a0c13; }

  /* hero carousel */
  .hero{ display:flex; overflow-x:auto; scroll-snap-type:x mandatory; gap:0; scrollbar-width:none; }
  .hero::-webkit-scrollbar{ display:none; }
  .hslide{ flex:none; width:376px; margin:0 18px; scroll-snap-align:center; }
  .hcard{ position:relative; height:470px; border-radius:20px; overflow:hidden; background-size:cover; background-position:center; }
  .hcard .scrim{ position:absolute; inset:0; background:linear-gradient(0deg, rgba(8,10,16,.96) 6%, rgba(8,10,16,.55) 38%, rgba(8,10,16,.08) 70%); }
  .hcard .body{ position:absolute; left:0; right:0; bottom:0; padding:20px 20px 22px; }
  .hbadge{ position:absolute; top:14px; left:14px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:11px; letter-spacing:.04em; padding:4px 9px; border-radius:7px; background:rgba(8,10,16,.6); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); color:#fff; }
  .htag{ font-size:12px; font-weight:600; color:var(--accent-2); letter-spacing:.04em; text-transform:uppercase; margin-bottom:6px; }
  .htitle{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:31px; line-height:1.02; letter-spacing:-.01em; }
  .hmeta{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:9px; font-size:12.5px; color:var(--ink-soft); }
  .hmeta .pg{ border:1px solid var(--line); border-radius:5px; padding:0 5px; font-size:11px; }
  .hbtns{ display:flex; gap:10px; margin-top:15px; }
  .btn{ flex:1; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; gap:7px; font-weight:600; font-size:15px; cursor:pointer; border:none; }
  .btn.play{ background:var(--ink); color:#0a0c13; }
  .btn.ghost{ background:rgba(255,255,255,.13); color:var(--ink); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
  .btn:active{ transform:scale(.97); }
  .hdots{ display:flex; gap:6px; justify-content:center; padding:12px 0 2px; }
  .hdots i{ width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.25); transition:.2s; }
  .hdots i.on{ width:18px; border-radius:3px; background:var(--accent); }

  /* rows */
  .row{ margin-top:24px; }
  .row h3{ font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:600; padding:0 18px 11px; display:flex; align-items:center; gap:7px; }
  .row h3 .more{ margin-left:auto; font-family:'Sora',sans-serif; font-size:12px; font-weight:500; color:var(--ink-dim); }
  .track{ display:flex; gap:11px; overflow-x:auto; padding:0 18px 2px; scrollbar-width:none; }
  .track::-webkit-scrollbar{ display:none; }
  .tile{ flex:none; width:118px; cursor:pointer; }
  .poster{ width:118px; height:177px; border-radius:12px; overflow:hidden; position:relative; display:flex; align-items:center; justify-content:center; }
  .poster .ini{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:30px; color:rgba(255,255,255,.9); }
  .poster .pb{ position:absolute; top:7px; right:7px; font-size:9.5px; font-weight:700; font-family:'Space Grotesk',sans-serif; padding:2px 6px; border-radius:5px; background:rgba(8,10,16,.66); color:#fff; }
  .tile:active .poster{ outline:2px solid var(--accent); }
  .tlabel{ font-size:12.5px; font-weight:500; margin-top:7px; line-height:1.25; }
  .tsub{ font-size:11px; color:var(--ink-dim); margin-top:1px; }

  /* studios rail */
  .studios{ display:flex; gap:10px; overflow-x:auto; padding:0 18px; scrollbar-width:none; }
  .studios::-webkit-scrollbar{ display:none; }
  .studio{ flex:none; width:96px; height:60px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:800; color:#fff; font-size:16px; cursor:pointer; box-shadow:inset 0 0 0 1px rgba(255,255,255,.08); }
  .studio small{ font-size:10px; vertical-align:super; }

  /* top 10 list */
  .t10{ padding:4px 18px 0; }
  .t10row{ display:flex; align-items:center; gap:2px; padding:8px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .t10num{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:46px; width:54px; flex:none; text-align:center; line-height:1; background:linear-gradient(180deg,var(--ink),var(--ink-dim)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .t10p{ width:58px; height:80px; border-radius:9px; flex:none; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:700; color:rgba(255,255,255,.9); font-size:18px; }
  .t10b{ flex:1; min-width:0; padding-left:12px; }
  .t10b .nm{ font-weight:600; font-size:15px; }
  .t10b .mt{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .t10b .st{ font-size:11px; margin-top:5px; display:inline-flex; align-items:center; gap:5px; }
  .st .dot{ width:7px; height:7px; border-radius:50%; }
  .st.avail{ color:var(--good); } .st.avail .dot{ background:var(--good); }
  .st.fetch{ color:var(--accent-2); } .st.fetch .dot{ background:var(--accent-2); }
  .st.none{ color:var(--ink-dim); } .st.none .dot{ background:var(--ink-dim); }

  /* R221 — genre chips on the phone detail. No D-pad here, so the row wraps freely and
     there is no cap; the chips are already a comfortable tap target. */
  .dgenres{ display:flex; gap:7px; flex-wrap:wrap; margin:12px 0 0; }
  .dgen{ height:34px; padding:0 15px; border-radius:17px; display:inline-flex; align-items:center; font-size:13px; font-weight:500;
    color:var(--ink); background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.09); }
  .dgen.lead{ background:color-mix(in oklch, var(--accent) 22%, transparent); border-color:color-mix(in oklch, var(--accent) 45%, transparent); font-weight:600; }

  /* R222 — the per-device slow-start line, above the buttons. Same sentence as TV, wrapping freely. */
  .dslow{ display:flex; gap:9px; align-items:flex-start; margin:15px 0 0; font-size:12.5px; line-height:1.55; color:var(--ink-soft); }
  .dslow i{ flex:none; width:3px; align-self:stretch; border-radius:2px; background:#f5b542; }
  .dslow b{ font-weight:600; color:#f0c07a; }
  [data-skin="noir"] .dslow i{ background:var(--ink); }
  [data-skin="noir"] .dslow b{ color:var(--ink); font-weight:700; }

  /* detail screen */
  .detail{ position:absolute; inset:0; background:var(--bg); z-index:70; display:flex; flex-direction:column; transform:translateX(100%); transition:transform .3s var(--ease); }
  .detail.on{ transform:translateX(0); }
  .dscroll{ flex:1; overflow-y:auto; scrollbar-width:none; }
  .dscroll::-webkit-scrollbar{ display:none; }
  .dhero{ height:340px; position:relative; background-size:cover; background-position:center; }
  .dhero .scrim{ position:absolute; inset:0; background:linear-gradient(0deg, var(--bg) 3%, rgba(10,12,19,.5) 45%, rgba(10,12,19,.1) 100%); }
  .dback{ position:absolute; top:14px; left:14px; z-index:5; width:38px; height:38px; border-radius:50%; background:rgba(8,10,16,.55); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; color:#fff; border:none; cursor:pointer; }
  .dbody{ padding:0 20px 30px; margin-top:-58px; position:relative; }
  .dtitle{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:27px; line-height:1.05; }
  .dmeta{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:9px; font-size:12.5px; color:var(--ink-soft); }
  .dmeta .pg{ border:1px solid var(--line); border-radius:5px; padding:0 5px; font-size:11px; }
  .dbtns{ display:flex; gap:10px; margin-top:16px; }
  .dsyn{ margin-top:16px; font-size:14px; line-height:1.6; color:var(--ink-soft); }
  /* Direction F — the same facts as the TV's About section, stacked two-up. Reading
     surface only; the phone's tap targets are unaffected. */
  .aboutp{ margin-top:22px; }
  .aboutp .g{ display:grid; grid-template-columns:1fr 1fr; gap:14px 16px; margin-top:12px; }
  .aboutp .k{ font-size:10px; font-weight:600; letter-spacing:1.6px; text-transform:uppercase; color:var(--ink-dim); }
  .aboutp .v{ font-size:14px; color:var(--ink); margin-top:3px; font-weight:500; }
  .seclbl{ font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:600; margin:22px 0 11px; }

  /* Multi-episode files — combined triptych card (Option B) */
  .melist{ display:flex; flex-direction:column; gap:14px; }
  .mecombo{ border:1px solid var(--line); border-radius:14px; overflow:hidden; background:rgba(255,255,255,.03); }
  .mestill{ position:relative; aspect-ratio:16/9; }
  .mestill .trip, .mestill .trip .tp{ position:absolute; inset:0; }
  .mestill .trip .tp1{ clip-path:polygon(0 0,37% 0,29% 100%,0 100%); }
  .mestill .trip .tp2{ clip-path:polygon(37% 0,69% 0,61% 100%,29% 100%); }
  .mestill .trip .tp3{ clip-path:polygon(69% 0,100% 0,100% 100%,61% 100%); }
  .mestill .seam{ position:absolute; top:-8%; height:116%; width:2.5px; background:rgba(255,255,255,.9); box-shadow:0 0 0 1px rgba(0,0,0,.5); z-index:4; }
  .mestill .seam1{ left:33%; transform:rotate(8.1deg); }
  .mestill .seam2{ left:65%; transform:rotate(8.1deg); }
  .mestill .tnum{ position:absolute; top:6px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.85); z-index:5; }
  .mestill .tnum1{ left:10px; } .mestill .tnum2{ left:45%; } .mestill .tnum3{ right:10px; }
  .mestill .merng{ position:absolute; left:10px; bottom:9px; z-index:6; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12px; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.8); background:rgba(10,12,19,.55); padding:2px 9px; border-radius:20px; }
  .mebody{ padding:11px 13px 13px; }
  .met{ font-size:15px; font-weight:600; }
  .merows{ margin-top:7px; }
  .merow{ display:flex; gap:10px; align-items:center; padding:5px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .merow:last-child{ border-bottom:none; }
  .merow .n{ font-family:'JetBrains Mono',ui-monospace,monospace; color:var(--accent); width:26px; flex:none; }
  .merow .t{ color:var(--ink-soft); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .merow .d{ color:var(--ink-dim); font-size:11px; }
  .mefile{ margin-top:9px; font-family:'JetBrains Mono',ui-monospace,monospace; font-size:11px; color:var(--accent); }
  .merow-single{ display:flex; gap:11px; align-items:center; padding:11px 13px; border:1px solid var(--line); border-radius:14px; }
  .methumb{ width:104px; height:59px; border-radius:8px; flex:none; position:relative; overflow:hidden; }
  .methumb .mn{ position:absolute; left:7px; top:3px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px; color:#fff; text-shadow:0 1px 5px rgba(0,0,0,.7); }
  .memeta2{ flex:1; min-width:0; }
  .memeta2 .mt2{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .memeta2 .md2{ font-size:11px; color:var(--ink-dim); margin-top:2px; }

  /* ---- profile sheet + account screens (R234) ----
     Photo upload is a phone/web-only surface by decision: the TV renders a photo but never
     offers to change one. Hit targets are 46px+ here and the type never drops below 13px,
     because this whole tree is touch-first — the TV's own version of the password form
     lives in ravilo-app.js and reuses R175's on-screen keyboard instead. */
  .sheet-scrim{ position:absolute; inset:0; background:rgba(6,8,14,.62); opacity:0; pointer-events:none; transition:opacity .18s; z-index:40; }
  .sheet-scrim.on{ opacity:1; pointer-events:auto; }
  .psheet{ position:absolute; left:0; right:0; bottom:0; z-index:41; background:var(--bg-2); border-top:1px solid var(--line);
    border-radius:20px 20px 0 0; padding:8px 0 calc(10px + env(safe-area-inset-bottom)); transform:translateY(100%); transition:transform .22s cubic-bezier(.2,.8,.2,1); }
  .psheet.on{ transform:none; }
  .psheet .grab{ width:38px; height:4px; border-radius:4px; background:rgba(255,255,255,.22); margin:6px auto 12px; }
  .psheet .ph-head{ display:flex; align-items:center; gap:12px; padding:0 18px 14px; }
  .psheet .ph-av{ width:46px; height:46px; border-radius:50%; flex:none; background:var(--grad); display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px; color:#fff; }
  .psheet .ph-av.has-photo{ color:transparent; overflow:hidden; }
  .av-img{ width:100%; height:100%; border-radius:inherit; object-fit:cover; display:block; }
  .psheet .ph-nm{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; }
  .psheet .ph-sub{ font-size:12px; color:var(--ink-dim); margin-top:1px; }
  .psheet .prow{ display:flex; align-items:center; gap:12px; min-height:50px; padding:0 18px; font-size:15px; color:var(--ink); background:none; border:none; width:100%; text-align:left; cursor:pointer; }
  .psheet .prow:active{ background:rgba(255,255,255,.06); }
  .psheet .prow .pic{ width:22px; text-align:center; color:var(--ink-soft); font-size:15px; }
  .psheet .prow.danger{ color:#f5667a; }

  /* account screens share the detail panel's slide-in, so Back feels the same everywhere */
  .acct{ position:absolute; inset:34px 0 0; z-index:45; background:var(--bg); transform:translateX(100%); transition:transform .24s cubic-bezier(.2,.8,.2,1); overflow-y:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .acct::-webkit-scrollbar{ display:none; }
  .acct.on{ transform:none; }
  .acct-bar{ position:sticky; top:0; display:flex; align-items:center; gap:6px; height:52px; padding:0 8px; background:linear-gradient(180deg,var(--bg) 70%,transparent); z-index:2; }
  .acct-bar button{ width:44px; height:44px; border-radius:50%; border:none; background:none; color:var(--ink); font-size:26px; line-height:1; cursor:pointer; }
  .acct-bar h2{ font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:700; }
  .acct-body{ padding:4px 18px calc(28px + env(safe-area-inset-bottom)); }
  .acct-sec{ font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-dim); margin:20px 0 10px; }

  .pf-photo{ display:flex; flex-direction:column; align-items:center; gap:14px; padding:10px 0 4px; }
  .pf-av{ width:132px; height:132px; border-radius:50%; background:var(--grad); display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:46px; color:#fff; position:relative; }
  .pf-av.has-photo{ color:transparent; overflow:hidden; }
  .pf-av.drop{ outline:2px dashed var(--accent); outline-offset:5px; }
  .pf-nm{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px; }
  .pf-sub{ font-size:13px; color:var(--ink-dim); text-align:center; max-width:280px; line-height:1.5; margin-top:-8px; }
  .pf-btns{ display:flex; flex-direction:column; gap:10px; width:100%; margin-top:6px; }
  .pf-btn{ display:flex; align-items:center; justify-content:center; gap:9px; min-height:48px; border-radius:13px; font-size:15px; font-weight:600;
    font-family:'Sora',sans-serif; cursor:pointer; border:1px solid var(--line); background:rgba(255,255,255,.05); color:var(--ink); }
  .pf-btn.primary{ background:var(--grad); border-color:transparent; color:#fff; }
  .pf-btn.danger{ color:#f5667a; border-color:rgba(245,102,122,.4); background:rgba(245,102,122,.08); }
  .pf-btn:active{ transform:scale(.985); }
  .pf-drop{ font-size:12px; color:var(--ink-dim); text-align:center; }
  .pf-note{ display:flex; align-items:center; gap:8px; border-radius:12px; padding:11px 13px; font-size:13.5px; line-height:1.45; margin-top:14px; }
  .pf-note.ok{ background:rgba(45,212,154,.12); border:1px solid rgba(45,212,154,.4); color:#2dd49a; }
  .pf-note.bad{ background:rgba(245,102,122,.12); border:1px solid rgba(245,102,122,.4); color:#f5667a; }

  .fld{ margin-bottom:14px; }
  .fld label{ display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; }
  .fld input{ width:100%; height:48px; border-radius:12px; background:var(--bg-2); border:1px solid var(--line); color:var(--ink);
    font-family:'Sora',sans-serif; font-size:16px; padding:0 14px; }
  .fld input:focus{ outline:none; border-color:var(--accent); }
  .acct-row{ display:flex; align-items:center; gap:12px; width:100%; min-height:54px; padding:0 14px; border-radius:13px; border:1px solid var(--line);
    background:rgba(255,255,255,.04); color:var(--ink); font-family:'Sora',sans-serif; font-size:15px; text-align:left; cursor:pointer; }
  .acct-row .rsub{ font-size:12px; color:var(--ink-dim); margin-top:2px; }
  .acct-row .chev{ margin-left:auto; color:var(--ink-dim); font-size:19px; }

  .label{ position:absolute; bottom:-30px; left:0; right:0; text-align:center; color:#54596b; font-size:12px; font-family:'Space Grotesk',sans-serif; letter-spacing:.05em; }
</style>
</head>
<body>
<div id="fit">
  <div class="phone">
    <div class="punch"></div>
    <div class="screen">
      <div class="statusbar">
        <span>9:41</span>
        <span class="ic">
          <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="4.5" width="3" height="7.5" rx="1"/><rect x="9" y="2" width="3" height="10" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.6c2.3 0 4.4.9 6 2.4l1.4-1.5A12 12 0 0 0 8 0 12 12 0 0 0 .6 3.5L2 5A8.4 8.4 0 0 1 8 2.6Zm0 4c1.2 0 2.3.5 3.1 1.3l1.4-1.5A6.4 6.4 0 0 0 8 4.6 6.4 6.4 0 0 0 3.5 6.4l1.4 1.5A4.4 4.4 0 0 1 8 6.6Zm0 4 2-2.1A2.8 2.8 0 0 0 8 7.6a2.8 2.8 0 0 0-2 .9Z"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="1" y="1" width="20" height="10" rx="3" stroke="currentColor" stroke-opacity=".5" fill="none"/><rect x="2.5" y="2.5" width="15" height="7" rx="1.5" fill="currentColor"/><rect x="22.5" y="4" width="1.6" height="4" rx=".8" fill="currentColor" fill-opacity=".6"/></svg>
        </span>
      </div>
      <div class="scroll" id="scroll">
        <div class="appbar">
          <div class="wm"><span class="g">Ravilo</span></div>
          <span class="sp"></span>
          <button class="iconbtn" id="searchBtn" aria-label="Search">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          </button>
          <div class="avatar" id="avatarBtn">ER</div>
        </div>
        <div class="tabs" id="tabs">
          <div class="tab on" data-tab="home">Home</div>
          <div class="tab" data-tab="movies">Movies</div>
          <div class="tab" data-tab="series">Series</div>
          <div class="tab" data-tab="top10">Top 10</div>
        </div>
        <div id="app"></div>
      </div>

      <div class="detail" id="detail">
        <div class="dscroll" id="dscroll"></div>
      </div>

      <div class="acct" id="acct"><div id="acctInner"></div></div>
      <div class="sheet-scrim" id="pmScrim"></div>
      <div class="psheet" id="pmSheet">
        <div class="grab"></div>
        <div class="ph-head">
          <div class="ph-av" id="pmAv">ER</div>
          <div><div class="ph-nm">Eyð</div><div class="ph-sub">Jellyfin · admin</div></div>
        </div>
        <button class="prow" data-pm="profile"><span class="pic">☺</span> Your profile</button>
        <button class="prow" data-pm="mylist"><span class="pic">＋</span> My List</button>
        <button class="prow" data-pm="settings"><span class="pic">⚙</span> Settings</button>
        <button class="prow danger" data-pm="signout"><span class="pic">⏏</span> Sign out</button>
      </div>
    </div>
    <div class="label">Ravilo · Pixel 9 · portrait</div>
  </div>
</div>

<script src="ravilo-i18n.js"></script>
<script src="ravilo-data.js"></script>
<script>
(function(){
  const R = window.RAVILO;
  const app = document.getElementById('app');
  const scroll = document.getElementById('scroll');
  const detail = document.getElementById('detail');
  const dscroll = document.getElementById('dscroll');
  const esc = s => (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  let tab = 'home';

  /* ---- fit phone to viewport ---- */
  function fit(){
    const ph = document.querySelector('.phone');
    const s = Math.min(window.innerWidth/452, window.innerHeight/975, 1);
    ph.style.transform = 'scale('+s+')';
  }
  window.addEventListener('resize', fit); fit();

  /* ---- tiles & rows ---- */
  function tile(it){
    const badge = it.badge ? '<span class="pb">'+esc(it.badge)+'</span>' : '';
    return '<div class="tile" data-title="'+esc(it.title)+'">'
      + '<div class="poster" style="background:'+it.grad+';">'+badge+'<span class="ini">'+esc(it.initials)+'</span></div>'
      + '<div class="tlabel">'+esc(it.title)+'</div><div class="tsub">'+esc(String(it.year))+' · '+esc(it.genre.split(' · ')[0])+'</div></div>';
  }
  function rowHTML(r){
    return '<div class="row"><h3>'+esc(r.title)+'<span class="more">See all ›</span></h3>'
      + '<div class="track">'+r.items.map(tile).join('')+'</div></div>';
  }

  /* ---- hero ---- */
  function heroHTML(items){
    const slides = items.map(h=>{
      const bg = h.backdrop ? 'url('+h.backdrop+') center/cover' : h.grad;
      return '<div class="hslide" data-title="'+esc(h.title)+'"><div class="hcard" style="background:'+bg+';">'
        + (h.badge?'<span class="hbadge">'+esc(h.badge)+'</span>':'')
        + '<div class="scrim"></div><div class="body">'
        + (h.tagline?'<div class="htag">'+esc(h.tagline)+'</div>':'')
        + '<div class="htitle">'+esc(h.title)+'</div>'
        + '<div class="hmeta"><span>'+esc(String(h.year))+'</span><span>·</span><span>'+esc(h.genre)+'</span><span class="pg">'+esc(h.rating)+'</span></div>'
        + '<div class="hbtns"><button class="btn play" data-play="'+esc(h.title)+'">▶ Play</button><button class="btn ghost" data-title="'+esc(h.title)+'">ⓘ Info</button></div>'
        + '</div></div></div>';
    }).join('');
    const dots = items.map((_,i)=>'<i class="'+(i===0?'on':'')+'"></i>').join('');
    return '<div class="hero" id="hero">'+slides+'</div><div class="hdots" id="hdots">'+dots+'</div>';
  }

  function rowsForTab(){
    if(tab==='movies') return R.rows.filter(r=>r.items.some(i=>i.kind==='film')).map(r=>({title:r.title,items:r.items.filter(i=>i.kind==='film')})).filter(r=>r.items.length);
    if(tab==='series') return R.rows.filter(r=>r.items.some(i=>i.kind==='series')).map(r=>({title:r.title,items:r.items.filter(i=>i.kind==='series')})).filter(r=>r.items.length);
    return R.rows;
  }

  function renderHome(){
    const heroItems = tab==='movies' ? R.hero.filter(h=>h.kind==='film') : tab==='series' ? R.hero.filter(h=>h.kind==='series') : R.hero;
    let html = heroHTML(heroItems);
    if(tab==='home'){
      html += '<div class="row"><h3>Channels</h3><div class="studios">'
        + R.studios.map(s=>'<div class="studio" style="background:'+s.bg+';">'+s.wm.replace(/<small>/g,'<small>').replace(/<\/small>/g,'</small>')+'</div>').join('')
        + '</div></div>';
    }
    html += rowsForTab().slice(0,6).map(rowHTML).join('');
    html += '<div style="height:30px;"></div>';
    app.innerHTML = html;
    wireHero();
  }

  function renderTop10(){
    const list = R.discover.lists[0];
    const statusClass = s => s==='available'?'avail':(s==='downloading'||s==='fetching'?'fetch':'none');
    const statusText = it => it.status==='available'?'In library':(it.status==='downloading'||it.status==='fetching'?'Fetching…':'Not in library');
    app.innerHTML = '<div class="row" style="margin-top:8px;"><h3 style="padding-bottom:4px;">'+esc(list.title)+'</h3>'
      + '<div class="tiny" style="padding:0 18px 6px;color:var(--ink-dim);font-size:12px;">'+esc(list.note||'')+'</div></div>'
      + '<div class="t10">'
      + list.items.slice(0,10).map((it,i)=>'<div class="t10row" data-title="'+esc(it.title)+'">'
          + '<div class="t10num">'+(i+1)+'</div>'
          + '<div class="t10p" style="background:'+it.grad+';">'+esc(it.initials)+'</div>'
          + '<div class="t10b"><div class="nm">'+esc(it.title)+'</div>'
          + '<div class="mt">'+esc(String(it.year))+' · '+esc(it.genre)+(it.views?' · '+esc(it.views):'')+'</div>'
          + '<span class="st '+statusClass(it.status)+'"><span class="dot"></span>'+statusText(it)+'</span></div></div>').join('')
      + '</div><div style="height:30px;"></div>';
  }

  function render(){
    document.querySelectorAll('#tabs .tab').forEach(t=>t.classList.toggle('on', t.dataset.tab===tab));
    scroll.scrollTop = 0;
    if(tab==='top10') renderTop10(); else renderHome();
  }

  /* ---- hero dots on scroll ---- */
  function wireHero(){
    const hero = document.getElementById('hero'), dots = document.getElementById('hdots');
    if(!hero||!dots) return;
    hero.addEventListener('scroll', ()=>{
      const i = Math.round(hero.scrollLeft / (hero.firstChild.offsetWidth + 0));
      const slideW = hero.scrollWidth / hero.children.length;
      const idx = Math.round(hero.scrollLeft / slideW);
      [...dots.children].forEach((d,k)=>d.classList.toggle('on', k===idx));
    }, {passive:true});
  }

  /* ---- detail ---- */
  function mPad(n){ return String(n).padStart(2,'0'); }
  function mEpUnits(eps){ const u=[]; let cur=null; eps.forEach(e=>{ if(e.file){ if(cur&&cur.file===e.file){ cur.eps.push(e); } else { cur={file:e.file,eps:[e]}; u.push(cur); } } else { u.push({single:e}); cur=null; } }); return u; }
  function episodesHTML(it){
    if(it.kind!=='series' || !R.episodesFor) return '';
    const eps = R.episodesFor(it, 0);
    const units = mEpUnits(eps);
    const cards = units.map(u=>{
      if(u.single){ const e=u.single; return '<div class="merow-single">'
        + '<div class="methumb" style="background:'+e.grad+'"><span class="mn">'+mPad(e.n)+'</span></div>'
        + '<div class="memeta2"><div class="mt2">'+esc(e.title)+'</div><div class="md2">'+esc(e.dur)+'</div></div></div>'; }
      const eps3=u.eps.slice(0,3);
      const tiles=eps3.map((e,i)=>'<div class="tp tp'+(i+1)+'" style="background:'+e.grad+'"></div>').join('');
      const nums=eps3.map((e,i)=>'<span class="tnum tnum'+(i+1)+'">'+mPad(e.n)+'</span>').join('');
      const first=u.eps[0].n, last=u.eps[u.eps.length-1].n;
      const durSum=u.eps.reduce((a,e)=>a+(parseInt(e.dur)||0),0);
      const rows=u.eps.map(e=>'<div class="merow"><span class="n">'+mPad(e.n)+'</span><span class="t">'+esc(e.title)+'</span><span class="d">'+esc(e.dur)+'</span></div>').join('');
      return '<div class="mecombo">'
        + '<div class="mestill"><div class="trip">'+tiles+'<span class="seam seam1"></span><span class="seam seam2"></span>'+nums+'</div>'
        + '<span class="merng">Episodes '+first+'\u2013'+last+'</span></div>'
        + '<div class="mebody"><div class="met">Episodes '+first+'\u2013'+last+'</div>'
        + '<div class="merows">'+rows+'</div>'
        + '<div class="mefile">\u25a4 1 file \u00b7 '+u.eps.length+' episodes \u00b7 '+durSum+'m</div></div></div>';
    }).join('');
    return '<div class="seclbl">Episodes <span style="font-weight:400;color:var(--ink-dim);font-family:Sora,sans-serif;font-size:12px;">Season 1 \u00b7 '+units.length+' files</span></div>'
      + '<div class="melist">'+cards+'</div>';
  }
  function findItem(title){
    const all = [].concat(R.hero, ...R.rows.map(r=>r.items), ...R.discover.lists.map(l=>l.items));
    return all.find(x=>x.title===title) || {title, year:'', genre:'', rating:'12', grad:R.grad(title), initials:R.initials(title)};
  }
  /* R221 — every genre, first one primary. TMDB's order; no cap on the phone. */
  function genresHTML(it){
    const gs = R.genresFor ? R.genresFor(it) : String(it.genre||'').split(' · ').filter(Boolean);
    if(!gs.length) return '';
    return '<div class="dgenres">'+gs.map((g,i)=>'<span class="dgen'+(i===0?' lead':'')+'">'+esc(g)+'</span>').join('')+'</div>';
  }
  // R222 — the phone renders the same server-pushed field. In production the backend answers it
  // for THIS phone (its own decoder, its own history), so a title that carries the note on the TV
  // may carry nothing here; the mock substitutes the phone's name to show that it is per-device.
  // i18n keys: slow_lead · slow_tail_expected · slow_tail_measured · this_phone.
  function slowHTML(it){
    const n = R.playbackNoteFor ? R.playbackNoteFor(it) : null;
    if(!n) return '';
    const tail = (n.basis==='measured' && n.seconds) ? 'The last few times it took about '+n.seconds+' seconds.'
      : 'Give it a moment after you press play.';
    return '<div class="dslow"><i></i><span><b>Slow to start on Pixel 8.</b> '+tail+'</span></div>';
  }
  function aboutHTML(it){
    const ab = R.aboutFor ? R.aboutFor(it) : null;
    if(!ab) return '';
    const isS = it.kind==='series';
    const seasons = isS && R.seasonsFor ? R.seasonsFor(it) : 0;
    const epTotal = isS && R.episodesFor ? R.episodesFor(it,0).length*seasons : 0;
    const d = iso => { const x=new Date(iso+'T00:00:00Z'); return isNaN(x)?iso:x.toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}); };
    const f = (k,v) => v ? '<div><div class="k">'+k+'</div><div class="v">'+esc(String(v))+'</div></div>' : '';
    return '<div class="aboutp"><div class="seclbl" style="margin:0;">About</div><div class="g">'
      + f('Runtime', isS ? ab.runtime+' min per episode' : ab.runtime+' min')
      + f(isS?'First aired':'Released', d(ab.aired))
      + f('Director', ab.director)
      + f(isS?'Network':'Studio', ab.network)
      + f('Country', ab.country)
      + f('Original language', ab.lang)
      + (isS ? f('Seasons', seasons+' · '+epTotal+' episodes') : '')
      + f('In your library since', d(ab.added))
      + '</div></div>';
  }
  function openDetail(title){
    const it = findItem(title);
    const art = R.artFor ? R.artFor(it) : { backdrop: it.backdrop, grad: it.grad };
    const bg = art.backdrop ? 'url('+art.backdrop+') center/cover' : art.grad;
    const syn = (R.synFor ? R.synFor(it) : it.syn) || 'A standout title from your Jellyfin library, organised and ready to play through Ravilo.';
    const more = (R.relatedFor ? R.relatedFor(it) : R.rows[0].items).slice(0,10);
    dscroll.innerHTML = '<div class="dhero" style="background:'+bg+';"><button class="dback" id="dback">‹</button><div class="scrim"></div></div>'
      + '<div class="dbody">'
      + '<div class="dtitle">'+esc(it.title)+'</div>'
      + '<div class="dmeta"><span>'+esc(String(it.year))+'</span><span class="pg">'+esc(it.rating)+'</span>'+(it.kind?'<span>·</span><span>'+(it.kind==='series'?'Series':'Film')+'</span>':'')+'</div>'
      + genresHTML(it)
      + slowHTML(it)
      + '<div class="dbtns"><button class="btn play">▶ Play</button><button class="btn ghost">＋ My List</button></div>'
      + '<div class="dsyn">'+esc(syn)+'</div>'
      + (it.kind==='series' ? episodesHTML(it) : '')
      + aboutHTML(it)
      + '<div class="seclbl">More like this</div>'
      + '<div class="track" style="padding-left:0;padding-right:0;">'+more.map(tile).join('')+'</div>'
      + '<div style="height:24px;"></div></div>';
    detail.classList.add('on');
    dscroll.scrollTop = 0;
  }
  function closeDetail(){ detail.classList.remove('on'); }

  /* ---- events ---- */
  document.getElementById('tabs').addEventListener('click', e=>{ const t=e.target.closest('[data-tab]'); if(t){ tab=t.dataset.tab; render(); } });
  app.addEventListener('click', e=>{
    const play = e.target.closest('[data-play]'); if(play){ openDetail(play.dataset.play); return; }
    const el = e.target.closest('[data-title]'); if(el){ openDetail(el.dataset.title); }
  });
  dscroll.addEventListener('click', e=>{
    if(e.target.closest('#dback')){ closeDetail(); return; }
    const el = e.target.closest('[data-title]'); if(el){ openDetail(el.dataset.title); }
  });
  document.getElementById('searchBtn').addEventListener('click', ()=>{ tab='top10'; render(); });

  /* ---- profile sheet → Your profile (photo) + Settings → Account (password) ----
     R234. Photo picking is the real control the product would ship: a file input for the
     gallery, the same input with capture="user" for the camera, a drop zone for web, and a
     preset-colour row for people who want no photo at all. The chosen photo is stored per
     user, so the TV mockup and the admin's user row read the same one — one stored fact,
     one representation, exactly like the decode-ceiling note. */
  const AV = (R.avatars||{});
  const ME = (R.profiles||[]).find(p=>p.id==='eyd') || { id:'eyd', name:'Eyð', initials:'ER', color:'linear-gradient(145deg,#7b6ef0,#3fb6f5)' };
  const pmSheet = document.getElementById('pmSheet'), pmScrim = document.getElementById('pmScrim');
  const acct = document.getElementById('acct'), acctInner = document.getElementById('acctInner');
  let acctNote = null;   // {kind:'ok'|'bad', text} — cleared on every navigation

  function faceOf(){ return AV.avatarFace ? AV.avatarFace(ME) : { photo:null, style:'background:'+ME.color, label:ME.initials }; }
  function paintFace(node, label){
    const f = faceOf();
    node.classList.toggle('has-photo', !!f.photo);
    node.style.cssText = f.style;
    node.innerHTML = f.photo ? '<img class="av-img" src="'+f.photo+'" alt="">' : (label===false ? '' : esc(f.label));
  }
  function paintAvatars(){
    paintFace(document.getElementById('avatarBtn'));
    paintFace(document.getElementById('pmAv'));
    const big = document.getElementById('pfAv'); if(big) paintFace(big);
  }
  function openSheet(on){ pmSheet.classList.toggle('on', on); pmScrim.classList.toggle('on', on); }
  function openAcct(html){ acctNote=null; acctInner.innerHTML = html; acct.classList.add('on'); acct.scrollTop = 0; }
  function closeAcct(){ acct.classList.remove('on'); }
  function noteHTML(){ return acctNote ? '<div class="pf-note '+acctNote.kind+'">'+(acctNote.kind==='ok'?'✓':'⚠')+' <span>'+esc(acctNote.text)+'</span></div>' : ''; }

  function profileHTML(){
    const f = faceOf();
    const fine = window.matchMedia('(pointer:fine)').matches;   // web gets drag-and-drop, touch doesn't
    return '<div class="acct-bar"><button data-acct="back">‹</button><h2>Your profile</h2></div>'
      + '<div class="acct-body">'
      + '<div class="pf-photo">'
      +   '<div class="pf-av'+(f.photo?' has-photo':'')+'" id="pfAv" style="'+f.style+'">'+(f.photo?'<img class="av-img" src="'+f.photo+'" alt="">':esc(f.label))+'</div>'
      +   '<div class="pf-nm">'+esc(ME.name)+'</div>'
      +   '<div class="pf-sub">Your photo shows on every device you watch on — including the TV.</div>'
      +   '<div class="pf-btns">'
      +     '<button class="pf-btn primary" data-acct="choose">⬆ Choose a photo</button>'
      +     '<button class="pf-btn" data-acct="camera">◎ Take a photo</button>'
      +     (f.photo ? '<button class="pf-btn danger" data-acct="remove">✕ Remove photo</button>' : '')
      +   '</div>'
      +   (fine ? '<div class="pf-drop">or drop an image on the circle above</div>' : '')
      + '</div>'
      + noteHTML()
      + '<input type="file" accept="image/*" id="pfFile" hidden>'
      + '<input type="file" accept="image/*" capture="user" id="pfCam" hidden>'
      + '</div>';
  }
  function settingsHTML(){
    const f = faceOf();
    return '<div class="acct-bar"><button data-acct="back">‹</button><h2>Settings</h2></div>'
      + '<div class="acct-body">'
      + '<div class="acct-sec">Account</div>'
      + '<button class="acct-row" data-acct="profile"><span class="ph-av'+(f.photo?' has-photo':'')+'" style="'+f.style+';width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:\'Space Grotesk\',sans-serif;font-weight:700;font-size:13px;color:'+(f.photo?'transparent':'#fff')+';flex:none;overflow:hidden;">'+(f.photo?'<img class="av-img" src="'+f.photo+'" alt="">':esc(f.label))+'</span><span><b>'+esc(ME.name)+'</b><div class="rsub">Your photo</div></span><span class="chev">›</span></button>'
      + '<div style="height:10px"></div>'
      + '<button class="acct-row" data-acct="password"><span style="width:22px;text-align:center">🔑</span><span>Change password<div class="rsub">Used when you sign in</div></span><span class="chev">›</span></button>'
      + noteHTML()
      + '</div>';
  }
  function passwordHTML(err){
    return '<div class="acct-bar"><button data-acct="back-settings">‹</button><h2>Change password</h2></div>'
      + '<div class="acct-body">'
      + '<div class="pf-sub" style="max-width:none;margin:0 0 18px;text-align:left;">You’ll need the new one the next time you sign in on any device.</div>'
      + '<div class="fld"><label>Current password</label><input type="password" id="pwCur" autocomplete="current-password"></div>'
      + '<div class="fld"><label>New password</label><input type="password" id="pwNew" autocomplete="new-password"></div>'
      + '<div class="fld"><label>Repeat new password</label><input type="password" id="pwRep" autocomplete="new-password"></div>'
      + (err ? '<div class="pf-note bad">⚠ <span>'+esc(err)+'</span></div>' : '')
      + '<div class="pf-btns"><button class="pf-btn primary" data-acct="pwsave">Save password</button></div>'
      + '</div>';
  }

  function readPhoto(input){
    const file = input && input.files && input.files[0]; if(!file) return;
    const fr = new FileReader();
    fr.onload = ()=>{ if(AV.setPhoto) AV.setPhoto(ME.id, fr.result); acctNote={kind:'ok',text:'Photo updated.'}; acctInner.innerHTML = profileHTML(); paintAvatars(); };
    fr.readAsDataURL(file);
  }
  document.getElementById('avatarBtn').addEventListener('click', ()=>openSheet(true));
  pmScrim.addEventListener('click', ()=>openSheet(false));
  pmSheet.addEventListener('click', e=>{
    const b = e.target.closest('[data-pm]'); if(!b) return;
    const a = b.dataset.pm; openSheet(false);
    if(a==='profile') openAcct(profileHTML());
    else if(a==='settings') openAcct(settingsHTML());
    else if(a==='mylist'){ tab='top10'; render(); }
  });
  acct.addEventListener('click', e=>{
    const b = e.target.closest('[data-acct]'); if(!b) return;
    const a = b.dataset.acct;
    if(a==='back') closeAcct();
    else if(a==='back-settings') openAcct(settingsHTML());
    else if(a==='profile') openAcct(profileHTML());
    else if(a==='password') openAcct(passwordHTML(null));
    else if(a==='choose') document.getElementById('pfFile').click();
    else if(a==='camera') document.getElementById('pfCam').click();
    else if(a==='remove'){ if(AV.clearPhoto) AV.clearPhoto(ME.id); acctNote={kind:'ok',text:'Photo removed — back to your initials.'}; acctInner.innerHTML = profileHTML(); paintAvatars(); }
    else if(a==='pwsave'){
      const cur=document.getElementById('pwCur').value, nw=document.getElementById('pwNew').value, rp=document.getElementById('pwRep').value;
      if(!cur){ acctInner.innerHTML = passwordHTML('Enter your current password.'); return; }
      if(nw.length<6){ acctInner.innerHTML = passwordHTML('Use at least 6 characters.'); return; }
      if(nw!==rp){ acctInner.innerHTML = passwordHTML('The two new passwords don’t match.'); return; }
      if(cur==='wrong'){ acctInner.innerHTML = passwordHTML('That current password isn’t right.'); return; }
      acctNote={kind:'ok',text:'Password changed.'}; acctInner.innerHTML = settingsHTML();
    }
  });
  acct.addEventListener('change', e=>{ if(e.target.id==='pfFile'||e.target.id==='pfCam') readPhoto(e.target); });
  acct.addEventListener('dragover', e=>{ const av=e.target.closest('#pfAv'); if(av){ e.preventDefault(); av.classList.add('drop'); } });
  acct.addEventListener('dragleave', e=>{ const av=e.target.closest('#pfAv'); if(av) av.classList.remove('drop'); });
  acct.addEventListener('drop', e=>{
    const av=e.target.closest('#pfAv'); if(!av) return;
    e.preventDefault(); av.classList.remove('drop');
    const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(!file || !/^image\//.test(file.type)) return;
    const fr = new FileReader();
    fr.onload = ()=>{ if(AV.setPhoto) AV.setPhoto(ME.id, fr.result); acctNote={kind:'ok',text:'Photo updated.'}; acctInner.innerHTML = profileHTML(); paintAvatars(); };
    fr.readAsDataURL(file);
  });
  paintAvatars();

  render();
})();
</script>
</body>
</html>
