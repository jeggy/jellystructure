<!doctype html>
<html lang="en" data-skin="aurora">
<head>
<meta charset="utf-8">
<title>Ravilo — the receiver (what the TV shows while being cast to)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Ravilo Receiver — built 2026-09-16 from the round-1 picks.
   The Chromecast's own screen. It is a Ravilo DEVICE, not a screen the
   phone draws: it holds its own device token, runs its own heartbeats,
   advances to the next episode and honours Skip Intro by itself. So the
   phone can die and this keeps playing.

   Nothing here is interactive. There is no remote pointed at it, so every
   screen is one overlay or one sentence. Runs at 1080p on anything from a
   2013 stick upward, so: no heavy effects, no artwork on idle, no fonts
   beyond the three the app already loads.

   The STATE picker at the foot is mockup-only preview chrome — the same
   class of thing as the TV mockup's SKIN and FOCUS pickers. ?state= works
   too, e.g. ?state=buffering&skin=noir.
   ============================================================ */
[data-skin="aurora"]{--bg:#0a0c13;--ink:#f3f4fb;--ink-soft:#aeb4cb;--ink-dim:#6b7290;--line:rgba(255,255,255,.09);--card:#161a28;--accent:#7b6ef0;--accent-2:#3fb6f5;--grad:linear-gradient(120deg,#7b6ef0,#3fb6f5);--ease:cubic-bezier(.22,.61,.36,1)}
[data-skin="midnight"]{--bg:#04101a;--ink:#eafcff;--ink-soft:#9fc2cf;--ink-dim:#5a7d8a;--line:rgba(160,230,255,.10);--card:#0a1c28;--accent:#19d6c6;--accent-2:#2a8cf0;--grad:linear-gradient(120deg,#19d6c6,#2a8cf0);--ease:cubic-bezier(.22,.61,.36,1)}
[data-skin="noir"]{--bg:#080807;--ink:#f7f3ea;--ink-soft:#c7bfae;--ink-dim:#807868;--line:rgba(255,240,210,.10);--card:#16140f;--accent:#f5b542;--accent-2:#e0792f;--grad:linear-gradient(120deg,#f5b542,#e0792f);--ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05060a;font-family:'Sora',sans-serif;overflow:hidden}
#fit{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding-bottom:180px}
.tv{width:1920px;height:1080px;position:relative;background:#000;color:var(--ink);overflow:hidden;border-radius:6px;
  box-shadow:0 0 0 10px #15171d,0 0 0 12px #2a2d36,0 40px 120px rgba(0,0,0,.75);flex:none}
.vid{position:absolute;inset:0}
.vid img{width:100%;height:100%;object-fit:cover;display:block}
.dim{position:absolute;inset:0;background:rgba(4,5,9,.34)}

/* idle / ended — the lit mark and one sentence, nothing else */
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
.mark{width:180px;height:180px;filter:drop-shadow(0 0 44px rgba(123,110,240,.55))}
[data-skin="noir"] .mark{filter:drop-shadow(0 0 44px rgba(245,181,66,.5))}
.rd{font-size:32px;color:var(--ink-soft)}

/* loading — R218 direction B, verbatim */
.pulse{display:flex;gap:20px;align-items:center}
.pulse i{width:22px;height:22px;border-radius:50%;background:var(--accent);opacity:.25;animation:pl 1.4s var(--ease) infinite}
.pulse i:nth-child(2){background:#5f92f3;animation-delay:.18s}
.pulse i:nth-child(3){background:var(--accent-2);animation-delay:.36s}
@keyframes pl{0%,100%{opacity:.2;transform:scale(.8)}45%{opacity:1;transform:scale(1.25)}}
.ctx{text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.ctx .k{font-size:26px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-2)}
[data-skin="noir"] .ctx .k{color:var(--ink-soft)}
.ctx .t{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:66px;letter-spacing:-1.6px;line-height:1}
.ctx .s{font-size:30px;color:var(--ink-soft)}
.sweep{position:relative;width:560px;height:5px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.sweep span{position:absolute;top:0;bottom:0;width:38%;border-radius:4px;background:var(--grad);animation:sw 1.9s var(--ease) infinite}
@keyframes sw{0%{left:-40%}100%{left:102%}}
.blab{font-size:30px;font-weight:600;color:var(--ink-soft)}
.spin{width:80px;height:80px;border-radius:50%;border:6px solid rgba(255,255,255,.18);border-top-color:#fff;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* the pause / seek overlay — ~3s, then gone */
.ov{position:absolute;left:0;right:0;bottom:0;padding:0 96px 78px;background:linear-gradient(0deg,rgba(0,0,0,.9) 8%,rgba(0,0,0,.4) 48%,transparent)}
.ov .k{font-size:26px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-2)}
[data-skin="noir"] .ov .k{color:var(--ink-soft)}
.ov h3{margin:10px 0 0;font-family:'Space Grotesk',sans-serif;font-size:62px;font-weight:700;letter-spacing:-1.6px}
.ov .bar{position:relative;height:7px;border-radius:6px;background:rgba(255,255,255,.2);margin:36px 0 16px}
.ov .bar i{position:absolute;left:0;top:0;bottom:0;width:41%;border-radius:6px;background:var(--grad);display:block}
.ov .bar u{position:absolute;left:41%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fff}
.ov .tm{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:26px;color:var(--ink-soft)}
.ov .pz{position:absolute;right:96px;bottom:78px;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center}
.ov .pz svg{width:40px;height:40px;fill:#fff}

/* captions — the TV's own style (R110): white, black outline, size from the phone */
.sub{position:absolute;left:0;right:0;bottom:104px;text-align:center;font-weight:500;color:#fff;
  text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 0 14px rgba(0,0,0,.8)}
.sub.s{font-size:38px}.sub.m{font-size:48px}.sub.l{font-size:60px}

/* next-up — the receiver runs this countdown itself; the phone mirrors it */
.nup{position:absolute;right:96px;bottom:96px;width:720px;border-radius:20px;overflow:hidden;background:rgba(10,12,19,.92);border:1px solid var(--line)}
.nup .th{height:240px}
.nup .th img{width:100%;height:100%;object-fit:cover;display:block}
.nup .bd{padding:28px 32px 32px}
.nup .k{font-size:24px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-2)}
[data-skin="noir"] .nup .k{color:var(--ink-soft)}
.nup h4{margin:10px 0 0;font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:700;letter-spacing:-.8px}
.nup .cd{margin-top:14px;font-size:26px;color:var(--ink-soft)}

/* one plain sentence per failure. No code, no product, nothing to press —
   there is no remote pointed at this screen. (R237 / phase 182) */
.msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:0 240px;background:rgba(4,5,9,.92)}
.msg h3{margin:0;font-family:'Space Grotesk',sans-serif;font-size:56px;font-weight:700;letter-spacing:-1.4px;line-height:1.1}
.msg p{margin:0;font-size:30px;line-height:1.45;color:var(--ink-soft);max-width:1100px;text-wrap:pretty}
.msg .el{font-family:'JetBrains Mono',monospace;font-size:24px;color:var(--ink-dim)}

/* ---- preview chrome (NOT part of the receiver) ---- */
.label{position:absolute;bottom:-34px;left:0;right:0;text-align:center;color:#54596b;font-size:13px;font-family:'Space Grotesk',sans-serif;letter-spacing:.05em}
.pick{position:fixed;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:16px;z-index:200;flex-wrap:wrap;padding:0 20px}
.grp{display:flex;gap:5px;padding:5px;border-radius:13px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10)}
.grp b{align-self:center;font-size:10px;letter-spacing:1.4px;color:#6b7290;padding:0 8px;font-weight:700;font-family:'Space Grotesk',sans-serif}
.grp button{border:0;background:transparent;color:#aeb4cb;font-family:'Sora',sans-serif;font-size:12px;font-weight:600;padding:7px 13px;border-radius:9px;cursor:pointer}
.grp button:hover{color:#fff}
.grp button.on{background:#f3f4fb;color:#11131c}
</style>
</head>
<body>
<div id="fit">
  <div class="tv" id="tv"></div>
  <div class="label" id="lab">Ravilo receiver · 1920 × 1080 · Chromecast</div>
</div>

<div class="pick">
  <div class="grp" id="statePick">
    <b>STATE</b>
    <button class="on" data-s="idle">Idle</button>
    <button data-s="loading">Loading</button>
    <button data-s="playing">Playing</button>
    <button data-s="paused">Paused</button>
    <button data-s="buffering">Buffering</button>
    <button data-s="subs">Subtitles</button>
    <button data-s="nextup">Next-up</button>
    <button data-s="noserver">No server</button>
    <button data-s="busy">Busy</button>
    <button data-s="ended">Ended</button>
  </div>
  <div class="grp" id="skinPick"><b>SKIN</b><button class="on" data-k="aurora">Aurora</button><button data-k="midnight">Midnight</button><button data-k="noir">Noir</button></div>
  <div class="grp" id="langPick"><b>LANG</b><button class="on" data-l="en">EN</button><button data-l="da">DA</button><button data-l="fo">FO</button></div>
  <div class="grp" id="sizePick"><b>CAPTIONS</b><button data-z="s">S</button><button class="on" data-z="m">M</button><button data-z="l">L</button></div>
</div>

<script>
(function(){
  /* Every string the receiver can show, en · da · fo. These are the fourteen
     cast strings from "Casting - Directions.html"; where a string already
     exists in ravilo-i18n.js (Loading…, phase 182's busy line) the app's own
     wording wins and this table follows it. */
  const T = {
    ready:      { en:'Ready to play from your phone', da:'Klar til at spille fra din telefon', fo:'Klár at spæla frá telefonini' },
    loading:    { en:'Loading…', da:'Indlæser…', fo:'Ledur inn…' },
    noserver:   { en:"Can't reach your Ravilo server", da:'Kan ikke nå din Ravilo-server', fo:'Kann ikki ná Ravilo-servaranum' },
    noserver_s: { en:'Check that the server is on and try again from your phone.', da:'Tjek at serveren er tændt, og prøv igen fra din telefon.', fo:'Kanna um servarin er á, og royn aftur frá telefonini.' },
    busy:       { en:'The server is busy right now', da:'Serveren er travl lige nu', fo:'Servarin hevur mikið at gera nú' },
    busy_s:     { en:'It will start as soon as it can.', da:'Den starter, så snart den kan.', fo:'Hon byrjar, so skjótt sum gjørligt.' },
    waiting:    { en:'waiting {n} s', da:'venter {n} s', fo:'bíðar {n} s' },
    nextep:     { en:'Next episode', da:'Næste afsnit', fo:'Næsta rað' },
    startsin:   { en:'Starts in {n} s', da:'Starter om {n} s', fo:'Byrjar um {n} s' },
    season:     { en:'Season {s} · Episode {e}', da:'Sæson {s} · Afsnit {e}', fo:'Skeið {s} · Rað {e}' }
  };
  const CAPTION = { en:'I don’t know what you mean.', da:'Jeg ved ikke, hvad du mener.', fo:'Eg veit ikki hvat tú meinar.' };
  const MARK = 'assets/brand/ravilo-mark.svg';
  const STILL = 'assets/bbb-backdrop-rodents.png';
  const NEXT_STILL = 'assets/bbb-backdrop-bunny.png';

  const qs = new URLSearchParams(location.search);
  let state = qs.get('state') || 'idle';
  let lang  = qs.get('lang')  || 'en';
  let skin  = qs.get('skin')  || 'aurora';
  let size  = qs.get('size')  || 'm';

  const tv = document.getElementById('tv');
  const t = (k, vars) => { let s = (T[k] || {})[lang] || (T[k] || {}).en || k;
    if(vars) Object.keys(vars).forEach(v => { s = s.split('{' + v + '}').join(vars[v]); }); return s; };
  const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  const ITEM = { kick:'Offboarding', title:'Threshold Night', season:2, ep:7, pos:'00:15:41', left:'−00:22:22' };
  const NEXT = { title:'Bitter Honey', ep:8 };

  function idle(){
    return '<div class="mid"><img class="mark" src="' + MARK + '" alt=""><div class="rd">' + esc(t('ready')) + '</div></div>';
  }
  function loading(){
    return '<div class="mid" style="gap:44px">'
      + '<div class="pulse"><i></i><i></i><i></i></div>'
      + '<div class="ctx"><div class="k">' + esc(ITEM.kick) + '</div><div class="t">' + esc(ITEM.title) + '</div>'
      + '<div class="s">' + esc(t('season', {s:ITEM.season, e:ITEM.ep})) + '</div></div>'
      + '<div class="sweep"><span></span></div>'
      + '<div class="blab">' + esc(t('loading')) + '</div></div>';
  }
  const pic = () => '<div class="vid"><img src="' + STILL + '" alt=""></div>';
  function overlay(glyph){
    const pz = glyph === 'pause'
      ? '<div class="pz"><svg viewBox="0 0 24 24"><rect x="7" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.4" y="5" width="3.6" height="14" rx="1.2"/></svg></div>'
      : '<div class="pz" style="background:none;border:0"><div class="spin"></div></div>';
    return '<div class="ov"><div class="k">' + esc(ITEM.kick) + ' · S' + ITEM.season + ' E' + ITEM.ep + '</div>'
      + '<h3>' + esc(ITEM.title) + '</h3>'
      + '<div class="bar"><i></i><u></u></div>'
      + '<div class="tm"><span>' + ITEM.pos + '</span><span>' + ITEM.left + '</span></div>' + pz + '</div>';
  }
  function msg(h, p, el){
    return '<div class="msg"><h3>' + esc(h) + '</h3><p>' + esc(p) + '</p>' + (el ? '<div class="el">' + esc(el) + '</div>' : '') + '</div>';
  }
  const VIEWS = {
    idle:      () => idle(),
    loading:   () => loading(),
    playing:   () => pic(),
    paused:    () => pic() + overlay('pause'),
    buffering: () => pic() + '<div class="dim"></div>' + overlay('spin'),
    subs:      () => pic() + '<div class="sub ' + size + '">' + esc(CAPTION[lang] || CAPTION.en) + '</div>',
    nextup:    () => pic() + '<div class="dim"></div>'
                   + '<div class="nup"><div class="th"><img src="' + NEXT_STILL + '" alt=""></div>'
                   + '<div class="bd"><div class="k">' + esc(t('nextep')) + '</div><h4>' + esc(NEXT.title) + '</h4>'
                   + '<div class="cd">' + esc(t('startsin', {n:8})) + ' · S' + ITEM.season + ' E' + NEXT.ep + '</div></div></div>',
    noserver:  () => msg(t('noserver'), t('noserver_s')),
    busy:      () => '<div class="msg"><div class="pulse"><i></i><i></i><i></i></div>'
                   + '<h3>' + esc(t('busy')) + '</h3><p>' + esc(t('busy_s')) + '</p>'
                   + '<div class="el">' + esc(t('waiting', {n:24})) + '</div></div>',
    /* "Ended" is not a screen of its own: the receiver goes straight back to
       idle. Drawn as the same view so the decision is visible rather than
       implied — there is no "thanks for watching" state to build. */
    ended:     () => idle()
  };
  const CAPTION_STATES = { subs:1 };
  const NAME = { idle:'idle / just launched', loading:'loading — R218 moment B', playing:'playing — video only',
    paused:'paused or seeked — overlay for ~3 s', buffering:'buffering — R218 moment C', subs:'captions — R110 style, size from the phone',
    nextup:'next-up — the receiver’s own countdown', noserver:'can’t reach the server', busy:'server busy — phase 182’s 503',
    ended:'ended — straight back to idle' };

  function render(){
    document.documentElement.setAttribute('data-skin', skin);
    tv.innerHTML = (VIEWS[state] || VIEWS.idle)();
    document.getElementById('lab').textContent = 'Ravilo receiver · 1920 × 1080 · ' + NAME[state];
    document.querySelectorAll('#statePick button').forEach(b => b.classList.toggle('on', b.dataset.s === state));
    document.querySelectorAll('#skinPick button').forEach(b => b.classList.toggle('on', b.dataset.k === skin));
    document.querySelectorAll('#langPick button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
    document.querySelectorAll('#sizePick button').forEach(b => b.classList.toggle('on', b.dataset.z === size));
    document.getElementById('sizePick').style.opacity = CAPTION_STATES[state] ? '1' : '.45';
    fit();
  }
  function fit(){
    const s = Math.min(window.innerWidth / 1980, (window.innerHeight - 210) / 1140, 1);
    document.querySelector('.tv').style.transform = 'scale(' + s + ')';
    document.getElementById('lab').style.transform = 'scale(' + s + ')';
  }
  document.getElementById('statePick').addEventListener('click', e => { const b = e.target.closest('button[data-s]'); if(b){ state = b.dataset.s; render(); } });
  document.getElementById('skinPick').addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if(b){ skin = b.dataset.k; render(); } });
  document.getElementById('langPick').addEventListener('click', e => { const b = e.target.closest('button[data-l]'); if(b){ lang = b.dataset.l; render(); } });
  document.getElementById('sizePick').addEventListener('click', e => { const b = e.target.closest('button[data-z]'); if(b){ size = b.dataset.z; state = 'subs'; render(); } });
  window.addEventListener('resize', fit);
  render();
})();
</script>
</body>
</html>
