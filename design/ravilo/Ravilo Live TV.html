<!DOCTYPE html>
<html lang="en" data-skin="aurora">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ravilo — Live TV</title>
<link rel="stylesheet" href="ravilo.css">
<link rel="stylesheet" href="livetv.css">
<link rel="stylesheet" href="../flags.css">
<style>
  body { margin: 0; background: #000; }
  #root { position: fixed; inset: 0; }
  .lt-help { position: fixed; z-index: 200; right: 22px; bottom: 22px; display: flex; align-items: center; gap: 12px;
    padding: 9px 15px; border-radius: 12px; background: rgba(12,14,22,.92); backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.12); font-family: 'Sora', sans-serif; font-size: 13px; color: #b9c0d6; pointer-events: none; }
  .lt-help kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; padding: 0 6px;
    border-radius: 6px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); font-family: 'JetBrains Mono', monospace; color: #fff; }
  .lt-help .sep { opacity: .35; }
</style>
</head>
<body>
<div id="root"></div>
<div class="lt-help">
  <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> move <span class="sep">·</span>
  <kbd>↵</kbd> select <span class="sep">·</span> <kbd>0–9</kbd> channel <span class="sep">·</span> <kbd>esc</kbd> back
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="livetv-data.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="livetv-app.jsx"></script>
</body>
</html>
