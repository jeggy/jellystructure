<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ravilo — Visual Directions</title>
<style>
  html, body { margin: 0; background: #ece9e3; }
  .ifr { width: 1920px; height: 1080px; border: 0; display: block; background: #000; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

function Skin({ skin }) {
  return <iframe className="ifr" src={"Ravilo TV.html?skin=" + skin + "&chrome=0&static=1"} title={skin} scrolling="no"></iframe>;
}

function App() {
  return (
    <DesignCanvas>
      <DCSection id="dirs"
        title="Ravilo — Visual Directions"
        subtitle="Same TV home screen, three skins. Aurora shares Jellystructure's DNA; Midnight goes cooler & cinematic; Noir is high-contrast editorial gold. Open any board fullscreen to inspect. The live app (Ravilo TV.html) switches between these instantly.">
        <DCArtboard id="aurora" label="Aurora · Jellystructure DNA (purple→blue)" width={1920} height={1080}>
          <Skin skin="aurora" />
        </DCArtboard>
        <DCArtboard id="midnight" label="Midnight · cool teal→blue, cinematic" width={1920} height={1080}>
          <Skin skin="midnight" />
        </DCArtboard>
        <DCArtboard id="noir" label="Noir · near-black, gold accent, squared" width={1920} height={1080}>
          <Skin skin="noir" />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
