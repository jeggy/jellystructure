<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One remote — frames</title>
<!--
  frames.html — every frame this round renders, built from or-data.js through or-kit.js.

  One document, parameterised, rather than one document per picture:
      ?set=phone-a | phone-b | music | states | bars | web | mac
      &skin=aurora|midnight|noir|daylight
      &lang=en|da|fo

  Rev 2 adds the `music` set, and it is a set of its own for one concrete reason: it is the only
  set that links the shipped `ravilo-music.css`, and that file REDEFINES the midnight and noir
  skin tokens (noir's accent becomes amber there and stays blue in ravilo-phone.css). Loading it
  into `phone-a` would silently change `noir-a-cast-film`, which the owner has already accepted.

  The set decides which SHIPPED stylesheet is loaded, because the phone and the TV/desktop are
  different token files and loading both into one document would let one answer for the other.
  The round's own stylesheet always comes last, so it extends the shipped system and never
  precedes it.

  Opened by hand in a browser this page works exactly as the renderer sees it; scripts/render-design.sh
  just drives it over the parameter combinations and screenshots one element per frame.
-->
<script>
  (function () {
    const q = new URLSearchParams(location.search);
    const set = q.get('set') || 'phone-a';
    const skin = q.get('skin') || 'aurora';
    const lang = q.get('lang') || 'en';
    document.documentElement.dataset.skin = skin;
    document.documentElement.lang = lang;
    /* The phone token file covers the phone AND the web frames — the web player is the phone's
       design system at a desk width, which is what makes the 390 px frame the same screen. The
       Mac loads the desktop file beside it for the window chrome's own tokens. */
    document.write('<link rel="stylesheet" href="../../ravilo/mobile/ravilo-phone.css">');
    /* Music mode's own shipped stylesheet — the Playing page, the mini bar and the speaker rows
       live in it. Only the sets that draw a music surface load it, see the note above. */
    /* Both sets that draw a SONG load it, and only those two. The music set needs `bnav` and
       `mu-mini`, which are shipped components; the states set needs `.rv-vb` / `.rv-v`, R344's
       version chips, because two of its seven states are a song — without it the first rev-3
       render of `a-st-moving` drew *Remaster* and *Live* as two unstyled words. The file re-skins
       noir and midnight, which is why it is not loaded everywhere; neither of these two sets is
       ever rendered in either skin, so the re-skin cannot reach a picture. */
    if (set === 'music' || set === 'states')
      document.write('<link rel="stylesheet" href="../../ravilo/mobile/ravilo-music.css">');
    /* Ravilo Web at a desk width IS the desktop layout, so the web set loads the desktop file
       too — the version chips (`.rv-v`) and `.lyr` live in it, and without it the 1440 music
       frame drew "RemasterLive" as two unstyled words. */
    if (set === 'mac' || set === 'web')
      document.write('<link rel="stylesheet" href="../../ravilo/desktop/ravilo-desktop.css">');
    document.write('<link rel="stylesheet" href="../../flags.css">');
    document.write('<link rel="stylesheet" href="one-remote.css">');
    window.OROPT = { set, skin, lang };
  })();
</script>
</head>
<body>
<div class="or-frames" id="frames"></div>

<script src="or-data.js"></script>
<script src="or-kit.js"></script>
<script>
(function () {
  'use strict';
  const { set, lang } = window.OROPT;
  const K = window.ORKit, D = window.OR;
  K.setLang(lang);
  const root = document.getElementById('frames');

  const STATUS = '<div class="or-sb"><span>21:04</span><span>▮▮▮</span></div>';

  function frame(id, cls, html) {
    const d = document.createElement('div');
    /* `or-frame` is the renderer's handle and carries no style: --all targets it so that a
       phone nested INSIDE a pair frame is never mistaken for a frame of its own. */
    d.id = id; d.className = 'or-frame ' + cls; d.innerHTML = html;
    root.appendChild(d);
    return d;
  }
  /* A phone frame: the 412×915 screen with the status bar and whatever the body is. */
  const phBody = html => STATUS + html;
  const ph = (id, html, extra) => frame(id, 'or-ph' + (extra ? ' ' + extra : ''), phBody(html));

  const P = K.P;
  const FILM = D.FILM, EP = D.EP, EP4 = D.EP4, SONG = D.SONG, BOOK = D.BOOK;
  const ROOMVOLS = { master: D.VOL.master, stue: D.VOL.stue, gaeste: D.VOL.gaeste };
  /* `cfg` with one field changed, written once so a variant frame is visibly the SAME call.
     Object.assign rather than a spread, to match the rest of the round's ES5 register. */
  const w = (base, extra) => Object.assign({}, base, extra);

  /* ---------------------------------------------------------------------------------------
     PHONE — direction A. The lean, in full.
     --------------------------------------------------------------------------------------- */
  if (set === 'phone-a') {
    /* A1 · the film cast from this phone to Stue TV.
       A2 · the SAME film started from the MacBook on Soveværelse TV, opened here from
       "Playing everywhere". Same builder, same options, one different place — which is the
       round's whole argument, made in the source and not only in the caption. */
    const a1 = { item: FILM, set: P.stuetv, state: 'playing', vols: { master: D.VOL.master } };
    const a2 = { item: FILM, set: P.sovetv, state: 'playing', vols: { master: D.VOL.master } };
    ph('a-cast-film', K.remote(a1));
    ph('a-elsewhere-film', K.remote(a2));

    /* The two side by side, because "the same screen" is a claim a pair settles and a single
       frame cannot. */
    frame('a-identity-pair', 'or-pair',
      '<div class="or-ph">' + phBody(K.remote(a1)) + '</div>'
      + '<div class="rule"></div>'
      + '<div class="or-ph">' + phBody(K.remote(a2)) + '</div>');

    /* A3 · the tracks sheet, over the remote it was opened from, applying on Soveværelse TV. */
    ph('a-tracks-sheet', K.remote(a2) + K.tracksSheet(FILM, P.sovetv));

    /* A4 · the episode with the place's own next-up countdown mirrored. */
    ph('a-nextup', K.remote({ item: EP, set: P.stuetv, state: 'nextup', vols: { master: D.VOL.master } }));

    /* A5 · decision 1's ALTERNATIVE: the same cast, with no volume row at all. The shipped reason
       for no slider is still true — volume belongs to the TV, and a slider invites a fight with
       the TV's own remote — so the owner should see both and not only the lean. The phone's
       hardware keys stay the control, and raise the transient pill. */
    ph('a-cast-film-no-slider', K.remote({
      item: FILM, set: P.stuetv, state: 'playing', noVol: true, hwVol: D.VOL.master,
    }));

    /* The music frames moved to the `music` set in rev 2: they are drawn on the SHIPPED Playing
       page now, which needs ravilo-music.css, which this set must not load. */

    /* A6 · Move to…, opened from the place line, with Play here in it. */
    ph('a-move-to', K.remote(a1) + K.moveSheet(P.stuetv, FILM));

    /* A7 · Olivar's playback, view-only: the SAME remote with the transport absent. */
    ph('a-someone-else', K.remote({
      item: EP4, set: P.sovetv, state: 'other', who: D.OTHER.name,
    }));

    /* A8 · Stop on someone else's, with the one inline confirm — drawn as if the household
       switch were on, so the control exists to be confirmed. */
    ph('a-stop-confirm', K.remote({
      item: EP4, set: P.sovetv, state: 'playing', who: D.OTHER.name,
      vols: { master: D.VOL.master }, confirm: true, canStopOther: true,
    }));

    /* The wordmark fallback: no artwork, no redraw. */
    ph('a-wordmark', K.remote({ item: FILM, set: P.stuetv, state: 'playing', wordmark: true,
      vols: { master: D.VOL.master } }));

    /* ---- REV 3 · DECISION 9: the slider's two outcomes, on the film remote -------------------
       The owner asked for exactly these two and nothing between them. The drag was 2 % → 15 %.

       (a) released, Stue TV has not confirmed yet. The thumb is at 15 and there is NO mark: the
           viewer just moved it and nothing has gone wrong. A spinner or a ghost thumb would warn
           about the 95 % of drags that work.
       (b) Stue TV never took it. The thumb has gone back to the 2 % the TV is actually at, and one
           line under the slider says so for 3 s — because a thumb that walks back on its own, with
           nothing said, reads as a bug rather than a report. */
    ph('a-vol-pending-film', K.remote({
      item: FILM, set: P.stuetv, state: 'playing', vols: { master: D.VOL.dragged } }));
    ph('a-vol-reverted-film', K.remote({
      item: FILM, set: P.stuetv, state: 'playing', vols: { master: D.VOL.low },
      volNote: { master: K.t('vol_kept', { place: P.stuetv.line, n: D.VOL.low }) } }));

    /* ---- REV 3 · the brief's frame 10: a place that cannot report its volume ------------------
       Soveværelse TV with its sound going to a soundbar. The slider reads *—*, cannot be dragged,
       and the SHIPPED reason (`volume.no_report`) is the line under it. This is the one place in
       the remote where a control is drawn and disabled rather than absent, because the place
       EXISTS and simply cannot answer — which is a different fact from "this cannot be done". */
    ph('a-film-no-report', K.remote({
      item: FILM, set: P.sovetvBar, state: 'playing', vols: { master: D.VOL.master } }));
  }

  /* ---------------------------------------------------------------------------------------
     PHONE — direction B, for the film and music frames only, as the brief asks.
     --------------------------------------------------------------------------------------- */
  if (set === 'phone-b') {
    ph('b-film', K.remoteB({ item: FILM, set: P.stuetv, state: 'playing', vols: { master: D.VOL.master } }));
    ph('b-music', K.remoteB({ item: SONG, set: P.speakers, state: 'playing', vols: ROOMVOLS }));
  }

  /* ---------------------------------------------------------------------------------------
     MUSIC — rev 3. Back in the CAST REMOTE'S SHAPE, with everything today's Playing page does.

     The owner: *"The current cast remote is the nice looking one and todays playing page is a
     bit bad UI, so that one goes. [Its] functionality needs to be there."* So every frame below
     is `K.remote()` — the same builder as the film, the same call, with the kind doing the
     deciding. Rev 2's `musicPlaying` is gone from or-kit.js entirely.

     ONE place-set changes between frames 1 and 2 and nothing else does. That is the round's
     argument for the third time: a cast, a server place, and the phone in your hand are one
     screen because they are one builder call.
     --------------------------------------------------------------------------------------- */
  if (set === 'music') {
    /* Frame 1 — *Cannery Lights* on Stue + Gæsteværelse, from this phone's Playing tab.
       `tab: true` is the brief's frame-5 lean: the remote sits IN the tab with the bar under it
       (FR-R322-2 — a page, no close chevron), and `bnav(2)` lights Playing. */
    const mElse = { item: SONG, set: P.speakers, state: 'playing', tab: true, vols: ROOMVOLS };
    /* Frame 2 — the SAME song on this phone. One field: `here`. The pill reads *This phone* and
       the state line is the one sentence that cannot be "Playing on {place}". */
    const mHere = { item: SONG, set: P.pixelPlace, state: 'playing', tab: true, here: true,
      vols: { master: D.VOL.master } };

    ph('a-music', K.remote(mElse));
    ph('a-music-here', K.remote(mHere));

    /* …and side by side, because "local and remote are one screen" is a claim a single frame
       cannot settle and a pair can. The film's `a-identity-pair` does this for a cast and a
       server place; this one closes the set. */
    frame('a-music-pair', 'or-pair',
      '<div class="or-ph">' + phBody(K.remote(mElse)) + '</div>'
      + '<div class="rule"></div>'
      + '<div class="or-ph">' + phBody(K.remote(mHere)) + '</div>');

    /* Frame 2's sheet: the pill on *This phone* opens the same Move to… the elsewhere pill does,
       with the phone's row ticked and the places as the things to move to. */
    ph('a-music-move-to', K.remote(w(mHere, { moveSheet: true })));

    /* Frame 3 — lyrics on. The head shrinks to a 52 dp cover and the title (FR-R322-7), the
       synced lines fill the space, and the footer's Lyrics is lit. */
    ph('a-music-lyrics', K.remote(w(mElse, { lyricsOn: true })));

    /* Frame 4 — Up next, as a sheet over the remote. Tap jumps, the handles reorder. */
    ph('a-music-upnext', K.remote(w(mElse, { queue: true })));

    /* The swipe, drawn as the mid-gesture frame it is: a still cannot show a gesture, and the
       shipped page has no swipe hint to draw instead. 34 % across, at the alpha `SwipeCover`
       computes, with the next cover underneath. */
    ph('a-music-swipe', K.remote(w(mElse, { swipe: true })));

    /* Frame 5's ALTERNATIVE, so the owner picks rather than being told: the same remote
       full-screen, with the close chevron back and no bar. This is also what the remote already
       is when it is opened over something else — from the mini bar in video mode, or from
       Playing everywhere — so it is a frame the product needs either way. */
    ph('a-music-full', K.remote(w(mElse, { tab: false })));

    /* Frame 6 — nothing playing yet. FR-R322-3: the last-played song, loaded and PAUSED at the
       position it was left at, and it does not start. No state line: nothing is playing anywhere,
       so there is nothing to report about a place. */
    ph('a-music-idle', K.remote({
      item: SONG, set: P.pixelPlace, state: 'idle', tab: true, here: true,
      vols: { master: D.VOL.master } }));

    /* Frame 7 — the audiobook. The same remote, the book's own blocks: the chapter as the title,
       the chapter's seek bar, the whole-book scrubber, *… left*, speed · −30 s · ⏯ · +30 s ·
       sleep, and the chapter strip. */
    ph('a-book', K.remote({ item: BOOK, set: P.speakers, state: 'playing', tab: true, vols: ROOMVOLS }));

    /* Frame 9 on the music rooms block: Stue dragged 2 % → 15 %, released. (a) not confirmed yet —
       the thumb stays at 15 and nothing is marked. (b) Stue never took it — the thumb is back at
       2 and one line under that row says so for 3 s. The master row and Gæsteværelse do not move
       in either: one room's drag is one room's business. */
    ph('a-vol-pending-music', K.remote(w(mElse, {
      vols: { master: D.VOL.master, stue: D.VOL.dragged, gaeste: D.VOL.gaeste } })));
    ph('a-vol-reverted-music', K.remote(w(mElse, {
      vols: { master: D.VOL.master, stue: D.VOL.low, gaeste: D.VOL.gaeste },
      volNote: { stue: K.t('vol_kept', { place: 'Stue', n: D.VOL.low }) } })));

    /* The shipped mini bar in music mode, on a stand-in Listen page, above the music bar.
       RENAMED in rev 3: it was `a-minibar-music`, which is also the id the `bars` set uses for
       round 1's own bar — and `--all` names each PNG after its element id, so one silently
       overwrote the other. Found by reading the renderer, not the picture. */
    ph('a-minibar-music-mode', K.musicHome() + K.musicMini(SONG, P.speakers, { more: 1 }) + K.bnav(0));
  }

  /* ---------------------------------------------------------------------------------------
     THE STATES, as a strip and one by one.
     --------------------------------------------------------------------------------------- */
  const STATES = [
    ['a-st-buffering', 'buffering on the place',
      { item: FILM, set: P.stuetv, state: 'buffering', vols: { master: D.VOL.master } }],
    ['a-st-moving', 'moving to Kontor…',
      { item: SONG, set: P.speakers, state: 'moving', toPlace: D.PLACES.kontor.name, vols: ROOMVOLS }],
    ['a-st-move-failed', 'couldn’t move',
      { item: SONG, set: P.speakers, state: 'movefail', toPlace: D.PLACES.kontor.name, vols: ROOMVOLS }],
    ['a-st-lost', 'lost contact · Try again',
      { item: FILM, set: P.stuetv, state: 'lost', vols: { master: D.VOL.master } }],
    ['a-st-offline', 'place offline · paused at 48:10',
      { item: FILM, set: P.sovetv, state: 'offline', vols: { master: D.VOL.master } }],
    ['a-st-stopped', 'stopped by Olivar',
      { item: EP4, set: P.sovetv, state: 'stopped', who: D.OTHER.name }],
    ['a-st-ended', 'ended',
      { item: FILM, set: P.stuetv, state: 'ended' }],
  ];
  /* Rev 3: ONE builder again. Rev 2 had to pick a builder by kind, because music was on a second
     screen; it is not any more, so the fork is gone and `a-st-moving` and `a-st-move-failed` are
     round 1's drawings with rev 3's music blocks in them — which is what makes the strip a
     comparison of seven STATES rather than of two screens. */
  if (set === 'states') {
    STATES.forEach(s => ph(s[0], K.remote(s[2])));
    frame('a-states-strip', 'or-strip', STATES.map(s =>
      '<div class="or-cell"><div class="or-scap">' + K.esc(s[1]) + '</div>'
      + '<div class="or-ph">' + phBody(K.remote(s[2])) + '</div></div>').join(''));
  }

  /* ---------------------------------------------------------------------------------------
     THE ONE MINI BAR. Today there are two; these are one component twice.
     --------------------------------------------------------------------------------------- */
  if (set === 'bars') {
    const home = '<div class="or-home">'
      + '<div class="or-hrow"><i></i><i></i><i></i></div>'
      + '<div class="or-hh">Continue watching</div>'
      + '<div class="or-hrow w"><i></i><i></i></div>'
      + '<div class="or-hh">Newly added</div>'
      + '<div class="or-hrow"><i></i><i></i><i></i></div></div>';
    const nav = '<div class="or-nav"><span class="on">Home</span><span>Search</span>'
      + '<span>Discover</span><span>Live</span></div>';
    /* For a cast: Stue TV. The bar does not say "cast" and carries no cast glyph — that is the
       change. +1 because the music on Stue + Gæsteværelse is playing too. */
    ph('a-minibar-cast', home + K.miniBar(FILM, P.stuetv, { more: 1 }) + nav);
    /* For a playback elsewhere: Soveværelse TV. Same component, same chip, different name. */
    ph('a-minibar-elsewhere', home + K.miniBar(FILM, P.sovetv, { more: 1 }) + nav);
    /* And music on two rooms, so the +N chip and the square thumbnail are both in a picture. */
    ph('a-minibar-music', home + K.miniBar(SONG, P.speakers, { more: 2 }) + nav);
  }

  /* ---------------------------------------------------------------------------------------
     WEB. 1440 and 390. NO Chromecast on the web: the places here are Ravilo apps reached
     through the server, so Stue TV never appears in a web frame.
     --------------------------------------------------------------------------------------- */
  if (set === 'web') {
    frame('web-film-1440', 'or-wframe', K.webRemote({
      item: FILM, set: P.sovetv, state: 'playing', vols: { master: D.VOL.master } }));
    /* Rev 2: Ravilo Web at a desk width IS the desktop layout — `MusicPlayingScreen` branches on
       `isDesktopLayout` before it ever reaches the portrait page — so the web's music player is
       the cover beside the lyrics, not a wide phone. Same body as the Mac frame. */
    frame('web-music-1440', 'or-wframe tall', K.webMusic({
      item: SONG, set: P.pixelPlace, state: 'playing', vols: { master: D.VOL.master } }));
    frame('web-film-390', 'or-wframe narrow', K.webRemote({
      item: FILM, set: P.sovetv, state: 'playing', vols: { master: D.VOL.master } }));
  }

  /* ---------------------------------------------------------------------------------------
     MAC. The desktop Playing page as the remote, and the capsule's volume popover.
     --------------------------------------------------------------------------------------- */
  if (set === 'mac') {
    frame('mac-film', 'or-mframe', K.macPlaying({
      item: FILM, set: P.stuetv, state: 'playing', vols: { master: D.VOL.master } }));
    /* Rev 2: the shipped desktop Playing page — the cover beside the lyrics, the transport under
       the cover (`.np` / `.lyr`). The frame is 100 px taller than `mac-film` ON PURPOSE: at 800
       the shipped head is about 12 px taller than the space above the capsule, so the page
       scrolls there and a picture at 800 would slice the transport. Reported, not hidden. */
    frame('mac-music', 'or-mframe tall', K.macMusicPlaying({
      item: SONG, set: P.speakers, state: 'playing', vols: ROOMVOLS }));
    /* The popover is opened from the capsule, which is how you reach volume when you are NOT on
       the Playing page — so it is drawn over Films. On the Playing page the inline block above
       already holds the same sliders, and drawing both open at once put them on screen twice. */
    /* …and it carries Stop, because on the desktop Stop lives in the capsule — one place, every
       page, every kind. See the report's open question about `mac-film`, which still has Stop in
       the Playing page's footer and which this revision does not touch. */
    frame('mac-volume-popover', 'or-mframe', K.macBrowse(SONG, P.speakers,
      { vols: ROOMVOLS, volOpen: true, stopInCap: true }));
  }
  /* ---------------------------------------------------------------------------------------
     After layout, and only then: put the line being sung two fifths of the way down its column.

     `LyricsView` keeps it there by scrolling, and a still frame has no scroller — but it also
     has no way to know how tall a 24 sp line wraps to until the browser has laid it out. The
     first render guessed 45 px a line, the lines wrapped to two, and the sung line fell off the
     bottom of the column: the one frame whose whole subject is the sung line did not show it.
     So it is measured, not guessed. Nothing else in the round reads the DOM back.
     --------------------------------------------------------------------------------------- */
  (function () {
    document.querySelectorAll('.or-lyc').forEach(col => {
      const inner = col.querySelector('.in'), now = col.querySelector('p.now');
      if (!inner || !now) return;
      const target = col.clientHeight * 0.4;
      const top = now.offsetTop + now.offsetHeight / 2 - inner.offsetTop;
      inner.style.marginTop = Math.round(Math.min(0, target - top)) + 'px';
    });
  })();
})();
</script>

<style>
/* Frame furniture that is scaffolding, not design: the phone's status bar and the stand-in home
   screen the mini-bar frames need something to sit on top of. Deliberately shapeless — nothing
   here is a proposal about Home. */
.or-sb { position: absolute; top: 0; left: 0; right: 0; height: 34px; z-index: 40;
  display: flex; align-items: center; justify-content: space-between; padding: 0 24px 0 26px;
  font: 600 12.5px 'Sora', sans-serif; color: var(--ink); }
.or-home { position: absolute; left: 0; right: 0; top: 44px; padding: 0 18px; }
.or-hrow { display: flex; gap: 11px; margin-bottom: 16px; }
.or-hrow i { width: 118px; height: 178px; border-radius: 14px; background: var(--card); flex: none; }
.or-hrow.w i { width: 170px; height: 96px; border-radius: 12px; }
.or-hh { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600; margin-bottom: 12px; }
</style>
</body>
</html>
