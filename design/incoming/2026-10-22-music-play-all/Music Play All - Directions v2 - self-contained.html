.lbl h3{margin:0;font-family:'Space Grotesk',sans-serif;font-size:1.25rem;letter-spacing:-.01em}
.lbl small{display:block;margin-top:9px;font-size:.84rem;line-height:1.68;color:#262a35}
.lbl small b{color:#0b0c11;font-weight:700}
.lbl .tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:#4a3fc4;margin-bottom:7px;font-weight:700}
.lbl .tag.pick{color:#0b7a52}.lbl .tag.no{color:#4a4f5e}.lbl .tag.new{color:#0f6597}
.lbl .cost{display:block;margin-top:12px;padding:10px 12px;border-radius:9px;background:#fff;border:1px solid rgba(0,0,0,.12);font-size:.8rem;line-height:1.6;color:#2b2f3b}
.lbl .cost b{color:#0b0c11}
.cap{position:absolute;font-size:.72rem;font-weight:600;color:#2e323e;font-family:'JetBrains Mono',monospace;letter-spacing:.04em;text-transform:uppercase;line-height:1.35}
.cap i{display:block;font-style:normal;text-transform:none;letter-spacing:0;font-family:'Sora',sans-serif;font-weight:500;font-size:.78rem;color:#262a35;margin-top:3px}
.note{position:absolute;font-size:.8rem;line-height:1.6;color:#262a35}
.note b{color:#0b0c11}
.rule{position:absolute;height:1px;background:rgba(0,0,0,.16)}
.sech{position:absolute;color:#12141b}
.sech .n{font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#4a3fc4}
.sech h2{margin:6px 0 0;font-family:'Space Grotesk',sans-serif;font-size:2.4rem;letter-spacing:-.025em}
.panel{position:absolute;background:#fff;color:#171923;border-radius:18px;padding:30px 34px;box-shadow:0 18px 44px rgba(0,0,0,.18)}
.panel h2{font-family:'Space Grotesk',sans-serif;font-size:1.45rem;margin:0 0 8px;letter-spacing:-.02em}
.panel h4{font-family:'Space Grotesk',sans-serif;font-size:.95rem;margin:20px 0 8px}
.panel p{font-size:.86rem;line-height:1.68;color:#30364a;margin:0 0 10px}
.panel b{color:#171923}
.panel ul{margin:0;padding-left:18px}
.panel li{font-size:.84rem;line-height:1.7;color:#30364a;margin-bottom:6px}
.panel code,.mono{font-family:'JetBrains Mono',monospace;font-size:.8em;background:#f0f1f6;padding:1px 5px;border-radius:4px;color:#171923}
.good{background:#eef7f2;border:1px solid #b9dfcc;border-radius:10px;padding:12px 14px;font-size:.84rem;line-height:1.62;color:#1f4634;margin:12px 0}
.warn{background:#fff8e8;border:1px solid #f2d79a;border-radius:10px;padding:12px 14px;font-size:.84rem;line-height:1.62;color:#4a3c1c;margin:12px 0}
.tbl{width:100%;border-collapse:collapse;margin-top:10px}
.tbl th{text-align:left;font-family:'JetBrains Mono',monospace;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:#4b5165;padding:0 10px 7px 0;font-weight:700;vertical-align:bottom}
.tbl td{font-size:.8rem;line-height:1.5;color:#30364a;padding:8px 10px 8px 0;border-top:1px solid #e3e5ec;vertical-align:top}
.tbl td b{color:#171923}
.tbl td.y{color:#0b6a46;font-weight:600}.tbl td.n{color:#8a2a1c;font-weight:600}.tbl td.m{color:#6a4c08;font-weight:600}
.opt{display:grid;gap:10px;margin-top:10px}
.opt>div{border:1px solid #e3e5ec;border-radius:11px;padding:13px 15px;background:#f8f9fc}
.opt h5{margin:0 0 5px;font-family:'Space Grotesk',sans-serif;font-size:.9rem;color:#171923}
.opt p{font-size:.8rem;line-height:1.6;margin:0 0 4px;color:#3d4357}
.opt .ch{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.opt .ch span{font-size:.72rem;font-weight:600;padding:5px 10px;border-radius:7px;background:#fff;border:1px solid #d9dce6;color:#30364a}
.opt .ch span.lean{background:#eef7f2;border-color:#b9dfcc;color:#1f4634}

/* ---------- a frame on the canvas ---------- */
.fr{position:absolute;overflow:hidden;color:var(--ink);background:var(--bg);font-family:'Sora',sans-serif;box-shadow:0 14px 36px rgba(0,0,0,.28)}
.fr *{box-sizing:border-box}
.solo .fr{box-shadow:none;border-radius:0!important}
.fr svg{display:block}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.f{fill:currentColor;stroke:none}

/* ============ PHONE (360 dp unless stated) ============ */
.mpa-ph{width:360px;height:780px;border-radius:30px}
.mpa-ph.land{width:780px;height:360px;border-radius:26px}
.mpa-ph.cmpw{width:400px;height:720px;border-radius:14px}
.mpa-sb{position:absolute;left:0;right:0;top:0;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 24px;font-size:13px;font-weight:600;z-index:60;background:var(--bg)}
.land .mpa-sb{height:24px;font-size:12px;padding:0 40px}
.mpa-sb .si{display:flex;gap:6px;align-items:center}
.mpa-sb .si i{display:block;width:15px;height:10px;border-radius:2px;background:var(--ink);opacity:.9}
.mpa-sb .si i:first-child{width:12px;clip-path:polygon(100% 0,100% 100%,0 100%)}
.mpa-sb .si i:last-child{width:22px;border-radius:3px}
.mpa-strip{position:absolute;left:0;right:0;top:0;height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--bg-2);border-bottom:1px solid var(--line);z-index:60}
.mpa-strip i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.mpa-strip i:nth-child(2){background:#febc2e}.mpa-strip i:nth-child(3){background:#28c840}
.mpa-strip span{margin-left:auto;font-size:11px;color:var(--ink-dim);font-family:'JetBrains Mono',monospace}
/* the app bar: sticky, so it is drawn as a fixed layer; the page scrolls under it */
.mpa-apb{position:absolute;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:8px 18px 10px;background:var(--bg);z-index:41}
.land .mpa-apb{padding:6px 40px 8px;height:52px}
.mpa-brand{display:flex;align-items:center;gap:8px;flex:none}
.mpa-brand .mark{width:22px;height:22px}
.mpa-brand .wm{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:21px;letter-spacing:-.02em}
.mpa-brand .nt{font-size:15px;font-weight:700;margin-left:-2px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
[data-skin="noir"] .mpa-brand .nt{background:none;color:var(--ink)}
.mpa-apb .sp{flex:1}
.mpa-slot{display:flex;align-items:center;gap:8px;flex:none}
.mpa-sort{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:19px;background:rgba(var(--fg),.09);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.mpa-sort .ic{width:15px;height:15px;stroke-width:2.2}
.mpa-ib{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(var(--fg),.07);color:var(--ink);flex:none}
.mpa-ib .ic{width:19px;height:19px}
.mpa-ib.hot{background:rgba(var(--fg),.16)}
.mpa-pin{position:absolute;left:0;right:0;z-index:40;background:var(--bg)}
.mpa-pin.edge{box-shadow:0 1px 0 var(--line)}
.mpa-cnt{position:absolute;left:0;right:0;bottom:0;overflow:hidden}
.mpa-in{padding-bottom:220px}
/* search field */
.mpa-srch{padding:4px 18px 12px}
.mpa-fld{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:23px;background:rgba(var(--fg),.07);border:1px solid var(--line);font-size:15px;color:var(--ink-dim)}
.mpa-fld .ic{width:18px;height:18px;stroke:var(--ink-dim);stroke-width:2.2}
.mpa-fld .q{color:var(--ink);flex:1}
.mpa-srch.row{display:flex;align-items:center;gap:12px}.mpa-srch.row .mpa-fld{flex:1;min-width:0}.mpa-srch.row .mpa-pair{padding:0}
.land .mpa-srch{padding:4px 40px 12px}.land .mpa-chips{padding:2px 40px 14px}.land .mpa-meta,.land .mpa-row h3,.land .mpa-srchmeta{padding-left:40px;padding-right:40px}.land .mpa-pair{padding-left:40px;padding-right:40px}.land .mpa-srch.row .mpa-pair{padding:0}.land .mpa-track{padding:0 40px 2px}.land .mpa-back{margin:0 40px}
.mpa-fld .clr{font-size:13.5px;font-weight:600;color:var(--ink-soft);padding:0 2px}
/* chip strip (.tabs.discsegs) */
.mpa-chips{display:flex;gap:8px;padding:2px 18px 14px;overflow:hidden}
.mpa-chips b{flex:none;padding:7px 15px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink-soft);background:rgba(var(--fg),.06);white-space:nowrap}
.mpa-chips b.on{background:var(--ink);color:#0a0c13}
[data-skin="noir"] .mpa-chips b.on{color:var(--bg)}
/* ---- THE PAIR (phone) — the album page's .mu-dacts at the sort pill's height ---- */
.mpa-pair{display:flex;gap:8px;padding:0 18px 14px}
.mpa-pb{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px 0 12px;border-radius:12px;font-size:13.5px;font-weight:600;white-space:nowrap;border:1px solid var(--line-2);background:rgba(var(--fg),.06);color:var(--ink)}
.mpa-pb.pri{background:var(--grad);border-color:transparent;color:#fff}
[data-skin="noir"] .mpa-pb.pri{background:var(--ink);color:var(--bg)}
.mpa-pb .ic{width:16px;height:16px}
.mpa-pb .ic.sh{stroke-width:2.1}
.mpa-pb.hit{box-shadow:0 0 0 3px rgba(var(--fg),.18)}
.mpa-pair.pin{padding:2px 18px 12px}
/* C: one ⤮ in the top row, Play all in its menu */
.mpa-menu{position:absolute;right:62px;width:216px;padding:6px;border-radius:14px;background:var(--bg-2);border:1px solid var(--line-2);box-shadow:0 18px 40px rgba(0,0,0,.55);z-index:50}
.mpa-menu div{display:flex;align-items:center;gap:11px;min-height:44px;padding:0 12px;border-radius:10px;font-size:14.5px;color:var(--ink)}
.mpa-menu div.on{background:rgba(var(--fg),.08)}
.mpa-menu .ic{width:18px;height:18px}
/* lists */
.mpa-meta{padding:0 18px 12px;font-size:12px;color:var(--ink-dim)}
.mpa-row{margin-top:22px}
.mpa-row.first{margin-top:4px}
.mpa-row h3{margin:0;font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;padding:0 18px 11px;display:flex;align-items:center;gap:7px}
.mpa-row h3 .more{margin-left:auto;font-family:'Sora',sans-serif;font-size:12px;font-weight:500;color:var(--ink-dim)}
.mpa-track{display:flex;gap:12px;overflow:hidden;padding:0 18px 2px}
.mpa-cv{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;display:flex;align-items:flex-end;padding:9px}
.mpa-cv .wm{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;line-height:1.12;color:#fff;text-wrap:balance;text-shadow:0 1px 8px rgba(0,0,0,.4)}
[data-skin="noir"] .mpa-cv{border-radius:6px}
.mpa-cv.sm{width:48px;height:48px;border-radius:7px;padding:4px;flex:none}
.mpa-cv.sm .wm{font-size:8px}
.mpa-ac{flex:none;width:142px}
.mpa-ac .t{font-size:13px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpa-ac .s{font-size:12px;color:var(--ink-dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpa-g2{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;padding:0 18px}
.mpa-g2 .mpa-ac{width:auto;min-width:0}
.land .mpa-g2{grid-template-columns:repeat(5,1fr);padding:0 40px}
.mpa-g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 10px;padding:0 18px}
.land .mpa-g3{grid-template-columns:repeat(7,1fr);padding:0 40px}
.mpa-arc{text-align:center;flex:none;width:96px}
.mpa-g3 .mpa-arc{width:auto}
.mpa-arc .c{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;color:#fff;margin:0 auto}
.mpa-g3 .mpa-arc .c{width:100%;height:auto;aspect-ratio:1}
.mpa-arc .t{font-size:12.5px;font-weight:600;margin-top:8px;line-height:1.25}
.mpa-arc .s{font-size:11.5px;color:var(--ink-dim);margin-top:1px}
.mpa-list{padding:0 8px}
.land .mpa-list{padding:0 30px}
.mpa-song{display:flex;align-items:center;gap:12px;min-height:62px;padding:7px 10px;border-radius:12px}
.mpa-song .b{flex:1;min-width:0}
.mpa-song .t{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpa-song .s{font-size:12.5px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.mpa-song .ln{font-size:12.5px;color:var(--ink-dim);font-variant-numeric:tabular-nums;flex:none}
.mpa-song .mo{width:30px;display:flex;justify-content:center;color:var(--ink-dim);flex:none}
.mpa-song .mo .ic{width:18px;height:18px}
.mpa-song.on .t{color:var(--accent)}
[data-skin="noir"] .mpa-song.on .t{color:var(--ink)}
.mpa-back{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;margin:0 18px;font-size:13.5px;font-weight:600;color:var(--ink-soft)}
.mpa-srchmeta{padding:0 18px 10px;font-size:12px;color:var(--ink-dim)}
/* loading: static placeholders, no shimmer (canvas rule: no infinite animations) */
.mpa-skl{display:block;border-radius:6px;background:rgba(var(--fg),.08)}
.mpa-skc{aspect-ratio:1;border-radius:10px;background:rgba(var(--fg),.06)}
/* mini player (docked on the bar) */
.mpa-mini{position:absolute;left:10px;right:10px;height:64px;border-radius:15px;display:flex;align-items:center;gap:12px;padding:0 6px 0 8px;background:var(--card-2);border:1px solid var(--line);z-index:71;box-shadow:0 14px 34px rgba(0,0,0,.45);overflow:hidden}
.land .mpa-mini{left:40px;right:40px}
.mpa-mini .pg{position:absolute;left:0;right:0;top:0;height:1.5px;background:rgba(var(--fg),.08)}
.mpa-mini .pg i{display:block;height:100%;width:34%;background:var(--grad)}
[data-skin="noir"] .mpa-mini .pg i{background:var(--ink)}
.mpa-mini .gr{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:26px;height:3px;border-radius:2px;background:var(--line-2)}
.mpa-mini .tx{flex:1;min-width:0}
.mpa-mini .n{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpa-mini .d{font-size:12.5px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;display:flex;gap:5px;align-items:center}
.mpa-mini .d .on{display:inline-flex;align-items:center;gap:4px;color:var(--accent-2)}
[data-skin="noir"] .mpa-mini .d .on{color:var(--ink)}
.mpa-mini .d .on .ic{width:12px;height:12px;stroke-width:2.2}
.mpa-mini .bt{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.mpa-mini .bt .ic{width:22px;height:22px}
/* bottom bar (Listen · Browse · Playing · Queue · Profile) */
.mpa-bnv{position:absolute;left:0;right:0;bottom:0;z-index:72;padding-top:10px;background:var(--bg-2);border-top:1px solid var(--line)}
.mpa-bnv .brow{display:flex;align-items:flex-end}
.land .mpa-bnv .brow{padding:0 120px}
.mpa-bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 0 8px;color:var(--ink-dim)}
.mpa-bn .p{width:56px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.mpa-bn .p .ic{width:26px;height:26px;stroke-width:2}
.mpa-bn b{font-size:11.5px;line-height:16px;font-weight:600}
.mpa-bn.on .p{background:var(--grad);color:#fff}
[data-skin="noir"] .mpa-bn.on .p{background:var(--ink);color:var(--bg)}
.mpa-bn.on b{color:var(--ink)}
.mpa-bn .av{width:28px;height:28px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:11px;color:#fff}
.mpa-bnv .safe{height:22px}
.land .mpa-bnv .safe{height:4px}
.cmpw .mpa-bnv .safe{height:6px}
/* toast (.ph-toast) */
.mpa-tst{position:absolute;left:50%;transform:translateX(-50%);z-index:80;padding:11px 16px;border-radius:12px;background:var(--card-2);border:1px solid var(--line-2);font-size:13.5px;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.mpa-tst .k{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;margin-right:8px;vertical-align:-3px;background:rgba(var(--fg),.12);font-size:11px;font-weight:700}
/* Now playing (tab) — only the first line is this round's */
.mpa-np{position:absolute;left:0;right:0;z-index:50;display:flex;flex-direction:column;padding:0 0 10px}
.mpa-np .top{display:flex;align-items:center;gap:8px;height:58px;padding:0 10px;flex:none}
.mpa-np .top .ctx{flex:1;min-width:0;text-align:center;font-size:12px;color:var(--ink-soft);line-height:1.3}
.mpa-np .top .ctx b{display:block;font-size:13.5px;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpa-np .top .ctx.hl{outline:2px dashed rgba(255,214,102,.75);outline-offset:4px;border-radius:6px}
.mpa-np .top .ib{width:46px;height:46px;display:flex;align-items:center;justify-content:center;flex:none}
.mpa-np .top .ib .ic{width:24px;height:24px}
.mpa-np .ncov{width:84%;margin:8px auto 0;aspect-ratio:1;border-radius:24px;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.mpa-np .ncov .mpa-cv{width:100%;height:100%;border-radius:24px;padding:22px}
.mpa-np .ncov .mpa-cv .wm{font-size:30px}
.mpa-np .meta{padding:0 26px;margin-top:24px}
.mpa-np .meta .t{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700}
.mpa-np .meta .s{font-size:14.5px;color:var(--ink-soft);margin-top:4px}
.mpa-np .seek{margin:20px 26px 0;height:4px;border-radius:3px;background:rgba(var(--fg),.18);position:relative}
.mpa-np .seek i{position:absolute;left:0;top:0;bottom:0;width:22%;border-radius:3px;background:var(--ink)}
.mpa-np .seek u{position:absolute;left:22%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--ink)}
.mpa-np .tm{display:flex;justify-content:space-between;margin:8px 26px 0;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.mpa-np .tp{display:flex;align-items:center;justify-content:space-between;margin:12px 26px 0}
.mpa-np .tp .ic{width:26px;height:26px}
.mpa-np .tp .ic.sm{width:22px;height:22px}
.mpa-np .tp .pp{width:64px;height:64px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center}
.mpa-np .tp .on{color:var(--accent)}
[data-skin="noir"] .mpa-np .tp .on{color:var(--ink)}
.mpa-ann{position:absolute;z-index:90;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:#12141b;background:#ffd666;padding:3px 7px;border-radius:5px;white-space:nowrap}

/* ============ DESKTOP (wide) ============ */
.mpa-dk{width:1120px;height:720px;border-radius:16px;display:grid;grid-template-columns:232px minmax(0,1fr);font-size:13px}
.mpa-side{margin:8px 0 8px 8px;border-radius:12px;background:rgba(var(--fg),.055);border:1px solid rgba(var(--fg),.08);padding:10px;display:flex;flex-direction:column;gap:10px;min-height:0}
.mpa-lights{display:flex;gap:8px;padding:2px 4px 6px}
.mpa-lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.mpa-lights i:nth-child(2){background:#febc2e}.mpa-lights i:nth-child(3){background:#28c840}
.mpa-seg{display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:10px;background:rgba(var(--fg),.07);gap:2px}
.mpa-seg b{height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;color:var(--ink-soft)}

  const song = ([t, a, al, d], on) => `<div class="mpa-song${on ? ' on' : ''}">${pc(al, 'sm')}<div class="b"><div class="t">${t}</div><div class="s">${a} — ${al}</div></div><span class="ln">${d}</span><span class="mo">${ic('more')}</span></div>`;
  const rowh = (h, more) => `<h3>${h}${more ? `<span class="more">${more} ›</span>` : ''}</h3>`;
  const sk = (w, h, m) => `<span class="mpa-skl" style="width:${w};height:${h}px;${m || ''}"></span>`;
  function pair(lang, o) {
    o = o || {};
    return `<div class="mpa-pair${o.pin ? ' pin' : ''}" data-pair="1"><span class="mpa-pb pri${o.hit === 'play' ? ' hit' : ''}">${ic('play')}${T(lang, 'play_all')}</span><span class="mpa-pb${o.hit === 'shuf' ? ' hit' : ''}">${ic('shuffle', 'sh')}${T(lang, 'shuffle_all')}</span></div>`;
  }
  // Q (v2, "quiet pair"): two 28 px pills in the sort pill's own style, right-aligned on the count line (or alone on a 28 px row where a page has no count)
  function qrow(lang, count, loading) {
    return `<div class="mpa-qrow" data-pair="1">${count != null ? `<span class="c">${loading ? sk('64px', 10) : count}</span>` : ''}<span class="mpa-qb f">${ic('play')}${T(lang, 'play_all')}</span><span class="mpa-qb">${ic('shuffle', 'sh')}${T(lang, 'shuffle_all')}</span></div>`;
  }
  function chips(lang, on) {
    return `<div class="mpa-chips">${['artists', 'albums', 'songs', 'genres', 'playlists', 'books'].map(k => `<b class="${k === on ? 'on' : ''}">${T(lang, k)}</b>`).join('')}</div>`;
  }
  const field = (lang, q, right) => `<div class="mpa-srch${right ? ' row' : ''}"><div class="mpa-fld">${ic('search')}${q ? `<span class="q">${q}</span><span class="clr">${T(lang, 'clear')}</span>` : `<span>${T(lang, 'search_ph')}</span>`}</div>${right || ''}</div>`;

  // the page body below the app bar, for one direction. P = the pair's html if this direction puts it inline here.
  function body(o) {
    const lang = o.lang, d = o.dir, land = o.land, A = d === 'A', B = d === 'B', Q = d === 'Q', P0 = (A || B) ? pair(lang, { hit: o.hit }) : '', W = A && land && o.page !== 'listen', P = W ? '' : P0;
    const g2 = l => `<div class="mpa-g2">${l.map(x => acard(x, true)).join('')}</div>`;
    const loading = o.loading;
    const meta = s => Q ? qrow(lang, s, loading) : `<div class="mpa-meta">${loading ? sk('70px', 10, 'margin-top:2px') : s}</div>`;
    let h = '';
    if (o.page === 'listen') {
      const r1 = `<div class="mpa-row${A && !o.listenAlt || B ? ' first' : ''}">${rowh(T(lang, 'r_added'))}<div class="mpa-track">${AL.slice(0, land ? 6 : 4).map(x => acard(x)).join('')}</div></div>`;
      const r2 = `<div class="mpa-row">${rowh(T(lang, 'r_played'), T(lang, 'see_all'))}<div class="mpa-list">${RECENT.map(x => song(x)).join('')}</div></div>`;
      const r3 = `<div class="mpa-row">${rowh(T(lang, 'h_artists'))}<div class="mpa-track">${AR.slice(5, 11).map(x => arc(x, lang)).join('')}</div></div>`;
      const r4 = `<div class="mpa-row">${rowh('Indie Folk')}<div class="mpa-track">${FOLK.slice(0, 4).map(x => acard(x)).join('')}</div></div>`;
      if (Q) return `<div style="height:8px"></div>${qrow(lang)}${r1.replace('class="mpa-row"', 'class="mpa-row first"')}${r2}${r3}${r4}`;
      if ((A || B) && !o.listenAlt) h = `<div style="height:6px"></div>${B ? '' : P}${r1}${r2}${r3}${r4}`;
      else if (A && o.listenAlt) h = `${r1}${r2}<div style="height:16px"></div>${P}${r3.replace('mpa-row"', 'mpa-row" style="margin-top:8px"')}${r4}`;
      else h = r1.replace('mpa-row', 'mpa-row first') + r2 + r3 + r4;
      if (!(A || B) || o.listenAlt) h = '<div style="height:6px"></div>' + h;
      return h;
    }
    const isSearch = o.page.indexOf('search') === 0;
    const q = o.page === 'search' ? 'harbour' : o.page === 'search-empty' ? 'harbor' : o.page === 'search-one' ? 'kvøldsól' : '';
    if (isSearch) {
      h += B ? '' : field(lang, q, W && o.page !== 'search-empty' ? P0 : '');
      if (o.page === 'search-empty') return h + `<div class="mpa-srchmeta">${T(lang, 'no_results', { q })}</div>`;
      h += A ? P : Q ? qrow(lang) : '';
      const sl = o.page === 'search-one' ? S_ONE : S_HARB;
      h += `<div class="mpa-row first">${rowh(T(lang, 'songs'), o.page === 'search' ? T(lang, 'see_all') : '')}<div class="mpa-list">${sl.map(x => song(x)).join('')}</div></div>`;
      if (o.page === 'search') h += `<div class="mpa-row">${rowh(T(lang, 'albums'))}${g2([AL[0], AL[1]])}</div><div class="mpa-row">${rowh(T(lang, 'artists'))}<div class="mpa-g3">${arc(AR[6], lang)}</div></div>`;
      return h;
    }
    const chip = o.page === 'genre' || o.page === 'genre-empty' ? 'albums' : o.page;
    h += B ? '' : field(lang, '', W && o.page !== 'genre-empty' ? P0 : '');
    h += chips(lang, chip);
    if (o.page === 'genre' || o.page === 'genre-empty') {
      const n = o.page === 'genre' ? 9 : 0;
      h += `<div class="mpa-back">‹ ${T(lang, 'genres')}</div><div class="mpa-row" style="margin-top:0">${rowh('Indie Folk', '').replace('</h3>', `<span class="more">${T(lang, 'albums_n', { n })}</span></h3>`)}</div>`;
      if (n) h += (A ? P : Q ? qrow(lang) : '') + g2(FOLK.slice(0, land ? 10 : 6));
      return h;
    }
    h += A ? P : '';
    if (o.page === 'albums') h += meta(o.big ? T(lang, 'albums_n', { n: 212 }) : T(lang, 'albums_n', { n: 30 })) + (loading ? `<div class="mpa-g2">${Array.from({ length: land ? 10 : 6 }, () => `<div><div class="mpa-skc"></div>${sk('80%', 10, 'margin-top:10px')}${sk('55%', 9, 'margin-top:6px')}</div>`).join('')}</div>` : g2(AL.slice(0, land ? 10 : 8)));
    if (o.page === 'artists') h += meta(T(lang, 'artists_n', { n: 20 })) + `<div class="mpa-g3">${AR.slice(0, land ? 14 : 12).map(x => arc(x, lang, true)).join('')}</div>`;
    if (o.page === 'songs') h += meta(o.big ? T(lang, 'songs_n', { n: fmtN(3214) }) : T(lang, 'songs_n', { n: 385 })) + (loading ? `<div class="mpa-list">${Array.from({ length: 8 }, () => `<div class="mpa-song"><span class="mpa-skc" style="width:48px;flex:none;border-radius:7px"></span><div class="b">${sk('62%', 11)}${sk('44%', 9, 'margin-top:8px')}</div></div>`).join('')}</div>` : `<div class="mpa-list">${SONGS.map((x, i) => song(x, o.playing && i === 0)).join('')}</div>`);
    return h;
  }
  function bar(lang, on) {
    const it = [['listen', 'listen'], ['browse', 'browse'], ['nowp', 'playing'], ['queue', 'queue']];
    return `<div class="mpa-bnv"><div class="brow">${it.map(([i, k]) => `<div class="mpa-bn${k === on ? ' on' : ''}"><span class="p">${ic(i)}</span><b>${T(lang, k)}</b></div>`).join('')}<div class="mpa-bn"><span class="p"><span class="av">ER</span></span><b>${T(lang, 'profile')}</b></div></div><div class="safe"></div></div>`;
  }
  const NOWS = { t: 'Kite Weather', a: 'Harbour Lights', al: 'Kite Weather' };
  function mini(o, bottom) {
    const s = o.npSong || NOWS;
    return `<div class="mpa-mini" style="bottom:${bottom}px"><div class="pg"><i></i></div><span class="gr"></span>${pc(s.al, 'sm')}<div class="tx"><div class="n">${s.t}</div><div class="d">${o.cast ? `<span>${s.a}</span><span>·</span><span class="on">${ic('speaker')}Stue</span>` : s.a}</div></div><span class="bt">${ic('pause')}</span><span class="bt">${ic('next')}</span></div>`;
  }
  function phone(o) {
    o = Object.assign({ lang: 'en', dir: 'A', page: 'albums', skin: 'aurora' }, o);
    const lang = o.lang, land = !!o.land, cmpw = !!o.cmpw;
    const sbH = cmpw ? 38 : land ? 24 : 34, apH = land ? 52 : 56, bnH = land ? 76 : cmpw ? 78 : 94;
    const tab = o.page === 'listen' ? 'listen' : o.page === 'np' ? 'playing' : 'browse';
    const sortOn = ['albums', 'artists', 'songs', 'genre', 'genre-empty'].indexOf(o.page) >= 0;
    const slot = (sortOn ? `<span class="mpa-sort">${T(lang, 'sort')}${ic('chev')}</span>` : '') + (o.dir === 'C' && o.page !== 'np' && !/empty/.test(o.page) ? `<span class="mpa-ib${o.menu ? ' hot' : ''}" title="${T(lang, 'shuffle_all')}">${ic('shuffle')}</span>` : '');
    const top = cmpw ? `<div class="mpa-strip"><i></i><i></i><i></i><span>compact · 400 dp</span></div>` : `<div class="mpa-sb"><span>9:41</span><span class="si"><i></i><i></i><i></i></span></div>`;
    let h = top;
    if (o.page === 'np') {
      const s = o.npSong || NOWS;
      const val = o.npFrom === 'lib' ? T(lang, 'lib') : o.npFrom === 'genre' ? 'Indie Folk' : o.npFrom === 'search' ? (L[lang].srch ? T(lang, 'srch', { q: 'harbour' }) : '—') : s.al;
      h += `<div class="mpa-np" style="top:${sbH}px;bottom:${bnH}px;background:radial-gradient(120% 70% at 50% 18%,hsl(${H(s.al)} 45% 26%),var(--bg) 78%)"><div class="top"><span class="ib">${ic('down')}</span><div class="ctx hl">♪ ${T(lang, 'from')}<b>${val}</b></div><span class="ib">${ic('more')}</span></div><div class="ncov">${pc(s.al)}</div><div class="meta"><div class="t">${s.t}</div><div class="s">${s.a} — ${s.al}</div></div><div class="seek"><i></i><u></u></div><div class="tm"><span>0:48</span><span>−2:48</span></div><div class="tp"><span class="on">${ic('shuffle', 'sm')}</span>${ic('prev')}<span class="pp">${ic('pause')}</span>${ic('next')}${ic('repeat', 'sm')}</div></div>`;
      return frame(o, h + bar(lang, tab), land ? 'mpa-ph land' : cmpw ? 'mpa-ph cmpw' : 'mpa-ph');
    }
    h += `<div class="mpa-apb" style="top:${sbH}px"><div class="mpa-brand">${MARK(o.skin)}<span class="wm">Ravilo</span><span class="nt">♪</span></div><span class="sp"></span><div class="mpa-slot">${slot}</div><span class="mpa-ib">${ic('cast')}</span></div>`;
    let cTop = sbH + apH;
    // B: the pair (and the field above it, on Browse) never scroll away. At rest it is simply where it sits; scrolled, it stays.
    if (o.dir === 'B' && !/empty/.test(o.page)) {
      const isBrowse = o.page !== 'listen';
      const qq = o.page === 'search' ? 'harbour' : o.page === 'search-one' ? 'kvøldsól' : '';
      const pin = isBrowse && land ? field(lang, qq, pair(lang, { hit: o.hit })) : (isBrowse ? field(lang, qq) : '<div style="height:4px"></div>') + pair(lang, { pin: 1, hit: o.hit });
      const pinH = isBrowse && land ? 62 : (isBrowse ? 62 : 4) + 52;
      h += `<div class="mpa-pin${o.scroll ? ' edge' : ''}" style="top:${cTop}px;height:${pinH}px">${pin}</div>`;
      cTop += pinH;
    } else if (o.dir === 'B' && /empty/.test(o.page) && o.page === 'search-empty') {
      h += `<div class="mpa-pin" style="top:${cTop}px;height:62px">${field(lang, 'harbor')}</div>`; cTop += 62;
    }
    let b = body(o);
    if (o.dir === 'B' && o.page === 'search-empty') b = b.replace(/<div class="mpa-srch">[\s\S]*?<\/div><\/div>/, '');
    h += `<div class="mpa-cnt" style="top:${cTop}px"><div class="mpa-in" style="margin-top:${-(o.scroll || 0)}px">${b}</div></div>`;
    if (o.menu) h += `<div class="mpa-menu" style="top:${sbH + 50}px"><div class="on">${ic('shuffle')}${T(lang, 'shuffle_all')}</div><div>${ic('play')}${T(lang, 'play_all')}</div></div>`;
    const mb = bnH + 8;
    if (o.playing) h += mini(o, mb);
    if (o.toast) {
      const msg = o.toast === 'capped' ? T(lang, 'capped', { shown: fmtN(1000), total: fmtN(3214) }) : T(lang, 'fail');
      h += `<div class="mpa-tst" style="bottom:${o.playing ? mb + 72 : bnH + 14}px">${msg}</div>`;
    }
    h += bar(lang, tab);
    if (o.ann) h += o.ann;
    return frame(o, h, land ? 'mpa-ph land' : cmpw ? 'mpa-ph cmpw' : 'mpa-ph');
  }
  function frame(o, inner, cls) { return `<div class="fr ${cls}" data-skin="${o.skin}" lang="${o.lang}"${o.id ? ` data-png="${o.id}"` : ''}>${inner}</div>`; }

  /* ============ DESKTOP (wide, macOS shell) ============ */
  const dcv = t => `<div class="mpa-cv" style="${cov(t)}"></div>`;
  const dal = ([t, a, y], yr) => `<div class="mpa-dal">${dcv(t)}<div class="t">${t}</div><div class="s">${a}${yr ? ' · ' + y : ''}</div></div>`;
  const dar = ([n, k, noimg], sub) => `<div class="mpa-dar"><div class="c" style="${arStyle(n, noimg)}">${noimg ? ini(n) : ''}</div><div class="t">${n}</div><div class="s">${sub ? (k === 1 ? '1 album' : k + ' albums') : 'Artist'}</div></div>`;
  const trk = (l, now) => `<div class="mpa-trk"><div class="hd"><span>#</span><span>Title</span><span>Artist</span><span>Album</span><span>Time</span></div>${l.map(([t, a, al, d], i) => `<div class="tr${now && i === 0 ? ' now' : ''}"><span class="nr">${i + 1}</span><span class="tt">${t}</span><span class="dm">${a}</span><span class="dm">${al}</span><span class="du">${d}</span></div>`).join('')}</div>`;
  function dpair(o, cls) { return `<div class="mpa-dp${cls ? ' ' + cls : ''}${o.dir === 'Q' ? ' q' : ''}" data-pair="1"><span class="mpa-bt pri${o.focus === 'play' ? ' fc' : ''}">${ic('play')}Play all${o.tabs ? '<span class="mpa-tab">1</span>' : ''}</span><span class="mpa-bt${o.focus === 'shuf' ? ' fc' : ''}">${ic('shuffle')}Shuffle all${o.tabs ? '<span class="mpa-tab">2</span>' : ''}</span></div>`; }
  function dside(o) {
    const nav = [[null, [['phones', 'Listen', 'listen'], ['wave', 'Playing'], ['lq', 'Queue']]], ['Library', [['person', 'Artists', 'artists', 20], ['disc', 'Albums', 'albums', 30], ['note', 'Songs', 'songs', 385], ['tag', 'Genres', 'genres', 18], ['plist', 'Playlists', null, 2], ['book', 'Audiobooks', null, 1]]]];
    const on = o.page === 'genre' ? 'genres' : o.page;
    return `<aside class="mpa-side"><div class="mpa-lights"><i></i><i></i><i></i></div><div class="mpa-seg"><b>Films &amp; series</b><b class="on">Music</b></div><div class="mpa-sf${o.page === 'search' ? ' on' : ''}">${ic('search')}<span>Search music</span></div><div class="mpa-nav">${nav.map(([hh, it]) => (hh ? `<h6>${hh}</h6>` : '') + it.map(([i, l, k, n]) => `<a class="${k && k === on ? 'on' : ''}">${ic(i)}<span>${l}</span>${n != null ? `<span class="n">${n}</span>` : ''}</a>`).join('')).join('')}</div><div class="mpa-who"><span class="av">E</span><div><div class="nm">Eyð</div><div class="sub">Settings · Sign out</div></div></div></aside>`;
  }
  function desk(o) {
    o = Object.assign({ dir: 'D1', page: 'albums', skin: 'aurora', lang: 'en' }, o);
    const R = o.dir === 'D1' || o.dir === 'Q', U = o.dir === 'D2';
    const head = (title, extra) => R ? `<div class="mpa-dh"><div class="h1">${title}</div><span class="sp"></span>${extra === false ? '' : dpair(o)}</div>` : `<div class="mpa-dh"><div class="h1">${title}</div></div>`;
    const under = U ? dpair(o, 'under') : '';
    let b = '';
    if (o.page === 'listen') b = head('Listen') + under + `<div class="mpa-rh" style="margin-top:10px"><h4>Recently added</h4><span class="more">See all</span></div><div class="mpa-drow">${AL.slice(0, 6).map(x => dal(x)).join('')}</div><div class="mpa-rh"><h4>Recently played</h4><span class="more">See all</span></div>${trk(RECENT.slice(0, 4))}`;
    if (o.page === 'albums') b = head('Albums') + `<div class="mpa-ml">${o.loading ? sk('64px', 10) : '30 albums'}</div>` + under + (o.loading ? `<div class="mpa-dgrid">${Array.from({ length: 12 }, () => `<div><div class="mpa-skc" style="border-radius:8px"></div>${sk('80%', 10, 'margin-top:10px')}</div>`).join('')}</div>` : `<div class="mpa-dgrid">${AL.map(x => dal(x, true)).join('')}</div>`);
    if (o.page === 'artists') b = head('Artists') + `<div class="mpa-ml">20 artists</div>` + under + `<div class="mpa-dgrid">${AR.slice(0, 12).map(x => dar(x, true)).join('')}</div>`;
    if (o.page === 'songs') b = head('Songs') + `<div class="mpa-ml">${o.loading ? sk('64px', 10) : o.big ? fmtN(3214) + ' songs' : '385 songs'}</div>` + under + (o.loading ? `<div class="mpa-trk"><div class="hd"><span>#</span><span>Title</span><span>Artist</span><span>Album</span><span>Time</span></div>${Array.from({ length: 10 }, () => `<div class="tr"><span></span>${sk('70%', 10)}${sk('60%', 10)}${sk('60%', 10)}<span></span></div>`).join('')}</div>` : trk(SONGS, o.playing));
    if (o.page === 'genre') b = head('Indie Folk') + `<div class="mpa-ml">9 albums</div>` + under + `<div class="mpa-dgrid">${FOLK.map(x => dal(x, true)).join('')}</div>`;
    if (o.page === 'search') b = (R ? `<div class="mpa-dh"><div class="mpa-dsrch">${ic('search')}<span class="q">harbour</span><span class="x">esc</span></div>${dpair(o)}</div>` : `<div class="mpa-dh"><div class="mpa-dsrch">${ic('search')}<span class="q">harbour</span><span class="x">esc</span></div></div><div style="height:12px"></div>${under}`)
      + `<div class="mpa-rh" style="margin-top:10px"><h4>Songs</h4><span class="more">See all</span></div>${trk(S_HARB)}<div class="mpa-rh"><h4>Albums</h4></div><div class="mpa-drow">${[AL[0], AL[1]].map(x => dal(x, true)).join('')}</div><div class="mpa-rh"><h4>Artists</h4></div><div class="mpa-drow">${dar(AR[6])}</div>`;
    const cap = o.playing ? `<div class="mpa-capbar"><span class="art" style="${cov('Kite Weather')}"></span><div class="tx"><div class="t">Kite Weather</div><div class="s">Harbour Lights</div></div><div class="ctl">${ic('prev')}<span class="pp">${ic('pause')}</span>${ic('next')}</div><div class="sk"><span>1:04</span><i></i><span>3:36</span></div><div class="r">${ic('lyr')}${ic('lq')}${ic('cast')}${ic('vol')}</div></div>` : '';
    const tst = o.toast ? `<div class="mpa-dtst">${o.toast === 'capped' ? 'Playing ' + fmtN(1000) + ' of ' + fmtN(3214) + ' songs' : 'Couldn’t play this'}</div>` : '';
    const inner = `${dside(o)}<div class="mpa-main"><div class="mpa-mtb"><span class="mpa-gl">${ic('back')}${ic('fwd', 'dim')}</span><span class="sp" style="flex:1"></span><span class="mpa-gl">${ic('cast')}</span></div><div class="mpa-body">${b}</div>${cap}${tst}${o.ann || ''}</div>`;
    return `<div class="fr mpa-dk" data-skin="${o.skin}" lang="en"${o.id ? ` data-png="${o.id}"` : ''}>${inner}</div>`;
  }
  window.MPK = { phone, desk, T, L, fmtN, ic };
})();

</script>
<script>
function mpaCanvas(){
/* music-play-all v2 — one recommendation, nothing left to pick. The quiet pair (dir Q): 28 px pills in the sort pill's style, on the count line.
   Frames from music-play-all-kit.js (window.MPK); each carries data-png. MPA.solo(id) / MPA.unsolo() for the PNG export. */
(function () {
  const K = window.MPK, C = document.getElementById('cv');
  const X0 = 80, GAP = 50, WIDTH = 2650;
  let Y = 80;
  function put(x, y, html) { const t = document.createElement('div'); t.innerHTML = html.trim(); const el = t.firstElementChild; el.style.left = x + 'px'; el.style.top = y + 'px'; C.appendChild(el); return el; }
  function bottom() { let b = 0; [...C.children].forEach(e => { b = Math.max(b, e.offsetTop + e.offsetHeight); }); return b; }
  function sec(n, title) { put(X0, Y, `<div class="rule" style="width:${WIDTH}px"></div>`); Y += 44; put(X0, Y, `<div class="sech"><div class="n">${n}</div><h2>${title}</h2></div>`); Y = bottom() + 34; }
  function row(items, start) {
    let x = start || X0; const y = Y;
    items.forEach(it => {
      put(x, y, `<div class="cap" style="width:${it.w}px">${it.cap}</div>`);
      const f = put(x, y + 30, it.html);
      if (it.note) put(x, y + 30 + f.offsetHeight + 14, `<div class="note" style="width:${it.w}px">${it.note}</div>`);
      x += it.w + GAP;
    });
    Y = bottom() + 84;
  }
  const P = (id, cap, o, note) => ({ cap, note, w: o.land ? 780 : o.cmpw ? 400 : 360, html: K.phone(Object.assign({ id: 'music-play-all-' + id, dir: 'Q' }, o)) });
  const D = (id, cap, o, note) => ({ cap, note, w: 1120, html: K.desk(Object.assign({ id: 'music-play-all-' + id, dir: 'Q' }, o)) });
  const lbl = (x, y, w, html) => put(x, y, `<div class="lbl" style="width:${w}px">${html}</div>`);
  const st = (n, t) => { lbl(X0, Y, 2400, `<span class="tag new">State ${n}</span><h3>${t}</h3>`); Y = bottom() + 22; };

  /* ===== 0 · title + the one ask ===== */
  lbl(X0, Y, 1500, `<span class="tag new">Round · music-play-all · v2 · 2026-10-17 · no phase number</span><h2>Play all &amp; Shuffle all — v2, the quiet pair</h2><small>v1 offered three directions and five open decisions. The owner said that was too much to decide, and that the buttons were too big. v2 is <b>one answer with no open decisions</b>: two small pills, <b>▶ Play all · ⤮ Shuffle all</b>, drawn in the sort pill’s own style at <b>28 px</b>, sitting on the line that already carries the count. Every state the brief names is carried through below. The stand-ins are the brief’s, unchanged.</small>`);
  Y = bottom() + 40;
  put(X0, Y, `<div class="panel" style="width:1100px"><h2>The only question</h2><p style="font-size:17px;margin:0 0 12px"><b>Is the quiet pair right?</b> If yes, everything below is the spec. If not, say what’s off and v3 changes only that.</p>
<ul><li><b>Size:</b> 28 px tall, 12.5 px Sora 600, 13 px glyphs. Both pills are quiet: no gradient, the sort pill’s fill and border. The tap area stays 44 px.</li>
<li><b>Place:</b> right-aligned on the count line (<i>30 albums</i> ··· <i>▶ Play all · ⤮ Shuffle all</i>). Where a page has no count line, the pills sit alone in that same place: at the top of Listen, under the genre heading, under the search field.</li>
<li><b>Behaviour:</b> it scrolls with the list. It is the same in portrait, landscape and the compact desktop. On the wide desktop the same pills sit right of the page title.</li>
<li><b>Everything else v1 asked you</b> has a default now. Section 3 lists what was dropped, one line each.</li></ul></div>`);
  put(X0 + 1170, Y, `<div class="panel" style="width:1170px"><h2>Fixed, and found while drawing</h2><ul>
<li><b>Fixed, not reopened:</b> the five surfaces; nothing on Playlists, Audiobooks, Playing, Queue or Profile. Album, artist and playlist pages keep their own Play / Shuffle. The pair replaces the queue, a search plays its whole expanded result once, and play follows the sort order with a cap at 1 000. Counts come only from the server. The bottom bar and mini player don’t move.</li>
<li><b>Sibling:</b> the pills are the <b>sort pill’s</b> style, not the album page’s big pair. That is an existing style, not a third one, and the album page keeps its loud <i>Play</i>. Flagged in case “sibling” was meant strictly.</li>
<li>The desktop album page puts its buttons under the title; desktop Artists, Albums and Songs have no sort pill; desktop search groups are built Artists · Songs · Albums (drawn here in the requirement’s order); the desktop has no <i>Playing from</i> line.</li>
<li>Listen also has <i>Continue listening</i> (not in the brief’s row list, so not drawn). If it’s there, the pair still sits at the top.</li>
<li>At 360 dp the top row already clips cast in Faroese today. This round doesn’t touch the top row.</li>
<li>Faroese: the settled toast says <i>sangum</i>, while shipped strings say <i>løg</i>. <i>Search "{q}"</i> has no da/fo in the brief.</li></ul></div>`);
  Y = bottom() + 90;

  /* ===== 1 · the answer, on the case that decides it ===== */
  sec('1 · The answer — on the crowded case (360 dp, mini player docked)', 'Today · v1 · v2 side by side');
  const cmp = [
    { cap: 'Today · nothing added', w: 360, html: K.phone({ id: 'music-play-all-today-phone-crowded', dir: 'none', page: 'albums', playing: 1 }) },
    { cap: 'v1 · the big pair (dropped)', w: 360, html: K.phone({ id: 'music-play-all-v1-phone-crowded', dir: 'A', page: 'albums', playing: 1 }) },
    P('quiet-phone-crowded', 'v2 · the quiet pair', { page: 'albums', playing: 1 }),
    P('quiet-phone-crowded-listen', 'v2 · Listen', { page: 'listen', playing: 1 }),
    P('quiet-phone-crowded-search', 'v2 · search · harbour', { page: 'search', playing: 1 }),
  ];
  row(cmp);
  const mrow = put(X0, Y - 60, `<div class="note" style="width:1200px" id="mpa-measure"></div>`);
  Y = bottom() + 70;

  /* ===== 2 · every state ===== */
  sec('2 · Every state', 'The quiet pair, carried through');
  st('1', 'Each surface with the pair in place · phone 360');
  row([P('quiet-phone-listen', 'Listen', { page: 'listen' }), P('quiet-phone-artists', 'Browse ▸ Artists', { page: 'artists' }), P('quiet-phone-albums', 'Browse ▸ Albums', { page: 'albums' }), P('quiet-phone-songs', 'Browse ▸ Songs', { page: 'songs' }),
    P('quiet-phone-genre', 'a genre · Indie Folk', { page: 'genre' }, 'Albums filtered, <i>‹ Genres</i>, the heading. The pills sit under the heading that names what they play.'), P('quiet-phone-search', 'a search · harbour', { page: 'search' }, 'Once, above the three groups.')]);
  st('1 · 9', 'Each surface · desktop wide (pills right of the title)');
  row([D('quiet-desktop-wide-listen', 'Listen', { page: 'listen' }), D('quiet-desktop-wide-artists', 'Artists', { page: 'artists' })]);
  row([D('quiet-desktop-wide-albums', 'Albums', { page: 'albums', playing: 1 }), D('quiet-desktop-wide-songs', 'Songs', { page: 'songs' })]);
  row([D('quiet-desktop-wide-genre', 'Indie Folk', { page: 'genre' }), D('quiet-desktop-wide-search', 'harbour', { page: 'search' }, 'On search the field is the head, so the pills sit to its right.')]);
  st('9', 'Each surface · desktop compact (under 600 dp, the phone layout)');
  row(['listen', 'artists', 'albums', 'songs', 'genre', 'search'].map(p => P('quiet-desktop-compact-' + p, 'compact · ' + p, { page: p, cmpw: 1 })));
  st('2 · 3 · 4 · error · casting', 'Loading, empty, one song, a failed request, casting');
  row([P('quiet-phone-loading', 'loading · Songs', { page: 'songs', loading: 1 }, 'The pills are there; the count is not yet.'),
    P('quiet-phone-empty-search', 'empty search · harbor', { page: 'search-empty' }, '<b>No pills.</b>'),
    P('quiet-phone-empty-genre', 'a genre with no songs', { page: 'genre-empty' }, '<b>No pills</b>, not greyed.'),
    P('quiet-phone-one-song', 'one song · kvøldsól', { page: 'search-one' }, '<b>Both stay.</b> The pair never depends on a count.'),
    P('quiet-phone-error', 'error / offline', { page: 'albums', toast: 'error' }, 'A toast; the pills don’t change. Offline is the same.'),
    P('quiet-phone-casting', 'casting · Stue', { page: 'albums', playing: 1, cast: 1 }, 'No visual difference.')]);
  row([D('quiet-desktop-wide-loading', 'desktop · loading', { page: 'albums', loading: 1 }), D('quiet-desktop-wide-capped', 'desktop · capped toast', { page: 'songs', big: 1, playing: 1, toast: 'capped' })]);
  st('5', 'Capped toast · Playing 1 000 of 3 214 songs');
  row([P('quiet-phone-capped-en', 'en', { page: 'songs', big: 1, playing: 1, toast: 'capped' }), P('quiet-phone-capped-da', 'da', { page: 'songs', big: 1, playing: 1, toast: 'capped', lang: 'da' }), P('quiet-phone-capped-fo', 'fo', { page: 'songs', big: 1, playing: 1, toast: 'capped', lang: 'fo' })]);
  st('6', 'Playing from · Your library · Indie Folk · Search "harbour"');
  row([P('quiet-phone-from-library', 'Your library', { page: 'np', npFrom: 'lib' }), P('quiet-phone-from-genre', 'Indie Folk', { page: 'np', npFrom: 'genre' }), P('quiet-phone-from-search', 'Search "harbour"', { page: 'np', npFrom: 'search', npSong: { t: 'Two Harbours', a: 'Harbour Lights', al: 'Salt on the Window' } }),
    P('quiet-phone-from-library-da', 'Dit bibliotek', { page: 'np', npFrom: 'lib', lang: 'da' }), P('quiet-phone-from-library-fo', 'Títt savn', { page: 'np', npFrom: 'lib', lang: 'fo' })]);
  st('7 · 8', 'Scrolled while playing, and landscape');
  row([P('quiet-phone-crowded-scrolled', '360 · playing · scrolled', { page: 'albums', playing: 1, scroll: 300 }, 'Scrolled, the page reads exactly as today.'),
    P('quiet-phone-land-crowded', 'landscape · Albums · playing', { page: 'albums', playing: 1, land: 1 }), P('quiet-phone-land-listen', 'landscape · Listen', { page: 'listen', playing: 1, land: 1 })]);
  st('longest string', 'Danish and Faroese at 360');
  row([P('quiet-phone-longest-da', 'da · Albums', { page: 'albums', lang: 'da', playing: 1 }), P('quiet-phone-longest-fo', 'fo · Albums', { page: 'albums', lang: 'fo', playing: 1 }),
    P('quiet-phone-longest-da-genre', 'da · Indie Folk', { page: 'genre', lang: 'da' }), P('quiet-phone-longest-fo-search', 'fo · harbour', { page: 'search', lang: 'fo' })]);
  st('10', 'Desktop keyboard focus · Tab reaches both, Enter starts');
  row([D('quiet-desktop-wide-focus-play', 'focus on Play all', { page: 'albums', focus: 'play', tabs: 1 }, 'Tab order: sidebar → <b>Play all</b> ① → <b>Shuffle all</b> ② → grid. The ring is 2 px <code>--ring</code> with a 2 px <code>--bg</code> gap.'),
    D('quiet-desktop-wide-focus-shuffle', 'focus on Shuffle all · Noir', { page: 'albums', focus: 'shuf', skin: 'noir', tabs: 1 })]);
  st('11', 'All three skins');
  row([P('quiet-phone-skin-aurora', 'Aurora', { page: 'albums', playing: 1 }), P('quiet-phone-skin-midnight', 'Midnight', { page: 'albums', playing: 1, skin: 'midnight' }), P('quiet-phone-skin-noir', 'Noir', { page: 'albums', playing: 1, skin: 'noir' }, 'No gradient to drop: the pills are ink-on-fill in every skin.')]);
  row([D('quiet-desktop-wide-skin-midnight', 'desktop · Midnight', { page: 'albums', playing: 1, skin: 'midnight' }), D('quiet-desktop-wide-skin-noir', 'desktop · Noir', { page: 'albums', playing: 1, skin: 'noir' })]);
  lbl(X0, Y, 1400, `<span class="tag no">10-foot focus</span><h3>Not applicable</h3><small>No TV surface in this round.</small>`);
  Y = bottom() + 90;

  /* ===== 3 · dropped ===== */
  sec('3 · Dropped, so there is nothing to pick', 'Every v1 option, closed with a default');
  put(X0, Y, `<div class="panel" style="width:1500px"><table class="tbl"><tr><th style="width:380px">v1 option</th><th>v2</th></tr>
<tr><td>A · a 38 px pair, Play all on the gradient</td><td><b>Replaced</b> by the quiet pair. The owner found it too big.</td></tr>
<tr><td>B · the pair pinned under the search field</td><td><b>Dropped.</b> It costs 114 px on every page, all the time.</td></tr>
<tr><td>C · one ⤮ in the top row, Play all in its menu</td><td><b>Dropped.</b> It hides Play all and overflows the top row at 360 dp.</td></tr>
<tr><td>Listen · the pair lower down</td><td><b>Dropped.</b> It reads as part of Recently played. The pair goes at the top.</td></tr>
<tr><td>Desktop · the pair under the title</td><td><b>Dropped.</b> It adds a row. Right of the title is free space.</td></tr>
<tr><td>Landscape · the pair on the search field’s row</td><td><b>Dropped.</b> The count line works in landscape too, so there is one rule everywhere.</td></tr>
<tr><td>Error toast wording</td><td>Reuses the shipped <i>Couldn’t play this</i>. No new string.</td></tr></table></div>`);
  Y = bottom() + 90;

  /* ===== 4 · strings ===== */
  sec('4 · Strings', 'What the drawing shows that is new');
  put(X0, Y, `<div class="panel" style="width:1500px"><table class="tbl"><tr><th>String</th><th>en</th><th>da</th><th>fo</th><th>Status</th></tr>
<tr><td><b>Play all</b></td><td>Play all</td><td>Afspil alle</td><td>Spæl øll</td><td>already ships as <code>music.play_all</code></td></tr>
<tr><td><b>Shuffle all</b></td><td>Shuffle all</td><td>Bland alle</td><td>Blanda øll</td><td>settled</td></tr>
<tr><td><b>capped toast</b></td><td>Playing {shown} of {total} songs</td><td>Afspiller {shown} af {total} sange</td><td>Spælir {shown} av {total} sangum</td><td>settled</td></tr>
<tr><td><b>Playing from · value</b></td><td>Your library</td><td>Dit bibliotek</td><td>Títt savn</td><td>settled</td></tr>
<tr><td><b>Playing from · value</b></td><td>Search "{q}"</td><td>—</td><td>—</td><td>English only in the brief</td></tr></table>
<p style="margin-top:14px">Also shown, all existing and unchanged: chips, row headings, the sort pill, counts, <i>Nothing matches “{q}”</i>, and <i>Couldn’t play this</i>.</p></div>`);
  Y = bottom() + 120;

  document.body.style.width = (X0 * 2 + WIDTH) + 'px';
  document.body.style.height = Y + 'px';

  // measured, not typed: px of list visible between the top of the first grid row and the mini player
  (function measure() {
    const m = id => { const f = C.querySelector(`[data-png="music-play-all-${id}"]`); if (!f) return '?'; const s = f.getBoundingClientRect().height / f.offsetHeight; const g = f.querySelector('.mpa-g2'), mi = f.querySelector('.mpa-mini'); return Math.round((mi.getBoundingClientRect().top - g.getBoundingClientRect().top) / s); };
    const t = m('today-phone-crowded'), a = m('v1-phone-crowded'), q = m('quiet-phone-crowded');
    mrow.innerHTML = `<b>Measured on this canvas:</b> the list visible above the mini player is ${t} px today, ${a} px with v1’s big pair (−${t - a}), and <b>${q} px with the quiet pair (−${t - q})</b>. Once the list is scrolled, all three are the same.`;
  })();

  const keep = { w: document.body.style.width, h: document.body.style.height };
  window.MPA = {
    ids: () => [...C.querySelectorAll('[data-png]')].map(e => e.dataset.png),
    solo(id) {
      document.body.classList.add('solo');
      [...C.children].forEach(e => { e.style.display = e.dataset.png === id ? '' : 'none'; });
      const f = C.querySelector(`[data-png="${id}"]`); f.dataset.l = f.style.left; f.dataset.t = f.style.top; f.style.left = '0px'; f.style.top = '0px';
      document.body.style.width = f.offsetWidth + 'px'; document.body.style.height = f.offsetHeight + 'px'; window.scrollTo(0, 0);
      return [f.offsetWidth, f.offsetHeight];
    },
    unsolo() {
      document.body.classList.remove('solo');
      [...C.children].forEach(e => { e.style.display = ''; if (e.dataset.l != null) { e.style.left = e.dataset.l; e.style.top = e.dataset.t; delete e.dataset.l; delete e.dataset.t; } });
      document.body.style.width = keep.w; document.body.style.height = keep.h;
    },
  };
})();
}
Promise.all([document.fonts.load('600 14px Sora'), document.fonts.load('700 20px "Space Grotesk"'), document.fonts.load('700 12px "JetBrains Mono"')]).catch(function () {}).then(mpaCanvas);
</script>
