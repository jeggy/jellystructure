.lbl h3{margin:0;font-family:'Space Grotesk',sans-serif;font-size:1.25rem;letter-spacing:-.01em}
.lbl small{display:block;margin-top:9px;font-size:.84rem;line-height:1.68;color:#262a35}
.lbl small b{color:#0b0c11;font-weight:700}
.lbl .tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:#4a3fc4;margin-bottom:7px;font-weight:700}
.lbl .tag.pick{color:#0b7a52}.lbl .tag.no{color:#4a4f5e}.lbl .tag.new{color:#0f6597}
.lbl .cost{display:block;margin-top:12px;padding:10px 12px;border-radius:9px;background:#fff;border:1px solid rgba(0,0,0,.12);font-size:.8rem;line-height:1.6;color:#2b2f3b}
.lbl .cost b{color:#0b0c11}
.cap{position:absolute;font-size:.72rem;font-weight:600;color:#2e323e;font-family:'JetBrains Mono',monospace;letter-spacing:.04em;text-transform:uppercase;line-height:1.35}
.cap i{display:block;font-style:normal;text-transform:none;letter-spacing:0;font-family:'Sora',sans-serif;font-weight:500;font-size:.78rem;color:#262a35;margin-top:3px}
.note{position:absolute;font-size:.8rem;line-height:1.6;color:#262a35}
.note b{color:#0b0c11}
.rule{position:absolute;height:1px;background:rgba(0,0,0,.16)}
.sech{position:absolute;color:#12141b}
.sech .n{font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#4a3fc4}
.sech h2{margin:6px 0 0;font-family:'Space Grotesk',sans-serif;font-size:2.4rem;letter-spacing:-.025em}
.panel{position:absolute;background:#fff;color:#171923;border-radius:18px;padding:30px 34px;box-shadow:0 18px 44px rgba(0,0,0,.18)}
.panel h2{font-family:'Space Grotesk',sans-serif;font-size:1.45rem;margin:0 0 8px;letter-spacing:-.02em}
.panel h4{font-family:'Space Grotesk',sans-serif;font-size:.95rem;margin:20px 0 8px}
.panel p{font-size:.86rem;line-height:1.68;color:#30364a;margin:0 0 10px}
.panel b{color:#171923}
.panel ul{margin:0;padding-left:18px}
.panel li{font-size:.84rem;line-height:1.7;color:#30364a;margin-bottom:6px}
.panel code,.mono{font-family:'JetBrains Mono',monospace;font-size:.8em;background:#f0f1f6;padding:1px 5px;border-radius:4px;color:#171923}
.good{background:#eef7f2;border:1px solid #b9dfcc;border-radius:10px;padding:12px 14px;font-size:.84rem;line-height:1.62;color:#1f4634;margin:12px 0}
.warn{background:#fff8e8;border:1px solid #f2d79a;border-radius:10px;padding:12px 14px;font-size:.84rem;line-height:1.62;color:#4a3c1c;margin:12px 0}
.tbl{width:100%;border-collapse:collapse;margin-top:10px}
.tbl th{text-align:left;font-family:'JetBrains Mono',monospace;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:#4b5165;padding:0 10px 7px 0;font-weight:700;vertical-align:bottom}
.tbl td{font-size:.8rem;line-height:1.5;color:#30364a;padding:8px 10px 8px 0;border-top:1px solid #e3e5ec;vertical-align:top}
.tbl td b{color:#171923}
.tbl td.y{color:#0b6a46;font-weight:600}.tbl td.n{color:#8a2a1c;font-weight:600}.tbl td.m{color:#6a4c08;font-weight:600}
.opt{display:grid;gap:10px;margin-top:10px}
.opt>div{border:1px solid #e3e5ec;border-radius:11px;padding:13px 15px;background:#f8f9fc}
.opt h5{margin:0 0 5px;font-family:'Space Grotesk',sans-serif;font-size:.9rem;color:#171923}
.opt p{font-size:.8rem;line-height:1.6;margin:0 0 4px;color:#3d4357}
.opt .ch{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.opt .ch span{font-size:.72rem;font-weight:600;padding:5px 10px;border-radius:7px;background:#fff;border:1px solid #d9dce6;color:#30364a}
.opt .ch span.lean{background:#eef7f2;border-color:#b9dfcc;color:#1f4634}

/* ---------- a frame on the canvas ---------- */
.fr{position:absolute;overflow:hidden;color:var(--ink);background:var(--bg);font-family:'Sora',sans-serif;box-shadow:0 14px 36px rgba(0,0,0,.28)}
.fr *{box-sizing:border-box}
.solo .fr{box-shadow:none;border-radius:0!important}
.fr svg{display:block}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.f{fill:currentColor;stroke:none}

/* ============ PHONE (360 dp unless stated) ============ */
.mpa-ph{width:360px;height:780px;border-radius:30px}
.mpa-ph.land{width:780px;height:360px;border-radius:26px}
.mpa-ph.cmpw{width:400px;height:720px;border-radius:14px}
.mpa-sb{position:absolute;left:0;right:0;top:0;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 24px;font-size:13px;font-weight:600;z-index:60;background:var(--bg)}
.land .mpa-sb{height:24px;font-size:12px;padding:0 40px}
.mpa-sb .si{display:flex;gap:6px;align-items:center}
.mpa-sb .si i{display:block;width:15px;height:10px;border-radius:2px;background:var(--ink);opacity:.9}
.mpa-sb .si i:first-child{width:12px;clip-path:polygon(100% 0,100% 100%,0 100%)}
.mpa-sb .si i:last-child{width:22px;border-radius:3px}
.mpa-strip{position:absolute;left:0;right:0;top:0;height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--bg-2);border-bottom:1px solid var(--line);z-index:60}
.mpa-strip i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.mpa-strip i:nth-child(2){background:#febc2e}.mpa-strip i:nth-child(3){background:#28c840}
.mpa-strip span{margin-left:auto;font-size:11px;color:var(--ink-dim);font-family:'JetBrains Mono',monospace}
/* the app bar: sticky, so it is drawn as a fixed layer; the page scrolls under it */
.mpa-apb{position:absolute;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:8px 18px 10px;background:var(--bg);z-index:41}
.land .mpa-apb{padding:6px 40px 8px;height:52px}
.mpa-brand{display:flex;align-items:center;gap:8px;flex:none}
.mpa-brand .mark{width:22px;height:22px}
.mpa-brand .wm{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:21px;letter-spacing:-.02em}
.mpa-brand .nt{font-size:15px;font-weight:700;margin-left:-2px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
[data-skin="noir"] .mpa-brand .nt{background:none;color:var(--ink)}
.mpa-apb .sp{flex:1}
.mpa-slot{display:flex;align-items:center;gap:8px;flex:none}
.mpa-sort{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:19px;background:rgba(var(--fg),.09);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.mpa-sort .ic{width:15px;height:15px;stroke-width:2.2}
.mpa-ib{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(var(--fg),.07);color:var(--ink);flex:none}
.mpa-ib .ic{width:19px;height:19px}
.mpa-ib.hot{background:rgba(var(--fg),.16)}
.mpa-pin{position:absolute;left:0;right:0;z-index:40;background:var(--bg)}
.mpa-pin.edge{box-shadow:0 1px 0 var(--line)}
.mpa-cnt{position:absolute;left:0;right:0;bottom:0;overflow:hidden}
.mpa-in{padding-bottom:220px}
/* search field */
.mpa-srch{padding:4px 18px 12px}
.mpa-fld{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:23px;background:rgba(var(--fg),.07);border:1px solid var(--line);font-size:15px;color:var(--ink-dim)}
.mpa-fld .ic{width:18px;height:18px;stroke:var(--ink-dim);stroke-width:2.2}
.mpa-fld .q{color:var(--ink);flex:1}
.mpa-srch.row{display:flex;align-items:center;gap:12px}.mpa-srch.row .mpa-fld{flex:1;min-width:0}.mpa-srch.row .mpa-pair{padding:0}
.land .mpa-srch{padding:4px 40px 12px}.land .mpa-chips{padding:2px 40px 14px}.land .mpa-meta,.land .mpa-row h3,.land .mpa-srchmeta{padding-left:40px;padding-right:40px}.land .mpa-pair{padding-left:40px;padding-right:40px}.land .mpa-srch.row .mpa-pair{padding:0}.land .mpa-track{padding:0 40px 2px}.land .mpa-back{margin:0 40px}
.mpa-fld .clr{font-size:13.5px;font-weight:600;color:var(--ink-soft);padding:0 2px}
/* chip strip (.tabs.discsegs) */
.mpa-chips{display:flex;gap:8px;padding:2px 18px 14px;overflow:hidden}
.mpa-chips b{flex:none;padding:7px 15px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink-soft);background:rgba(var(--fg),.06);white-space:nowrap}
.mpa-chips b.on{background:var(--ink);color:#0a0c13}
[data-skin="noir"] .mpa-chips b.on{color:var(--bg)}
/* ---- THE PAIR (phone) — the album page's .mu-dacts at the sort pill's height ---- */
.mpa-pair{display:flex;gap:8px;padding:0 18px 14px}
.mpa-pb{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px 0 12px;border-radius:12px;font-size:13.5px;font-weight:600;white-space:nowrap;border:1px solid var(--line-2);background:rgba(var(--fg),.06);color:var(--ink)}
.mpa-pb.pri{background:var(--grad);border-color:transparent;color:#fff}
[data-skin="noir"] .mpa-pb.pri{background:var(--ink);color:var(--bg)}
.mpa-pb .ic{width:16px;height:16px}
.mpa-pb .ic.sh{stroke-width:2.1}
.mpa-pb.hit{box-shadow:0 0 0 3px rgba(var(--fg),.18)}
.mpa-pair.pin{padding:2px 18px 12px}
/* C: one ⤮ in the top row, Play all in its menu */
.mpa-menu{position:absolute;right:62px;width:216px;padding:6px;border-radius:14px;background:var(--bg-2);border:1px solid var(--line-2);box-shadow:0 18px 40px rgba(0,0,0,.55);z-index:50}
.mpa-menu div{display:flex;align-items:center;gap:11px;min-height:44px;padding:0 12px;border-radius:10px;font-size:14.5px;color:var(--ink)}
.mpa-menu div.on{background:rgba(var(--fg),.08)}
.mpa-menu .ic{width:18px;height:18px}
/* lists */
.mpa-meta{padding:0 18px 12px;font-size:12px;color:var(--ink-dim)}
.mpa-row{margin-top:22px}
.mpa-row.first{margin-top:4px}
.mpa-row h3{margin:0;font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;padding:0 18px 11px;display:flex;align-items:center;gap:7px}
.mpa-row h3 .more{margin-left:auto;font-family:'Sora',sans-serif;font-size:12px;font-weight:500;color:var(--ink-dim)}
.mpa-track{display:flex;gap:12px;overflow:hidden;padding:0 18px 2px}
.mpa-cv{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;display:flex;align-items:flex-end;padding:9px}
.mpa-cv .wm{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;line-height:1.12;color:#fff;text-wrap:balance;text-shadow:0 1px 8px rgba(0,0,0,.4)}
[data-skin="noir"] .mpa-cv{border-radius:6px}
.mpa-cv.sm{width:48px;height:48px;border-radius:7px;padding:4px;flex:none}
.mpa-cv.sm .wm{font-size:8px}
.mpa-ac{flex:none;width:142px}
.mpa-ac .t{font-size:13px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpa-ac .s{font-size:12px;color:var(--ink-dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpa-g2{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;padding:0 18px}
.mpa-g2 .mpa-ac{width:auto;min-width:0}
.land .mpa-g2{grid-template-columns:repeat(5,1fr);padding:0 40px}
.mpa-g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 10px;padding:0 18px}
.land .mpa-g3{grid-template-columns:repeat(7,1fr);padding:0 40px}
.mpa-arc{text-align:center;flex:none;width:96px}
.mpa-g3 .mpa-arc{width:auto}
.mpa-arc .c{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;color:#fff;margin:0 auto}
.mpa-g3 .mpa-arc .c{width:100%;height:auto;aspect-ratio:1}
.mpa-arc .t{font-size:12.5px;font-weight:600;margin-top:8px;line-height:1.25}
.mpa-arc .s{font-size:11.5px;color:var(--ink-dim);margin-top:1px}
.mpa-list{padding:0 8px}
.land .mpa-list{padding:0 30px}
.mpa-song{display:flex;align-items:center;gap:12px;min-height:62px;padding:7px 10px;border-radius:12px}
.mpa-song .b{flex:1;min-width:0}
.mpa-song .t{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpa-song .s{font-size:12.5px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.mpa-song .ln{font-size:12.5px;color:var(--ink-dim);font-variant-numeric:tabular-nums;flex:none}
.mpa-song .mo{width:30px;display:flex;justify-content:center;color:var(--ink-dim);flex:none}
.mpa-song .mo .ic{width:18px;height:18px}
.mpa-song.on .t{color:var(--accent)}
[data-skin="noir"] .mpa-song.on .t{color:var(--ink)}
.mpa-back{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;margin:0 18px;font-size:13.5px;font-weight:600;color:var(--ink-soft)}
.mpa-srchmeta{padding:0 18px 10px;font-size:12px;color:var(--ink-dim)}
/* loading: static placeholders, no shimmer (canvas rule: no infinite animations) */
.mpa-skl{display:block;border-radius:6px;background:rgba(var(--fg),.08)}
.mpa-skc{aspect-ratio:1;border-radius:10px;background:rgba(var(--fg),.06)}
/* mini player (docked on the bar) */
.mpa-mini{position:absolute;left:10px;right:10px;height:64px;border-radius:15px;display:flex;align-items:center;gap:12px;padding:0 6px 0 8px;background:var(--card-2);border:1px solid var(--line);z-index:71;box-shadow:0 14px 34px rgba(0,0,0,.45);overflow:hidden}
.land .mpa-mini{left:40px;right:40px}
.mpa-mini .pg{position:absolute;left:0;right:0;top:0;height:1.5px;background:rgba(var(--fg),.08)}
.mpa-mini .pg i{display:block;height:100%;width:34%;background:var(--grad)}
[data-skin="noir"] .mpa-mini .pg i{background:var(--ink)}
.mpa-mini .gr{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:26px;height:3px;border-radius:2px;background:var(--line-2)}
.mpa-mini .tx{flex:1;min-width:0}
.mpa-mini .n{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpa-mini .d{font-size:12.5px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;display:flex;gap:5px;align-items:center}
.mpa-mini .d .on{display:inline-flex;align-items:center;gap:4px;color:var(--accent-2)}
[data-skin="noir"] .mpa-mini .d .on{color:var(--ink)}
.mpa-mini .d .on .ic{width:12px;height:12px;stroke-width:2.2}
.mpa-mini .bt{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.mpa-mini .bt .ic{width:22px;height:22px}
/* bottom bar (Listen · Browse · Playing · Queue · Profile) */
.mpa-bnv{position:absolute;left:0;right:0;bottom:0;z-index:72;padding-top:10px;background:var(--bg-2);border-top:1px solid var(--line)}
.mpa-bnv .brow{display:flex;align-items:flex-end}
.land .mpa-bnv .brow{padding:0 120px}
.mpa-bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 0 8px;color:var(--ink-dim)}
.mpa-bn .p{width:56px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.mpa-bn .p .ic{width:26px;height:26px;stroke-width:2}
.mpa-bn b{font-size:11.5px;line-height:16px;font-weight:600}
.mpa-bn.on .p{background:var(--grad);color:#fff}
[data-skin="noir"] .mpa-bn.on .p{background:var(--ink);color:var(--bg)}
.mpa-bn.on b{color:var(--ink)}
.mpa-bn .av{width:28px;height:28px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:11px;color:#fff}
.mpa-bnv .safe{height:22px}
.land .mpa-bnv .safe{height:4px}
.cmpw .mpa-bnv .safe{height:6px}
/* toast (.ph-toast) */
.mpa-tst{position:absolute;left:50%;transform:translateX(-50%);z-index:80;padding:11px 16px;border-radius:12px;background:var(--card-2);border:1px solid var(--line-2);font-size:13.5px;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.mpa-tst .k{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;margin-right:8px;vertical-align:-3px;background:rgba(var(--fg),.12);font-size:11px;font-weight:700}
/* Now playing (tab) — only the first line is this round's */
.mpa-np{position:absolute;left:0;right:0;z-index:50;display:flex;flex-direction:column;padding:0 0 10px}
.mpa-np .top{display:flex;align-items:center;gap:8px;height:58px;padding:0 10px;flex:none}
.mpa-np .top .ctx{flex:1;min-width:0;text-align:center;font-size:12px;color:var(--ink-soft);line-height:1.3}
.mpa-np .top .ctx b{display:block;font-size:13.5px;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpa-np .top .ctx.hl{outline:2px dashed rgba(255,214,102,.75);outline-offset:4px;border-radius:6px}
.mpa-np .top .ib{width:46px;height:46px;display:flex;align-items:center;justify-content:center;flex:none}
.mpa-np .top .ib .ic{width:24px;height:24px}
.mpa-np .ncov{width:84%;margin:8px auto 0;aspect-ratio:1;border-radius:24px;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.mpa-np .ncov .mpa-cv{width:100%;height:100%;border-radius:24px;padding:22px}
.mpa-np .ncov .mpa-cv .wm{font-size:30px}
.mpa-np .meta{padding:0 26px;margin-top:24px}
.mpa-np .meta .t{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700}
.mpa-np .meta .s{font-size:14.5px;color:var(--ink-soft);margin-top:4px}
.mpa-np .seek{margin:20px 26px 0;height:4px;border-radius:3px;background:rgba(var(--fg),.18);position:relative}
.mpa-np .seek i{position:absolute;left:0;top:0;bottom:0;width:22%;border-radius:3px;background:var(--ink)}
.mpa-np .seek u{position:absolute;left:22%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--ink)}
.mpa-np .tm{display:flex;justify-content:space-between;margin:8px 26px 0;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.mpa-np .tp{display:flex;align-items:center;justify-content:space-between;margin:12px 26px 0}
.mpa-np .tp .ic{width:26px;height:26px}
.mpa-np .tp .ic.sm{width:22px;height:22px}
.mpa-np .tp .pp{width:64px;height:64px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center}
.mpa-np .tp .on{color:var(--accent)}
[data-skin="noir"] .mpa-np .tp .on{color:var(--ink)}
.mpa-ann{position:absolute;z-index:90;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:#12141b;background:#ffd666;padding:3px 7px;border-radius:5px;white-space:nowrap}

/* ============ DESKTOP (wide) ============ */
.mpa-dk{width:1120px;height:720px;border-radius:16px;display:grid;grid-template-columns:232px minmax(0,1fr);font-size:13px}
.mpa-side{margin:8px 0 8px 8px;border-radius:12px;background:rgba(var(--fg),.055);border:1px solid rgba(var(--fg),.08);padding:10px;display:flex;flex-direction:column;gap:10px;min-height:0}
.mpa-lights{display:flex;gap:8px;padding:2px 4px 6px}
.mpa-lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.mpa-lights i:nth-child(2){background:#febc2e}.mpa-lights i:nth-child(3){background:#28c840}

/* ---- the detail header: Play · Shuffle · ⋯  (.mu-dacts, with one new control) ---- */
/* the SHIPPED playlist header (.mu-ahead): centred, no artwork, title and count only */
.mpl-ahead{position:relative;padding:70px 18px 0;text-align:center}
.mpl-ahead .mpl-dt{margin-top:0}
.mpl-ahead .mpl-dm.c{justify-content:center}
.mpl-ahead .mpl-dback{top:12px;left:12px}
.mpl-dtop{position:relative}
.mpl-dtop .mpl-cv{width:100%;aspect-ratio:1;max-height:230px}
.mpl-dback{position:absolute;top:12px;left:12px;z-index:3;width:44px;height:44px;border-radius:50%;background:rgba(6,8,14,.72);color:#fff;font-size:26px;line-height:44px;text-align:center}
.mpl-dbody{padding:18px 18px 0}
.mpl-dt{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.mpl-dby{margin-top:6px;font-size:15px;font-weight:600}
.mpl-dm{margin-top:6px;font-size:13px;color:var(--ink-dim);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.mpl-acts{display:flex;gap:10px;margin-top:16px;position:relative}
.mpl-acts .bt{flex:1;height:48px;border-radius:14px;font-family:'Sora',sans-serif;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:rgba(var(--fg),.06);color:var(--ink);min-width:0}
.mpl-acts .bt.pri{background:var(--grad);border-color:transparent;color:#fff}
[data-skin="noir"] .mpl-acts .bt.pri{background:var(--ink);color:var(--bg)}
.mpl-acts .bt .ic{width:18px;height:18px}
/* THE NEW CONTROL: ⋯ at the pair's own height, square, never flexing. 48 px tall like its
   neighbours, 48 px wide so the glyph has the same 44 px tap area the rest of music uses. */
.mpl-acts .mb{flex:none;width:48px;padding:0}
.mpl-acts .mb .ic{width:20px;height:20px}
.mpl-acts .mb.hot{background:rgba(var(--fg),.14)}
.mpl-acts .bt.done{flex:1}
/* shown and disabled, never hidden: an empty playlist keeps Play and Shuffle in place and inert */
.mpl-acts .bt.off,.mpl-acts .bt.pri.off{background:rgba(var(--fg),.05);border-color:var(--line);color:var(--ink-dim)}
[data-skin="noir"] .mpl-acts .bt.pri.off{background:rgba(var(--fg),.05);color:var(--ink-dim)}

/* the editions album's split pair (.mu-dacts.re-acts / .re-split), with the ⋯ added beside it */
.mpl-acts.ed{gap:8px}
.mpl-acts.ed .sp{flex:1;display:flex;gap:1px;min-width:0}
.mpl-acts.ed .sp.sh{flex:.72}
.mpl-acts.ed .sp .bt.a{flex:1;min-width:0;border-radius:14px 0 0 14px;padding:0 10px;gap:6px}
.mpl-acts.ed .sp .bt.dd{flex:none;width:40px;border-radius:0 14px 14px 0;padding:0}
.mpl-acts.ed .sp .bt.dd .ic{width:16px;height:16px}
.mpl-acts.ed .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* ---- the ⋯ menu (.mu-pam) ---- */
.mpl-menu{position:absolute;top:calc(100% + 8px);right:0;z-index:50;min-width:206px;padding:6px;border-radius:14px;background:var(--bg-2);border:1px solid var(--line-2);box-shadow:0 18px 40px rgba(0,0,0,.55)}
.mpl-menu .mi{display:flex;align-items:center;gap:11px;min-height:44px;padding:0 12px;border-radius:10px;color:var(--ink);font-family:'Sora',sans-serif;font-size:14.5px;font-weight:500;white-space:nowrap}
.mpl-menu .mi .ic{width:18px;height:18px;flex:none;color:var(--ink-soft)}
.mpl-menu .mi.bad,.mpl-menu .mi.bad .ic{color:var(--pl-bad)}
.mpl-menu .sep{height:1px;background:var(--line);margin:5px 8px}

/* ---- the track list on a detail page (.mu-trs / .mu-tr) ---- */
.mpl-trs{margin-top:14px}
.mpl-tr{display:grid;grid-template-columns:30px minmax(0,1fr) auto 46px;align-items:center;gap:6px;width:100%;min-height:54px;padding:0 0 0 2px;border-top:1px solid var(--line);color:var(--ink);font-family:'Sora',sans-serif}
.mpl-tr:first-child{border-top:0}
.mpl-tr .n{font-size:13px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.mpl-tr .t{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mpl-tr .t small{font-size:12px;color:var(--ink-dim);font-weight:400;display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpl-tr .ln{font-size:13px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.mpl-tr .mo{display:flex;align-items:center;justify-content:center;color:var(--ink-dim)}
.mpl-tr .mo .ic{width:20px;height:20px}

/* ---- edit mode: the queue's row, its grip and its swipe (.mu-qrow / .mu-handle / .rm) ---- */
.mpl-ed{margin-top:14px}
.mpl-qr{position:relative;overflow:hidden}
.mpl-qr .in{position:relative;display:flex;align-items:center;gap:12px;min-height:62px;padding:7px 8px 7px 18px;background:var(--bg-2)}
.mpl-qr .in .b{flex:1;min-width:0}
.mpl-qr .in .t{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpl-qr .in .s{font-size:12.5px;color:var(--ink-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpl-qr .rm{position:absolute;inset:0;background:var(--pl-bad);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:22px;font-weight:700;font-size:14px;gap:9px}
.mpl-qr .rm .ic{width:19px;height:19px;stroke-width:2.2}
.mpl-qr.lift .in{background:var(--card-2);box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:3}
.mpl-grip{width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--ink-dim)}
.mpl-grip .ic{width:20px;height:20px;stroke-width:2}
/* the gap the lifted row leaves behind */
.mpl-gap{height:62px;background:rgba(var(--fg),.04);border-top:1px dashed var(--line-2);border-bottom:1px dashed var(--line-2)}

/* ---- the queue's labels and its two buttons (.mu-qlab / .mu-qclear) ---- */
.mpl-qlab{display:flex;align-items:center;gap:10px;padding:14px 20px 6px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);white-space:nowrap}
.mpl-qacts{display:flex;gap:8px;padding:2px 20px 10px}
.mpl-qact{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px 0 9px;border-radius:14px;background:rgba(var(--fg),.09);border:1px solid var(--line);color:var(--ink);font-family:'Sora',sans-serif;font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;white-space:nowrap}
.mpl-qact .ic{width:13px;height:13px}

/* ---- the delete confirm (.mp-fail) ---- */
.mpl-cfm{padding:24px 22px 26px;text-align:center}
.mpl-cfm h4{margin:0;font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;letter-spacing:-.01em;color:var(--ink);text-wrap:balance}
.mpl-cfm p{margin:9px 0 0;font-size:14px;line-height:1.5;color:var(--ink-soft)}
.mpl-cfm .acts{display:flex;gap:10px;margin-top:18px}
.mpl-cfm .acts .bt{flex:1;height:50px;border-radius:12px;font-size:15px;font-weight:600;background:rgba(var(--fg),.10);border:1px solid var(--line);color:var(--ink);display:flex;align-items:center;justify-content:center}
.mpl-cfm .acts .bt.bad{background:var(--pl-bad);border-color:transparent;color:#fff}

/* ---- the empty playlist (.mu-empty / .mu-hint) ---- */
.mpl-empty{margin:40px 22px 0;padding:22px;border-radius:16px;border:1px dashed var(--line-2);text-align:center}
.mpl-empty b{display:block;color:var(--ink);font-size:15px;font-weight:600;margin-bottom:6px}
.mpl-empty span{font-size:13.5px;color:var(--ink-soft);line-height:1.5}

/* the picker's one line when the viewer owns no playlist: informative, and it does not restate
   the New playlist row above it */
.mpl-hint{padding:14px 22px 6px;font-size:13px;color:var(--ink-dim);text-align:center}
.mpl-dhint{padding:4px 12px 12px;font-size:12px;color:var(--ink-dim)}

/* a shared playlist's "whose it is" line; no ⋯ anywhere near it */
.mpl-shared{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px;border:1px solid var(--line-2);color:var(--ink-soft)}

/* covers inside this round's own rows */
.mpl-cv{position:relative;border-radius:10px;overflow:hidden;flex:none}
.mpl-cv.sm{width:48px;height:48px;border-radius:7px}
[data-skin="noir"] .mpl-cv{border-radius:6px}

/* toasts: the shipped .mpa-tst, stacked so one frame holds all six */
.mpl-tstack{position:absolute;left:12px;right:12px;z-index:80;display:flex;flex-direction:column;gap:10px;align-items:center}
.mpl-tstack .mpa-tst{position:static;transform:none;max-width:100%;white-space:normal;text-align:center}

/* ============================================================ DESKTOP ==================== */

/* the window's own scrim: a dialog dims the window, a popover does not */
.mpl-dscrim{position:absolute;inset:0;background:rgba(4,5,9,.52);z-index:30}

/* D1 — the picker as a POPOVER anchored to the ⋯ (the lean). The window stays readable, and the
   anchor says which ⋯ was pressed. */
.mpl-pop{position:absolute;z-index:40;width:312px;padding:6px;border-radius:14px;background:var(--bg-2);border:1px solid var(--line-2);box-shadow:0 22px 54px rgba(0,0,0,.6)}
.mpl-pop .hd{padding:10px 12px 8px;font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;color:var(--ink)}
.mpl-pop .hd span{display:block;font-family:'Sora',sans-serif;font-size:12px;font-weight:400;color:var(--ink-dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpl-pop .sc{max-height:286px;overflow:hidden;position:relative}
.mpl-pop .mpl-dpl{border-top:0}
/* the little beak that ties the popover to the ⋯ it came from */
.mpl-pop .beak{position:absolute;top:-6px;width:11px;height:11px;background:var(--bg-2);border-left:1px solid var(--line-2);border-top:1px solid var(--line-2);transform:rotate(45deg)}
/* a ⋯ low in the window opens the SAME popover upward rather than off the bottom edge; the beak
   moves to the bottom so it still names the control it came from */
.mpl-pop.up{transform:translateY(-100%)}
.mpl-pop.up .beak{top:auto;bottom:-6px;border-left:0;border-top:0;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}

/* D2 — the picker as a CENTRED DIALOG */
.mpl-dlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;width:392px;border-radius:16px;background:var(--bg-2);border:1px solid var(--line-2);box-shadow:0 30px 70px rgba(0,0,0,.6);overflow:hidden}
.mpl-dlg.sm{width:360px}
.mpl-dlg .hd{padding:18px 20px 12px}
.mpl-dlg .hd h4{margin:0;font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;letter-spacing:-.01em}
.mpl-dlg .hd .sub{font-size:12.5px;color:var(--ink-dim);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpl-dlg .sc{max-height:300px;overflow:hidden;position:relative}
.mpl-dlg .bd{padding:0 20px 4px}
/* the picker's rows carry their own 10 px, so the body gives back 10 and the tiles line up with
   the dialog's title rather than sitting 10 px to its right */
.mpl-dlg .bd.rows{padding:0 10px 4px}
.mpl-dlg .ft{display:flex;gap:10px;justify-content:flex-end;padding:16px 20px 18px}
.mpl-dlg .ft.wide .bt{flex:1}
.mpl-dfade{position:absolute;left:0;right:0;bottom:0;height:30px;background:linear-gradient(180deg,transparent,var(--bg-2))}

/* a desktop button (.mpa-bt, at dialog scale) */
.mpl-bt{height:36px;padding:0 16px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:13px;background:var(--chip);color:var(--ink);white-space:nowrap;border:1px solid transparent}
.mpl-bt.pri{background:var(--ink);color:var(--bg)}
.mpl-bt.bad{background:var(--pl-bad);color:#fff}
.mpl-bt.off{background:rgba(var(--fg),.07);color:var(--ink-dim);border-color:var(--line)}
.mpl-bt .ic{width:15px;height:15px}

/* a playlist row on the desktop: the same collage · name · N songs at desktop scale */
.mpl-dpl{display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:9px;color:var(--ink)}
.mpl-dpl .col{width:40px;height:40px;border-radius:7px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;flex:none}
.mpl-dpl .col i{display:block}
.mpl-dpl .b{min-width:0}
.mpl-dpl .t{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpl-dpl .s{font-size:11.5px;color:var(--ink-dim);margin-top:2px}
.mpl-dpl.hot{background:rgba(var(--fg),.09)}
.mpl-dnew{width:40px;height:40px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;border:1px dashed var(--line-2);background:rgba(var(--fg),.04);color:var(--ink-soft)}
.mpl-dnew .ic{width:18px;height:18px;stroke-width:2.2}
.mpl-dnewbtn{display:flex;align-items:center;justify-content:center;gap:7px;height:38px;margin:6px 6px 2px;border-radius:9px;border:1px dashed var(--line-2);color:var(--ink);font-size:13px;font-weight:600}
.mpl-dnewbtn .ic{width:15px;height:15px;stroke-width:2.2}
.mpl-dsep{height:1px;background:var(--line);margin:5px 10px}

/* the desktop name field */
.mpl-dfld{display:flex;align-items:center;height:42px;border-radius:10px;background:rgba(var(--fg),.06);border:1px solid var(--line);padding:0 13px;font-size:14.5px}
.mpl-dfld.on{border-color:var(--accent)}
.mpl-dfld.err{border-color:var(--pl-bad)}
.mpl-dfld .ph{color:var(--ink-dim)}
.mpl-dfld .car{width:2px;height:20px;background:var(--accent);margin-left:1px;flex:none}
.mpl-dfld .sel{background:color-mix(in oklch,var(--accent) 36%,transparent);border-radius:2px}
.mpl-dlabel{font-size:11.5px;color:var(--ink-soft);margin:0 0 6px}
.mpl-derr{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;font-weight:600;color:var(--pl-bad)}
.mpl-derr .ic{width:14px;height:14px;stroke-width:2.2}

/* the desktop detail header: title block, then Play · Shuffle · ⋯ */
.mpl-dhead{display:flex;gap:22px;align-items:flex-end;margin:6px 0 22px}
.mpl-dhead .art{width:168px;height:168px;border-radius:12px;flex:none;overflow:hidden}
[data-skin="noir"] .mpl-dhead .art{border-radius:7px}
/* a playlist's art is its four-tile collage, the same one the Playlists chip draws */
.mpl-dhead .art.col{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.mpl-dhead .art.col i{display:block}
.mpl-dhead .art.col.none{display:flex;align-items:center;justify-content:center;border:1px dashed var(--line-2);background:rgba(var(--fg),.04);color:var(--ink-dim)}
.mpl-dhead .art.col.none .ic{width:40px;height:40px;stroke-width:1.6}
.mpl-bt.off{background:rgba(var(--fg),.05);color:var(--ink-dim);border-color:var(--line)}
.mpl-dhead .k{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
.mpl-dhead h1{margin:8px 0 0;font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:700;letter-spacing:-.025em;line-height:1.05}
.mpl-dhead .ml{font-size:12.5px;color:var(--ink-dim);margin-top:10px;display:flex;align-items:center;gap:8px}
.mpl-dhead .btns{display:flex;gap:10px;margin-top:16px;position:relative}
.mpl-dmb{width:38px;padding:0;flex:none}
.mpl-dmb .ic{width:17px;height:17px}
.mpl-dmb.hot{background:rgba(var(--fg),.2)}
.mpl-dmenu{position:absolute;top:calc(100% + 8px);left:0;z-index:40;min-width:196px;padding:5px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line-2);box-shadow:0 20px 48px rgba(0,0,0,.6)}
.mpl-dmenu .mi{display:flex;align-items:center;gap:10px;min-height:34px;padding:0 10px;border-radius:8px;font-size:13.5px;color:var(--ink)}
.mpl-dmenu .mi .ic{width:16px;height:16px;color:var(--ink-soft);flex:none}
.mpl-dmenu .mi.bad,.mpl-dmenu .mi.bad .ic{color:var(--pl-bad)}
.mpl-dmenu .mi.hot{background:rgba(var(--fg),.09)}
.mpl-dmenu .sep{height:1px;background:var(--line);margin:4px 8px}

/* the desktop track table in edit mode: a grip column in front, a × at the end on hover (E1) */
.mpl-dtrk .hd,.mpl-dtrk .tr{display:grid;grid-template-columns:34px minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) 60px 30px;gap:10px;align-items:center;padding:0 10px}
.mpl-dtrk.edit .hd,.mpl-dtrk.edit .tr{grid-template-columns:30px minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) 60px 30px}
.mpl-dtrk .hd{font-size:11.5px;font-weight:700;color:var(--ink-dim);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:6px}
.mpl-dtrk .tr{height:40px;border-radius:8px;font-size:13px}
.mpl-dtrk .tr .nr,.mpl-dtrk .tr .du{color:var(--ink-dim);font-variant-numeric:tabular-nums}
.mpl-dtrk .tr .du{text-align:right}
.mpl-dtrk .tr .dm{color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpl-dtrk .tr .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.mpl-dtrk .tr .gp{color:var(--ink-dim);display:flex;align-items:center;justify-content:center}
.mpl-dtrk .tr .gp .ic{width:16px;height:16px}
.mpl-dtrk .tr .en{display:flex;align-items:center;justify-content:center;color:var(--ink-dim)}
.mpl-dtrk .tr .en .ic{width:16px;height:16px;stroke-width:2.2}
.mpl-dtrk .tr.hot{background:rgba(var(--fg),.08)}
.mpl-dtrk .tr.hot .en{color:var(--ink)}
.mpl-dtrk .tr.lift{background:var(--card-2);box-shadow:0 10px 26px rgba(0,0,0,.5)}
.mpl-dgap{height:40px;border-radius:8px;background:rgba(var(--fg),.04);border:1px dashed var(--line-2)}

/* the desktop queue panel (.qp / .qr) with Save as playlist beside Clear queue */
.mpl-dq{position:absolute;right:10px;top:10px;bottom:86px;width:300px;z-index:12;border-radius:14px;background:var(--bg-2);border:1px solid var(--line-2);box-shadow:0 24px 60px rgba(0,0,0,.5);padding:0 12px;overflow:hidden}
.mpl-dq h5{margin:14px 6px 8px;font-size:12px;color:var(--ink-dim);font-weight:700;display:flex;align-items:center;gap:8px}
.mpl-dq h5 .acts{margin-left:auto;display:flex;gap:6px}
.mpl-dqacts{display:flex;gap:6px;padding:0 6px 8px}
.mpl-dqact{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:13px;background:rgba(var(--fg),.09);border:1px solid var(--line);color:var(--ink);font-size:11.5px;font-weight:600;white-space:nowrap}
.mpl-dqact .ic{width:12px;height:12px}
.mpl-dqr{display:flex;gap:10px;align-items:center;padding:6px;border-radius:8px}
.mpl-dqr .c{width:38px;height:38px;border-radius:6px;flex:none}
.mpl-dqr .b{min-width:0;flex:1}
.mpl-dqr .t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpl-dqr .s{font-size:11.5px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpl-dqr .g{color:var(--ink-dim);display:flex}
.mpl-dqr .g .ic{width:16px;height:16px}
.mpl-dqr.now{background:color-mix(in oklch,var(--accent) 22%,transparent)}

/* an annotation pin on a canvas frame (reused from the last round, .mpa-ann) */
.mpl-pin{position:absolute;z-index:96;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:#12141b;background:#ffd666;padding:3px 7px;border-radius:5px;white-space:nowrap}

/* ---------------------------------------------------------------------------------------
   NEW TOKENS THIS ROUND — the whole list, so a promotion knows what it is taking on.

   --pl-bad   the destructive colour. Ravilo music has no error token of its own: the only
              destructive surface it ships is the queue row's swipe panel, hard-coded #d64541 in
              ravilo-music.css (.mu-qrow .rm). This round needs the same red in four places —
              the swipe panel, Delete in the ⋯ menu, Delete in the confirm, and the name field's
              error border — so it is named once rather than typed four times, and it is given a
              per-skin value because #d64541 reads muddy against Noir's amber-on-near-black.
              Promotion adds the token to ravilo-music.css and leaves .mu-qrow .rm pointing at it.

   Nothing else is new. Every other number in this file is a production number restated, and the
   header comment names the class each one came from.
   --------------------------------------------------------------------------------------- */
[data-skin="aurora"],:root{--pl-bad:#d64541}
[data-skin="midnight"]{--pl-bad:#e2544e}
[data-skin="noir"]{--pl-bad:#e2603f}

/* ---------------------------------------------------------------------------------------
   CANVAS furniture additions. The backdrop is light gray and every word on it is dark ink.
   --------------------------------------------------------------------------------------- */
.mpl-canvas{position:relative;background:#e9eaef;min-height:100vh}
.stage{position:relative}

<script>
/* music-play-all — frame builders (window.MPK). Stand-ins are the brief's and the music mockup's corpus (app/music-data.js);

   settled values for this round are marked NEW. Numbers are what the server would send — nothing is totalled here. */
(function () {
  const IC = {
    play: '<path d="M8 5l11 7-11 7z"/>',
    shuffle: '<path d="M3 7h3.5c5 0 6 10 11 10H21"/><path d="M3 17h3.5c2 0 3.2-1.6 4.2-3.5M14 8.5c1-1 2-1.5 3.5-1.5H21"/><path d="M18.5 4.5 21 7l-2.5 2.5M18.5 14.5 21 17l-2.5 2.5"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="M20.5 20.5l-4.2-4.2"/>',
    chev: '<path d="M6 9l6 6 6-6"/>', down: '<path d="M6 9l6 6 6-6"/>', back: '<path d="M15 5l-7 7 7 7"/>', fwd: '<path d="M9 5l7 7-7 7"/>',

    speaker: '<rect x="6" y="2.5" width="12" height="19" rx="3"/><circle cx="12" cy="14.5" r="3.2"/><circle cx="12" cy="7" r="1"/>',

  /* ---- strings ---- */
  const L = {
    en: { listen: 'Listen', browse: 'Browse', playing: 'Playing', queue: 'Queue', profile: 'Profile', artists: 'Artists', albums: 'Albums', songs: 'Songs', genres: 'Genres', playlists: 'Playlists', books: 'Audiobooks',
      search_ph: 'Search music', clear: 'Clear', r_added: 'Recently added', r_played: 'Recently played', h_artists: 'Artists', see_all: 'See all', sort: 'Recently added',
      songs_n: '{n} songs', albums_n: '{n} albums', artists_n: '{n} artists', no_results: 'Nothing matches “{q}”', fail: 'Couldn’t play this', from: 'Playing from',

      songs_n: '{n} sange', albums_n: '{n} album', artists_n: '{n} kunstnere', no_results: 'Intet matcher “{q}”', fail: 'Kunne ikke afspille', from: 'Afspiller fra',
      play_all: 'Afspil alle', shuffle_all: 'Bland alle', capped: 'Afspiller {shown} af {total} sange', lib: 'Dit bibliotek', srch: null },
    fo: { listen: 'Lurta', browse: 'Kaga', playing: 'Spælir', queue: 'Bíðirøð', profile: 'Profile', artists: 'Tónleikarar', albums: 'Fløgur', songs: 'Løg', genres: 'Sjangrur', playlists: 'Spælilistar', books: 'Ljóðbøkur',
      search_ph: 'Leita í tónleiki', clear: 'Clear', r_added: 'Nýliga lagt afturat', r_played: 'Nýliga spælt', h_artists: 'Tónleikarar', see_all: 'Sí øll', sort: 'Nýliga lagt afturat',
      songs_n: '{n} løg', albums_n: '{n} fløgur', artists_n: '{n} tónleikarar', no_results: 'Einki samsvarar “{q}”', fail: 'Kundi ikki spæla hetta', from: 'Spælir úr',
      play_all: 'Spæl øll', shuffle_all: 'Blanda øll', capped: 'Spælir {shown} av {total} sangum', lib: 'Títt savn', srch: null },
  };
  const NB = '\u00a0';
  const fmtN = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, NB);
  const T = (lang, k, v) => { let s = L[lang][k]; if (s == null) s = L.en[k]; return String(s).replace(/\{(\w+)\}/g, (m, x) => v && v[x] != null ? v[x] : m); };

  /* ---- stand-in corpus (music mockup) ---- */
  const H = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h % 360; };
  const cov = t => { const h = H(t); return `background:radial-gradient(circle at 72% 28%,hsla(${(h + 50) % 360},70%,72%,.55),transparent 46%),linear-gradient(135deg,hsl(${h} 42% 24%),hsl(${(h + 34) % 360} 52% 52%))`; };
  const AL = [['Kite Weather', 'Harbour Lights', 2006], ['Signal Found 20th Anniversary', 'Harbour Lights', 2023], ['Salt on the Window', 'Harbour Lights', 2003], ['Glass Birds', 'Marta Vang', 2004],
    ['Signal Lost', 'Velvet Static', 2005], ['Brim', 'Aldan', 2007], ['Stormur', 'Bylgja', 2005], ['Undertow', 'Sunniva & the Tides', 2004], ['North Atlantic Songbook', 'The Ferrymen', 2002], ['Last Stop, Everybody', 'Nightbus Orchestra', 2000], ['Low Tide Radio', 'Harbour Lights', 2005], ['Myrkrið og ljósið', 'Kvøld', 2006]];
  const FOLK = [AL[0], AL[1], AL[2], ['Low Tide Radio', 'Harbour Lights', 2005], ['Early Recordings', 'Harbour Lights', 2008], AL[3], AL[7], ['Signal Found', 'Harbour Lights', 2003], ['Foghorn Lullabies', 'The Lighthouse Keepers', 2004]];
  const AR = [['Aldan', 1], ['Bylgja', 1], ['Copperline', 1], ['Emil Rask', 1], ['Frost & Fjord', 1], ['Hanna Dal', 1], ['Harbour Lights', 5], ['Jens Holm', 1], ['Kvøld', 2, 1], ['Marta Vang', 3], ['Moss Garden', 2], ['Nightbus Orchestra', 2], ['Ola Brink', 1], ['Skerry', 1, 1], ['Sunniva & the Tides', 1]];
  const SONGS = [['Kite Weather', 'Harbour Lights', 'Kite Weather', '3:36'], ['Northern Line', 'Harbour Lights', 'Kite Weather', '3:58'], ['String and Paper', 'Harbour Lights', 'Kite Weather', '4:40'],
    ['Signal Found', 'Harbour Lights', 'Signal Found', '3:48'], ['Lighthouse Code', 'Harbour Lights', 'Signal Found', '4:10'], ['Salt on the Window', 'Harbour Lights', 'Salt on the Window', '3:52'],
    ['Paper Lanterns', 'Harbour Lights', 'Salt on the Window', '4:10'], ['The Long Way Round', 'Harbour Lights', 'Salt on the Window', '3:31'], ['Weathervane', 'Harbour Lights', 'Salt on the Window', '4:44'], ['Glass Birds', 'Marta Vang', 'Glass Birds', '3:48']];
  const RECENT = [['Salt on the Window', 'Harbour Lights', 'Salt on the Window', '3:52'], ['Glass Birds', 'Marta Vang', 'Glass Birds', '3:48'], ['Signal Lost', 'Velvet Static', 'Signal Lost', '3:41'], ['Night Tram', 'Nightbus Orchestra', 'Last Stop, Everybody', '3:47'], ['Weathervane', 'Harbour Lights', 'Salt on the Window', '4:44']];

  const S_ONE = [['Kvøldsól', 'Kvøld', 'Kvøld', '3:33']];
  const ini = n => n.replace(/^The /, '').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
  const arStyle = (n, noimg) => noimg ? `background:linear-gradient(135deg,hsl(${H(n)} 18% 22%),hsl(${H(n)} 22% 34%))` : cov(n + ' portrait');

  /* ============ PHONE ============ */
  const pc = (t, cls) => `<div class="mpa-cv${cls ? ' ' + cls : ''}" style="${cov(t)}"></div>`;
  const acard = ([t, a, y], yr) => `<div class="mpa-ac">${pc(t)}<div class="t">${t}</div><div class="s">${a}${yr ? ' · ' + y : ''}</div></div>`;
  const arc = ([n, k, noimg], lang, sub) => `<div class="mpa-arc"><div class="c" style="${arStyle(n, noimg)}">${noimg ? ini(n) : ''}</div><div class="t">${n}</div>${sub ? `<div class="s">${T(lang, 'albums_n', { n: k }).replace(/^1 albums$/, '1 album')}</div>` : ''}</div>`;
  const song = ([t, a, al, d], on) => `<div class="mpa-song${on ? ' on' : ''}">${pc(al, 'sm')}<div class="b"><div class="t">${t}</div><div class="s">${a} — ${al}</div></div><span class="ln">${d}</span><span class="mo">${ic('more')}</span></div>`;
  const rowh = (h, more) => `<h3>${h}${more ? `<span class="more">${more} ›</span>` : ''}</h3>`;
  const sk = (w, h, m) => `<span class="mpa-skl" style="width:${w};height:${h}px;${m || ''}"></span>`;
  function pair(lang, o) {
    o = o || {};
    return `<div class="mpa-pair${o.pin ? ' pin' : ''}" data-pair="1"><span class="mpa-pb pri${o.hit === 'play' ? ' hit' : ''}">${ic('play')}${T(lang, 'play_all')}</span><span class="mpa-pb${o.hit === 'shuf' ? ' hit' : ''}">${ic('shuffle', 'sh')}${T(lang, 'shuffle_all')}</span></div>`;
  }
  // Q (v2, "quiet pair"): two 28 px pills in the sort pill's own style, right-aligned on the count line (or alone on a 28 px row where a page has no count)
  function qrow(lang, count, loading) {
    return `<div class="mpa-qrow" data-pair="1">${count != null ? `<span class="c">${loading ? sk('64px', 10) : count}</span>` : ''}<span class="mpa-qb f">${ic('play')}${T(lang, 'play_all')}</span><span class="mpa-qb">${ic('shuffle', 'sh')}${T(lang, 'shuffle_all')}</span></div>`;
  }
  // S (v3, "split"): one control — ▶ Play all | ▾ — the ▾ opens a menu with Shuffle all. Never on a row of its own.
  function split(lang, o) {
    o = o || {};
    return `<span class="mpa-sp${o.top ? ' top' : ''}${o.f ? ' f' : ''}" data-pair="1"><span class="a${o.focus === 'play' ? ' fc' : ''}">${ic('play')}${T(lang, 'play_all')}${o.tabs ? '<span class="mpa-tab">1</span>' : ''}</span><span class="b${o.menu ? ' hot' : ''}${o.focus === 'chev' ? ' fc' : ''}">${ic('chev')}${o.tabs ? '<span class="mpa-tab">2</span>' : ''}</span>${o.menu ? `<span class="mpa-spm"><span class="on${o.focus === 'menu' ? ' fc' : ''}">${ic('shuffle')}${T(lang, 'shuffle_all')}</span></span>` : ''}</span>`;
  }
  function chips(lang, on) {
    return `<div class="mpa-chips">${['artists', 'albums', 'songs', 'genres', 'playlists', 'books'].map(k => `<b class="${k === on ? 'on' : ''}">${T(lang, k)}</b>`).join('')}</div>`;
  }
  const field = (lang, q, right) => `<div class="mpa-srch${right ? ' row' : ''}"><div class="mpa-fld">${ic('search')}${q ? `<span class="q">${q}</span><span class="clr">${T(lang, 'clear')}</span>` : `<span>${T(lang, 'search_ph')}</span>`}</div>${right || ''}</div>`;

  // the page body below the app bar, for one direction. P = the pair's html if this direction puts it inline here.
  function body(o) {
    const lang = o.lang, d = o.dir, land = o.land, A = d === 'A', B = d === 'B', Q = d === 'Q', S = d === 'S', P0 = (A || B) ? pair(lang, { hit: o.hit }) : '', W = A && land && o.page !== 'listen', P = W ? '' : P0;
    const g2 = l => `<div class="mpa-g2">${l.map(x => acard(x, true)).join('')}</div>`;
    const loading = o.loading;
    const meta = s => S ? `<div class="mpa-qrow"><span class="c">${loading ? sk('64px', 10) : s}</span>${split(lang, { f: 1, menu: o.menu })}</div>` : Q ? qrow(lang, s, loading) : `<div class="mpa-meta">${loading ? sk('70px', 10, 'margin-top:2px') : s}</div>`;
    let h = '';
    if (o.page === 'listen') {
      const r1 = `<div class="mpa-row${A && !o.listenAlt || B ? ' first' : ''}">${rowh(T(lang, 'r_added'))}<div class="mpa-track">${AL.slice(0, land ? 6 : 4).map(x => acard(x)).join('')}</div></div>`;
      const r2 = `<div class="mpa-row">${rowh(T(lang, 'r_played'), T(lang, 'see_all'))}<div class="mpa-list">${RECENT.map(x => song(x)).join('')}</div></div>`;
      const r3 = `<div class="mpa-row">${rowh(T(lang, 'h_artists'))}<div class="mpa-track">${AR.slice(5, 11).map(x => arc(x, lang)).join('')}</div></div>`;
      const r4 = `<div class="mpa-row">${rowh('Indie Folk')}<div class="mpa-track">${FOLK.slice(0, 4).map(x => acard(x)).join('')}</div></div>`;
      if (S) return `<div style="height:6px"></div>${r1.replace('class="mpa-row"', 'class="mpa-row first"')}${r2}${r3}${r4}`;

      if ((A || B) && !o.listenAlt) h = `<div style="height:6px"></div>${B ? '' : P}${r1}${r2}${r3}${r4}`;
      else if (A && o.listenAlt) h = `${r1}${r2}<div style="height:16px"></div>${P}${r3.replace('mpa-row"', 'mpa-row" style="margin-top:8px"')}${r4}`;
      else h = r1.replace('mpa-row', 'mpa-row first') + r2 + r3 + r4;
      if (!(A || B) || o.listenAlt) h = '<div style="height:6px"></div>' + h;
      return h;
    }
    const isSearch = o.page.indexOf('search') === 0;
    const q = o.page === 'search' ? 'harbour' : o.page === 'search-empty' ? 'harbor' : o.page === 'search-one' ? 'kvøldsól' : '';
    if (isSearch) {
      h += B ? '' : field(lang, q, W && o.page !== 'search-empty' ? P0 : '');
      if (o.page === 'search-empty') return h + `<div class="mpa-srchmeta">${T(lang, 'no_results', { q })}</div>`;
      h += A ? P : Q ? qrow(lang) : '';
      const sl = o.page === 'search-one' ? S_ONE : S_HARB;
      h += `<div class="mpa-row first">${rowh(T(lang, 'songs'), o.page === 'search' ? T(lang, 'see_all') : '')}<div class="mpa-list">${sl.map(x => song(x)).join('')}</div></div>`;
      if (o.page === 'search') h += `<div class="mpa-row">${rowh(T(lang, 'albums'))}${g2([AL[0], AL[1]])}</div><div class="mpa-row">${rowh(T(lang, 'artists'))}<div class="mpa-g3">${arc(AR[6], lang)}</div></div>`;
      return h;
    }
    const chip = o.page === 'genre' || o.page === 'genre-empty' ? 'albums' : o.page;
    h += B ? '' : field(lang, '', W && o.page !== 'genre-empty' ? P0 : '');
    h += chips(lang, chip);
    if (o.page === 'genre' || o.page === 'genre-empty') {
      const n = o.page === 'genre' ? 9 : 0;
      h += (S && n ? `<div class="mpa-bkrow"><div class="mpa-back">‹ ${T(lang, 'genres')}</div>${split(lang, { f: 1, menu: o.menu })}</div>` : `<div class="mpa-back">‹ ${T(lang, 'genres')}</div>`) + `<div class="mpa-row" style="margin-top:0">${rowh('Indie Folk', '').replace('</h3>', `<span class="more">${T(lang, 'albums_n', { n })}</span></h3>`)}</div>`;
      if (n) h += (A ? P : Q ? qrow(lang) : '') + g2(FOLK.slice(0, land ? 10 : 6));
      return h;
    }
    h += A ? P : '';
    if (o.page === 'albums') h += meta(o.big ? T(lang, 'albums_n', { n: 212 }) : T(lang, 'albums_n', { n: 30 })) + (loading ? `<div class="mpa-g2">${Array.from({ length: land ? 10 : 6 }, () => `<div><div class="mpa-skc"></div>${sk('80%', 10, 'margin-top:10px')}${sk('55%', 9, 'margin-top:6px')}</div>`).join('')}</div>` : g2(AL.slice(0, land ? 10 : 8)));
    if (o.page === 'artists') h += meta(T(lang, 'artists_n', { n: 20 })) + `<div class="mpa-g3">${AR.slice(0, land ? 14 : 12).map(x => arc(x, lang, true)).join('')}</div>`;
    if (o.page === 'songs') h += meta(o.big ? T(lang, 'songs_n', { n: fmtN(3214) }) : T(lang, 'songs_n', { n: 385 })) + (loading ? `<div class="mpa-list">${Array.from({ length: 8 }, () => `<div class="mpa-song"><span class="mpa-skc" style="width:48px;flex:none;border-radius:7px"></span><div class="b">${sk('62%', 11)}${sk('44%', 9, 'margin-top:8px')}</div></div>`).join('')}</div>` : `<div class="mpa-list">${SONGS.map((x, i) => song(x, o.playing && i === 0)).join('')}</div>`);
    return h;
  }
  function bar(lang, on) {
    const it = [['listen', 'listen'], ['browse', 'browse'], ['nowp', 'playing'], ['queue', 'queue']];
    return `<div class="mpa-bnv"><div class="brow">${it.map(([i, k]) => `<div class="mpa-bn${k === on ? ' on' : ''}"><span class="p">${ic(i)}</span><b>${T(lang, k)}</b></div>`).join('')}<div class="mpa-bn"><span class="p"><span class="av">ER</span></span><b>${T(lang, 'profile')}</b></div></div><div class="safe"></div></div>`;
  }
  const NOWS = { t: 'Kite Weather', a: 'Harbour Lights', al: 'Kite Weather' };
