<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ravilo — the .dmg window background, 720 × 520 pt (round mac-open-anyway)</title>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="mac-open-anyway.css">
<style>
  /* Nothing but the background itself. The element is exactly 720 x 520 CSS px, which is
     720 x 520 pt of Finder content area: one image pixel per point at 1x, two at 2x. */
  body{ margin:0; background:#eceef2; }
  #dmg{ margin:0; }
</style>
</head>
<body>

<!-- The background's markup is built by mac-open-anyway.js, so this file and dmg-window.html
     cannot drift apart — the claim the two window frames make is that they show the identical
     image, and two hand-kept copies cannot guarantee that. -->
<div class="moa-dmg" id="dmg" data-dmg-bg></div>

<script src="mac-open-anyway.js"></script>
</body>
</html>
