<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:system-ui,sans-serif;background:#eef1f5;display:flex;flex-wrap:wrap;gap:24px;padding:34px;align-items:flex-start}
.card{border-radius:20px;padding:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px -16px rgba(0,0,0,.4)}
.card img{width:300px;height:auto;display:block}
.lbl{width:100%;font-size:13px;font-weight:700;color:#5a6a80;margin:0 0 -8px}
.small img{width:150px}
.tiny img{width:96px}
</style></head><body>
<p class="lbl">Standalone SVG loaded as &lt;img&gt; — no font dependency</p>
<div class="card" style="background:#fff"><img src="../ravilo/assets/brand/olivar-logo.svg"></div>
<div class="card" style="background:#FFF6E9"><img src="../ravilo/assets/brand/olivar-logo.svg"></div>
<div class="card" style="background:#122A4B"><img src="../ravilo/assets/brand/olivar-logo.svg"></div>
<div class="card small" style="background:#fff"><img src="../ravilo/assets/brand/olivar-logo.svg"></div>
<div class="card tiny" style="background:#eaf1fb"><img src="../ravilo/assets/brand/olivar-logo.svg"></div>
</body></html>
