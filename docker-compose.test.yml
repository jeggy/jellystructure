# CI test stack: builds app + runs Playwright against mock services and real fixtures.
# Usage:
#   ./scripts/build-fixtures.sh
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit
#
# No external secrets needed — all API calls go to the bundled mocks (Jellyfin, TMDB, Bazarr).
# Optional env overrides:
#   FIXTURE_DIR      — path to fixture MKVs on the host (default: /tmp/jellystructure-fixtures)
#   JELLYFIN_USER    — Jellyfin admin username used by Playwright login test (default: admin)
#   JELLYFIN_PASS    — Jellyfin admin password used by Playwright login test (default: password)
#   BAZARR_API_KEY   — key the bazarr-mock service expects (default: mock-bazarr-key)

services:
  jellyfin-mock:
    image: node:20-alpine
    command: node /mock/server.js
    volumes:
      - ./tests/mock-jellyfin:/mock:ro
    environment:
      PORT: 8096
      JELLYFIN_USER: ${JELLYFIN_USER:-admin}
      JELLYFIN_PASS: ${JELLYFIN_PASS:-password}
      MEDIA_ROOT: /media
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8096/Library/VirtualFolders"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - testnet

  tmdb-mock:
    image: node:20-alpine
    command: node /mock/server.js
    volumes:
      - ./tests/mock-tmdb:/mock:ro
    environment:
      PORT: 3001
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/search/movie?query=test"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - testnet

  bazarr-mock:
    image: node:20-alpine
    command: node /mock/server.js
    volumes:
      - ./tests/mock-bazarr:/mock:ro
    environment:
      PORT: 6767
      BAZARR_API_KEY: ${BAZARR_API_KEY:-mock-bazarr-key}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--header=X-API-KEY: ${BAZARR_API_KEY:-mock-bazarr-key}", "http://localhost:6767/api/system/status"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - testnet

  app:
    build:
      context: .
      # CI perf fix (2026-08-18) — ci.yml's old BUILDX_CACHE_FROM/BUILDX_CACHE_TO env vars were never
      # actually consumed by anything: `docker compose build` doesn't read those as a recognized
      # convention, so Docker layer caching has been a complete no-op since it was introduced — every
      # CI run has always done a full cold rebuild. cache_from/cache_to here are the real, Compose
      # Specification-supported way to wire this. Distinct cache scope per image (this repo now builds
      # two) so a webpack/Dockerfile change to one doesn't thrash the other's cache.
      cache_from:
        - type=local,src=${BUILDX_CACHE_DIR:-/tmp/.buildx-cache}/app
      cache_to:
        - type=local,dest=${BUILDX_CACHE_DIR:-/tmp/.buildx-cache}/app-new,mode=max
    user: "0:0"
    ports:
      - "9505:9505"
    volumes:
      - ./config-test:/config
      - ${FIXTURE_DIR:-/tmp/jellystructure-fixtures}:/media:rw
    environment:
      CONFIG_FILE: /config/config.toml
      SESSIONS_FILE: /config/sessions.json
      MEDIA_FILE: /config/media.json
      FRONTEND_DIR: /app/frontend
      SERVER_PORT: 9505
      TMDB_BASE_URL: http://tmdb-mock:3001
    depends_on:
      jellyfin-mock:
        condition: service_healthy
      tmdb-mock:
        condition: service_healthy
      bazarr-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9505/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - testnet

  # Phase 167/168 follow-up — standalone Ravilo web image (:web-static-server + ravilo-web's wasm
  # bundle). Separate from "app" (the admin backend) entirely: no Jellyfin/TMDB config, just the
  # static bundle, since ravilo-web.spec.ts only needs to confirm the app boots and renders (the
  # 2026-08-17 live crash this covers happened before any login attempt).
  ravilo-web:
    build:
      context: .
      dockerfile: ravilo-web/Dockerfile
      cache_from:
        - type=local,src=${BUILDX_CACHE_DIR:-/tmp/.buildx-cache}/ravilo-web
      cache_to:
        - type=local,dest=${BUILDX_CACHE_DIR:-/tmp/.buildx-cache}/ravilo-web-new,mode=max
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 3s
      timeout: 3s
      retries: 15
    networks:
      - testnet

  playwright:
    image: mcr.microsoft.com/playwright:v1.45.0-noble
    working_dir: /tests
    volumes:
      - ./tests:/tests
      - ${FIXTURE_DIR:-/tmp/jellystructure-fixtures}:${FIXTURE_DIR:-/tmp/jellystructure-fixtures}:ro
    environment:
      APP_URL: http://app:9505
      RAVILO_WEB_URL: http://ravilo-web:8080
      FIXTURE_DIR: ${FIXTURE_DIR:-/tmp/jellystructure-fixtures}
      JELLYFIN_USER: ${JELLYFIN_USER:-admin}
      JELLYFIN_PASS: ${JELLYFIN_PASS:-password}
      # Reachable from the "app" container over the shared testnet network — Bazarr's mock is
      # always up in this stack, so bazarr-dashboard.spec.ts never needs a real instance.
      BAZARR_URL: http://bazarr-mock:6767
      BAZARR_API_KEY: ${BAZARR_API_KEY:-mock-bazarr-key}
    command: >
      sh -c "apt-get update -qq && apt-get install -y --no-install-recommends ffmpeg && npm ci && npx playwright install --with-deps chromium && npx playwright test"
    depends_on:
      app:
        condition: service_healthy
      ravilo-web:
        condition: service_healthy
    networks:
      - testnet

networks:
  testnet:
    driver: bridge
