# CI test stack: builds app + runs Playwright against mock services and real fixtures.
# Usage:
#   ./scripts/build-fixtures.sh
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit
#
# No external secrets needed — all API calls go to the bundled mocks (Jellyfin, TMDB, Bazarr, qBittorrent).
# Optional env overrides:
#   FIXTURE_DIR      — path to fixture MKVs on the host (default: /tmp/jellystructure-fixtures)
#   JELLYFIN_USER    — Jellyfin admin username used by Playwright login test (default: admin)
#   JELLYFIN_PASS    — Jellyfin admin password used by Playwright login test (default: password)
#   BAZARR_API_KEY   — key the bazarr-mock service expects (default: mock-bazarr-key)

services:
  jellyfin-mock:
    image: node:20-alpine
    command: node /mock/server.js
    volumes:
      - ./tests/mock-jellyfin:/mock:ro
    environment:
      PORT: 8096
      JELLYFIN_USER: ${JELLYFIN_USER:-admin}
      JELLYFIN_PASS: ${JELLYFIN_PASS:-password}
      MEDIA_ROOT: /media
    healthcheck:
      # Phase 241 — /Library/VirtualFolders now requires a credential, like the real server. The
      # healthcheck has to probe a route that is anonymous BY MEASUREMENT, and /System/Info/Public is
      # exactly that (200 with no Authorization header on the live 12.1.0 server, 2026-09-20) — it is
      # also what the product itself probes in testConnection. Caught by running the suite: the old
      # probe started getting 401 and every container downstream refused to start.
      test: ["CMD", "wget", "-qO-", "http://localhost:8096/System/Info/Public"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - testnet

  tmdb-mock:
    image: node:20-alpine
    command: node /mock/server.js
    volumes:
      - ./tests/mock-tmdb:/mock:ro
    environment:
      PORT: 3001
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/search/movie?query=test"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - testnet

  bazarr-mock:
    image: node:20-alpine
    command: node /mock/server.js
    volumes:
      - ./tests/mock-bazarr:/mock:ro
    environment:
      PORT: 6767
      BAZARR_API_KEY: ${BAZARR_API_KEY:-mock-bazarr-key}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--header=X-API-KEY: ${BAZARR_API_KEY:-mock-bazarr-key}", "http://localhost:6767/api/system/status"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - testnet

  # Phase 263 — the torrent list phase 254's "Replace from clean copy" searches for a damaged file's clean
  # copy. Before it the stack had no qBittorrent, so that path had never run outside a production library.
  qbittorrent-mock:
    image: node:20-alpine
    command: node /mock/server.js
    volumes:
      - ./tests/mock-qbittorrent:/mock:ro
    environment:
      PORT: 8080
      MEDIA_ROOT: /media
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v2/app/version"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - testnet

  app:
    build:
      context: .
      # CI perf fix (2026-08-18) — ci.yml's old BUILDX_CACHE_FROM/BUILDX_CACHE_TO env vars were never
      # actually consumed by anything: `docker compose build` doesn't read those as a recognized
      # convention, so Docker layer caching has been a complete no-op since it was introduced — every
      # CI run has always done a full cold rebuild. cache_from/cache_to here are the real, Compose
      # Specification-supported way to wire this. Distinct cache scope per image (this repo now builds
      # two) so a webpack/Dockerfile change to one doesn't thrash the other's cache.
      cache_from:
        - type=local,src=${BUILDX_CACHE_DIR:-/tmp/.buildx-cache}/app
      cache_to:
        # mode=max (every intermediate layer, incl. the discarded multi-stage builder stage) was
        # ~669MB locally; default mode (final-image layers only) trades away caching a few cheap
        # seconds-long builder-stage COPY steps in exchange for a much smaller export on a runner
        # that may be disk-constrained (2026-08-18).
        - type=local,dest=${BUILDX_CACHE_DIR:-/tmp/.buildx-cache}/app-new
    user: "0:0"
    ports:
      - "9505:9505"
    volumes:
      - ./config-test:/config
      - ${FIXTURE_DIR:-/tmp/jellystructure-fixtures}:/media:rw
    environment:
      CONFIG_FILE: /config/config.toml
      SESSIONS_FILE: /config/sessions.json
      MEDIA_FILE: /config/media.json
      FRONTEND_DIR: /app/frontend
      # Phase 235 — test-stack only, so tests/e2e/ravilo-web-headers.spec.ts can assert the backend's
      # /tv/** path (unset by default in every real deployment; see the phase's open question 2).
      RAVILO_WEB_DIR: /app/ravilo-web-frontend
      SERVER_PORT: 9505
      TMDB_BASE_URL: http://tmdb-mock:3001
      # Phase 197 (FR-197-5) — the whole Playwright suite shares one backend, so its ~5 logins per
      # run sit right on the production 5-per-60s cap; one flaky test retrying re-runs a beforeAll,
      # pushes it over, and fails an unrelated later spec at its login step. Test stack only; no
      # deployment sets this and the code default is unchanged.
      LOGIN_RATE_LIMIT_MAX: "1000"
      # The Ravilo web app is served from another origin (ravilo-web) and signs in here cross-origin —
      # the same shape as production. tests/e2e/ravilo-login.spec.ts checks the preflight.
      # ravilo-screen-cast (phase 248) is the `ravilo-screen` container's SECOND hostname (see that
      # service's own comment) — allow-listed so the cast e2e spec can actually cast, while the bare
      # `ravilo-screen` hostname 247's specs use stays deliberately unlisted.
      CORS_ALLOWED_ORIGINS: "ravilo-web:8080,ravilo-screen-cast:8080"
    depends_on:
      jellyfin-mock:
        condition: service_healthy
      tmdb-mock:
        condition: service_healthy
      bazarr-mock:
        condition: service_healthy
      qbittorrent-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9505/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - testnet

  # Phase 167/168 follow-up — standalone Ravilo web image (:web-static-server + ravilo-web's wasm
  # bundle). Separate from "app" (the admin backend) entirely: no Jellyfin/TMDB config, just the
  # static bundle, since ravilo-web.spec.ts only needs to confirm the app boots and renders (the
  # 2026-08-17 live crash this covers happened before any login attempt).
  ravilo-web:
    build:
      context: .
      dockerfile: ravilo-web/Dockerfile
      cache_from:
        - type=local,src=${BUILDX_CACHE_DIR:-/tmp/.buildx-cache}/ravilo-web
      cache_to:
        - type=local,dest=${BUILDX_CACHE_DIR:-/tmp/.buildx-cache}/ravilo-web-new
    environment:
      # R225 — without this the web app signs in against its OWN origin, a static file server with no
      # /api at all: a 404 on /api/tv/login (seen on production 2026-09-17).
      DEFAULT_SERVER_URL: http://app:9505
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 3s
      timeout: 3s
      retries: 15
    networks:
      - testnet

  # Phase 247 — a second, real HTTP origin for the sideloaded Tizen widget's bundle (ravilo-screen),
  # deliberately NOT added to `app`'s CORS_ALLOWED_ORIGINS above: the whole point of
  # ravilo-screen-cors.spec.ts / ravilo-screen.spec.ts is proving what happens today when a
  # sideloaded-widget origin is NOT on that list (it never can be, in production — see the phase's
  # spec). Never published; test-stack only.
  #
  # Phase 248 needs the SAME bundle reachable from a SECOND, allow-listed hostname — casting has
  # nothing to do with the sideloaded-origin question 247 tests, and re-proving CORS refusal there
  # would just be 247's test again. Rather than build (and pay for) a second image, this one
  # container gets a second DNS name on the test network via `aliases`: `ravilo-screen` stays
  # unlisted (247's own origin), `ravilo-screen-cast` goes on `app`'s CORS_ALLOWED_ORIGINS above,
  # and 248's spec navigates to that alias instead. Same container, same bundle, two hostnames.
  ravilo-screen:
    build:
      context: .
      dockerfile: ravilo-screen/Dockerfile
      cache_from:
        - type=local,src=${BUILDX_CACHE_DIR:-/tmp/.buildx-cache}/ravilo-screen
      cache_to:
        - type=local,dest=${BUILDX_CACHE_DIR:-/tmp/.buildx-cache}/ravilo-screen-new
    environment:
      # Phase 249 — the mock stack talks plain http throughout; web-static-server's CSP otherwise
      # blocks connect-src to it (found via 248's first real CI run). Opt-in and default-off — see
      # cspHeader()'s own doc comment. ravilo-web's real production CSP is untouched by this.
      CSP_ALLOW_HTTP_CONNECT: "1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 3s
      timeout: 3s
      retries: 15
    networks:
      testnet:
        aliases:
          - ravilo-screen-cast

  playwright:
    image: mcr.microsoft.com/playwright:v1.45.0-noble
    working_dir: /tests
    volumes:
      - ./tests:/tests
      - ${FIXTURE_DIR:-/tmp/jellystructure-fixtures}:${FIXTURE_DIR:-/tmp/jellystructure-fixtures}:ro
    environment:
      APP_URL: http://app:9505
      RAVILO_WEB_URL: http://ravilo-web:8080
      RAVILO_SCREEN_URL: http://ravilo-screen:8080
      # Phase 248 — the SAME container's second, allow-listed hostname (see the ravilo-screen
      # service's own comment). ravilo-screen-cast.spec.ts's default (http://app:9505) for
      # APP_URL_FROM_SCREEN already matches this network's naming, so it's left unset here.
      RAVILO_SCREEN_CAST_URL: http://ravilo-screen-cast:8080
      FIXTURE_DIR: ${FIXTURE_DIR:-/tmp/jellystructure-fixtures}
      JELLYFIN_USER: ${JELLYFIN_USER:-admin}
      JELLYFIN_PASS: ${JELLYFIN_PASS:-password}
      # Phase 243 — jellyfin-version.spec.ts asserts the version reaches /api/health AND that the
      # endpoint it is read from answers anonymously, which needs the mock's own address.
      JELLYFIN_URL: http://jellyfin-mock:8096
      # Reachable from the "app" container over the shared testnet network — Bazarr's mock is
      # always up in this stack, so bazarr-dashboard.spec.ts never needs a real instance.
      BAZARR_URL: http://bazarr-mock:6767
      BAZARR_API_KEY: ${BAZARR_API_KEY:-mock-bazarr-key}
    command: >
      sh -c "apt-get update -qq && apt-get install -y --no-install-recommends ffmpeg && npm ci && npx playwright install --with-deps chromium && npx playwright test"
    depends_on:
      app:
        condition: service_healthy
      ravilo-web:
        condition: service_healthy
      ravilo-screen:
        condition: service_healthy
    networks:
      - testnet

networks:
  testnet:
    driver: bridge
