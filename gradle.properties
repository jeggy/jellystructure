org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC
org.gradle.console=plain
# DEB-4106 FR-1 — ride out a transient 5xx on a Maven/Ivy download. Six attempts, the pause doubling from 4 s (4+8+16+32+64 = 124 s), is at
# least two minutes of trying before one artifact fails the build (Gradle's defaults give up within about a second).
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=4000
kotlin.mpp.applyDefaultHierarchyTemplate=false
android.useAndroidX=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# Phase 226 — the Ravilo Android sender's applicationId: ONE value, read by :ravilo-android (its
# applicationId) and by the root BuildInfo generator (the admin's Chromecast card shows it as the
# console's "Package Name"). Not config: a build constant.
ravilo.applicationId=dev.jellystructure.ravilo
